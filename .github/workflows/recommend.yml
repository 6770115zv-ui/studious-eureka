name: Recommend Popular Media
on:
  workflow_dispatch:
    inputs:
      request_id: { required: true, type: string }
      query: { required: false, default: "", type: string }
      channel: { required: false, default: "", type: string }
      sort_by: { required: false, default: "relevance", type: string }
      max_results: { required: false, default: "60", type: string }
      min_views: { required: false, default: "0", type: string }
      exclude_ids: { required: false, default: "", type: string }
      filter_prompt: { required: false, default: "", type: string }
      cookies_enc: { required: false, default: "", type: string }
run-name: rec-${{ inputs.request_id }}
permissions:
  contents: write
jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Deno
        if: contains(inputs.filter_prompt, '[PL_STREAMS]')
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-rec-v23-31
          restore-keys: pip-rec-
      - name: Install yt-dlp + Pillow
        env:
          FILTER_PROMPT: ${{ inputs.filter_prompt }}
        run: |
          python3 -m pip install --upgrade --break-system-packages -q requests cryptography pillow google-genai
          if printf '%s' "$FILTER_PROMPT" | grep -qi '\[PL_STREAMS\]'; then
            python3 -m pip install --upgrade --break-system-packages -q --pre "yt-dlp[default,curl-cffi]" yt-dlp-ejs
          fi
      - name: Smart Multi-Language + Gemini 3.5 Flash-Lite + Sharp WebP Engine
        env:
          REQ_ID: ${{ inputs.request_id }}
          QUERY: ${{ inputs.query }}
          CHANNEL: ${{ inputs.channel }}
          SORT_BY: ${{ inputs.sort_by }}
          MAX_RESULTS: ${{ inputs.max_results }}
          MIN_VIEWS: ${{ inputs.min_views }}
          EXCLUDE_IDS: ${{ inputs.exclude_ids }}
          FILTER_PROMPT: ${{ inputs.filter_prompt }}
          COOKIES_ENC: ${{ inputs.cookies_enc }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 scripts/recommend_engine.py
