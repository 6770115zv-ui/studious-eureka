name: Recommend Popular Media
on:
  workflow_dispatch:
    inputs:
      request_id: { required: true, type: string }
      query: { required: false, default: "", type: string }
      channel: { required: false, default: "", type: string }
      sort_by: { required: false, default: "relevance", type: string }
      max_results: { required: false, default: "60", type: string }
      min_views: { required: false, default: "0", type: string }
      exclude_ids: { required: false, default: "", type: string }
      filter_prompt: { required: false, default: "", type: string }
      cookies_enc: { required: false, default: "", type: string }
run-name: rec-${{ inputs.request_id }}
permissions:
  contents: write
jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Deno
        if: contains(inputs.filter_prompt, '[PL_STREAMS]')
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install yt-dlp + Pillow
        run: |
          PKGS="requests cryptography pillow google-genai"
          if echo "${{ inputs.filter_prompt }}" | grep -qi '\[PL_STREAMS\]'; then
            PKGS="$PKGS yt-dlp[default,curl-cffi] yt-dlp-ejs"
          fi
          python3 -m pip install --upgrade --no-cache-dir --break-system-packages -q --pre $PKGS
      - name: Smart Multi-Language + Gemini 3.5 Flash-Lite + Sharp WebP Engine
        env:
          REQ_ID: ${{ inputs.request_id }}
          QUERY: ${{ inputs.query }}
          CHANNEL: ${{ inputs.channel }}
          SORT_BY: ${{ inputs.sort_by }}
          MAX_RESULTS: ${{ inputs.max_results }}
          MIN_VIEWS: ${{ inputs.min_views }}
          EXCLUDE_IDS: ${{ inputs.exclude_ids }}
          FILTER_PROMPT: ${{ inputs.filter_prompt }}
          COOKIES_ENC: ${{ inputs.cookies_enc }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - << 'EOF'
          import base64, datetime, io, json, math, os, re, subprocess, threading, time, urllib.parse, requests
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from PIL import Image

          req_id = os.environ.get("REQ_ID", "").strip()
          query = os.environ.get("QUERY", "").strip()
          channel_input = os.environ.get("CHANNEL", "").strip()
          sort_raw = os.environ.get("SORT_BY", "relevance").strip()
          max_results = max(10, min(2500, int(os.environ.get("MAX_RESULTS", "60") or 60)))
          min_views = int(os.environ.get("MIN_VIEWS", "0") or 0)
          exclude = set(filter(None, os.environ.get("EXCLUDE_IDS", "").split(",")))
          filter_prompt = os.environ.get("FILTER_PROMPT", "").strip()
          cookies_enc = os.environ.get("COOKIES_ENC", "").strip()
          secret_key_env = os.environ.get("COOKIE_KEY", "").strip().strip("\"'")
          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip().strip("\"'")

          for _m in (cookies_enc, secret_key_env, gemini_key):
              if _m and len(_m) >= 8: print(f"::add-mask::{_m}", flush=True)

          fp_low = filter_prompt.lower()
          high_quality_only = "[hq_only]" in fp_low or "|hq" in sort_raw.lower() or sort_raw.lower() == "quality_score"
          translate_titles = "[tr_he]" in fp_low or "|tr" in sort_raw.lower()
          playlist_mode = "streams" if "[pl_streams]" in fp_low else ("uu_all" if "[pl_uu]" in fp_low else ("uulp" if "[pl_uulp]" in fp_low else "auto"))
          m_dur = re.search(r"\[dur:([a-z0-9_]+)\]", fp_low); dur_filter = m_dur.group(1) if m_dur else "all"
          m_season = re.search(r"\[season:([a-z0-9_]+)\]", fp_low); season_filter = m_season.group(1) if m_season else "all"
          m_il_ids = re.search(r"\[il_ids:([a-zA-Z0-9_,-]+)\]", filter_prompt, flags=re.I)
          il_seed_ids = [x.strip() for x in (m_il_ids.group(1).split(",") if m_il_ids else []) if len(x.strip()) == 11]
          m_langs = re.search(r"\[langs:([a-z,]+)\]", fp_low)
          search_langs = [x.strip() for x in (m_langs.group(1).split(",") if m_langs else ["he", "en", "es"]) if x.strip()]
          expand_queries = "[expand]" in fp_low
          m_ctype = re.search(r"\[ctype:([a-z0-9_]+)\]", fp_low); content_type = m_ctype.group(1) if m_ctype else "all"
          no_gaming = "[no_gaming]" in fp_low
          m_excl = re.search(r"\[excl:([^\]]+)\]", filter_prompt, flags=re.I)
          exclude_terms = [urllib.parse.unquote(x).strip().lower() for x in (m_excl.group(1).split(",") if m_excl else []) if x.strip()]

          SEASON_RANGES = {
              "2026_2027": ("20260801", "20270731", "after:2026-07-31"),
              "2025_2026": ("20250801", "20260731", "after:2025-07-31 before:2026-08-01"),
              "2024_2025": ("20240801", "20250731", "after:2024-07-31 before:2025-08-01"),
              "2023_2024": ("20230801", "20240731", "after:2023-07-31 before:2024-08-01"),
              "2022_2023": ("20220801", "20230731", "after:2022-07-31 before:2023-08-01"),
              "year_2025": ("20250101", "20251231", "after:2024-12-31 before:2026-01-01"),
              "year_2024": ("20240101", "20241231", "after:2023-12-31 before:2025-01-01"),
              "year_2023": ("20230101", "20231231", "after:2022-12-31 before:2024-01-01"),
              "before_2023": ("19900101", "20221231", "before:2023-01-01"),
          }
          season_info = SEASON_RANGES.get(season_filter)
          sort_by = re.sub(r"\|(hq|tr|notr)", "", sort_raw.lower()).strip() or "relevance"
          filter_prompt = re.sub(r"\[(HQ_ONLY|TR_HE|PL_UU|PL_STREAMS|PL_UULP|DUR:[A-Z0-9_]+|SEASON:[A-Z0-9_]+|IL_IDS:[A-Za-z0-9_,-]+|LANGS:[a-z,]+|EXPAND|CTYPE:[A-Z0-9_]+|NO_GAMING|EXCL:[^\]]+)\]", "", filter_prompt, flags=re.I).strip()

          # ====================================================================
          # Enterprise AI Multi-Key Router (google-genai SDK + Live Discovery +
          # Minimal Thinking + Key Pool Rotation + GitHub Models & Groq Backup)
          # ====================================================================
          try:
              from google import genai as _genai
              from google.genai import types as _gtypes
              _GENAI_SDK_VER = getattr(_genai, "__version__", "installed")
              try:
                  import importlib.metadata as _im
                  _GENAI_SDK_VER = _im.version("google-genai")
              except Exception:
                  pass
          except Exception:
              _genai, _gtypes, _GENAI_SDK_VER = None, None, "rest-fallback"

          def _parse_json_lenient(raw_s: str):
              s = re.sub(r"^```(?:json)?\s*|\s*```$", "", str(raw_s or ""), flags=re.S).strip()
              try:
                  return json.loads(s)
              except Exception:
                  m_obj = re.search(r"(\{[\s\S]*\}|\[[\s\S]*\])", s)
                  if not m_obj:
                      raise
                  cleaned = re.sub(r",\s*([}\]])", r"\1", m_obj.group(1))
                  return json.loads(cleaned)

          class AIRouter:
              PREFERRED_GEMINI = [
                  "gemini-3.1-flash-lite",
                  "gemini-3.5-flash-lite",
                  "gemini-3.8-flash",
                  "gemini-3.7-flash",
                  "gemini-3.6-flash",
                  "gemini-3.5-flash",
              ]
              PREFERRED_GROQ_PREFIXES = [
                  "qwen/qwen3.8",
                  "qwen/qwen3",
                  "qwen",
                  "meta-llama/llama-4-maverick",
                  "meta-llama/llama-4-scout",
                  "llama-4",
                  "llama-3.3-70b",
                  "openai/gpt-oss-120b",
                  "openai/gpt-oss-20b",
                  "moonshotai/kimi",
                  "deepseek",
                  "llama-3.1-8b",
                  "gemma",
              ]
              CEREBRAS_MODELS = ["llama-3.3-70b", "qwen-3-32b"]
              OPENROUTER_MODELS = ["qwen/qwen3-32b:free", "meta-llama/llama-3.3-70b-instruct:free"]

              def __init__(self):
                  self.lock = threading.Lock()
                  self.gemini_keys = self._collect_gemini_keys()
                  self.groq_key = os.environ.get("GROQ_API_KEY", "").strip().strip("\"'")
                  self.cerebras_key = os.environ.get("CEREBRAS_API_KEY", "").strip().strip("\"'")
                  self.openrouter_key = os.environ.get("OPENROUTER_API_KEY", "").strip().strip("\"'")
                  for k in self.gemini_keys + [x for x in (self.groq_key, self.cerebras_key, self.openrouter_key) if x]:
                      if k and len(k) >= 8:
                          print(f"::add-mask::{k}", flush=True)

                  self.key_stats = {}
                  for idx, _ in enumerate(self.gemini_keys, 1):
                      self.key_stats[f"Gemini#{idx}"] = {"alias": f"Gemini#{idx}", "provider": "gemini", "status": "ready", "ok": 0, "fail": 0, "last_error": ""}
                  if self.groq_key:
                      self.key_stats["Groq#1"] = {"alias": "Groq#1", "provider": "groq", "status": "ready", "ok": 0, "fail": 0, "last_error": ""}
                  if self.cerebras_key:
                      self.key_stats["Cerebras#1"] = {"alias": "Cerebras#1", "provider": "cerebras", "status": "ready", "ok": 0, "fail": 0, "last_error": ""}
                  if self.openrouter_key:
                      self.key_stats["OpenRouter#1"] = {"alias": "OpenRouter#1", "provider": "openrouter", "status": "ready", "ok": 0, "fail": 0, "last_error": ""}

                  self.dead_keys = set()
                  self.dead_models = set()
                  self.no_thinking_models = set()
                  self.cooldowns = {}
                  self.rr_cursor = 0
                  self.call_log = []
                  self.errors = []
                  self.alerts_he = []
                  self._clients = {}
                  self.discovered_models = []
                  self.discovered_groq_models = []
                  self.gemini_models = self._discover_gemini_models()
                  self.groq_models = self._discover_groq_models()

              def _collect_gemini_keys(self):
                  raw_parts = []
                  for env_name in ("GEMINI_API_KEY", "GEMINI_API_KEYS", "GEMINI_API_KEY_2", "GEMINI_API_KEY_3", "GEMINI_API_KEY_4", "GEMINI_API_KEY_5"):
                      v = os.environ.get(env_name, "")
                      if v:
                          raw_parts.extend(re.split(r"[,;\r\n\s]+", v))
                  out, seen = [], set()
                  for p in raw_parts:
                      cl = p.strip().strip("\"'")
                      if len(cl) >= 16 and cl not in seen:
                          seen.add(cl)
                          out.append(cl)
                  return out

              def has_any_provider(self) -> bool:
                  return bool(self.gemini_keys or self.groq_key or self.cerebras_key or self.openrouter_key)

              def _get_client(self, key_alias: str, api_key: str, timeout_sec: int):
                  if _genai is None or _gtypes is None:
                      return None
                  ck = (key_alias, timeout_sec)
                  with self.lock:
                      if ck in self._clients:
                          return self._clients[ck]
                  try:
                      cl = _genai.Client(api_key=api_key, http_options=_gtypes.HttpOptions(timeout=int(timeout_sec * 1000)))
                      with self.lock:
                          self._clients[ck] = cl
                      return cl
                  except Exception:
                      return None

              def _discover_gemini_models(self):
                  if not self.gemini_keys:
                      return []
                  found = []
                  bad_toks = ("embedding", "imagen", "veo", "tts", "audio", "image", "robotics", "computer-use", "deep-research", "omni", "preview", "exp", "nano", "live", "1.0", "1.5", "2.0", "2.5")
                  for k_i, k_val in enumerate(self.gemini_keys, 1):
                      try:
                          cl = self._get_client(f"Gemini#{k_i}", k_val, 10)
                          if cl is not None:
                              for m in cl.models.list():
                                  name = str(getattr(m, "name", "") or "").replace("models/", "").strip()
                                  actions = [str(a) for a in (getattr(m, "supported_actions", None) or [])]
                                  if not name or (actions and "generateContent" not in actions):
                                      continue
                                  low = name.lower()
                                  if low.startswith("gemini-") and not any(b in low for b in bad_toks):
                                      found.append(name)
                          else:
                              r = requests.get("https://generativelanguage.googleapis.com/v1beta/models", headers={"x-goog-api-key": k_val}, timeout=10)
                              if r.status_code == 200:
                                  for m in (r.json().get("models") or []):
                                      name = str(m.get("name") or "").replace("models/", "").strip()
                                      methods = m.get("supportedGenerationMethods") or []
                                      low = name.lower()
                                      if low.startswith("gemini-") and "generateContent" in methods and not any(b in low for b in bad_toks):
                                          found.append(name)
                          if found:
                              break
                      except Exception as e:
                          self.errors.append(f"gemini_discovery#G{k_i}: {type(e).__name__}: {str(e)[:80]}")

                  self.discovered_models = sorted(set(found))
                  if not found:
                      return list(self.PREFERRED_GEMINI[:4])

                  ranked = []
                  for pref in self.PREFERRED_GEMINI:
                      if pref in found and pref not in ranked:
                          ranked.append(pref)
                  for extra in found:
                      if ("flash" in extra.lower()) and extra not in ranked:
                          ranked.append(extra)
                  print(f"AIRouter live Gemini ladder: {ranked[:5]}", flush=True)
                  return ranked[:5] or list(self.PREFERRED_GEMINI[:4])

              def _discover_groq_models(self):
                  if not self.groq_key:
                      return []
                  found = []
                  bad_toks = ("whisper", "tts", "orpheus", "playai", "guard", "safeguard", "embed", "moderation", "vision-preview", "allam", "distil")
                  try:
                      r = requests.get(
                          "https://api.groq.com/openai/v1/models",
                          headers={"Authorization": f"Bearer {self.groq_key}", "Accept": "application/json"},
                          timeout=10
                      )
                      if r.status_code == 200:
                          for m in (r.json().get("data") or []):
                              mid = str(m.get("id") or "").strip()
                              if not mid or m.get("active") is False:
                                  continue
                              low = mid.lower()
                              if any(b in low for b in bad_toks):
                                  continue
                              found.append(mid)
                      elif r.status_code in (401, 403):
                          self.dead_keys.add("Groq#1")
                          self.key_stats["Groq#1"]["status"] = "invalid_key"
                          self._add_alert("⚠️ מפתח GROQ_API_KEY לא תקין (401/403) — בדוק את ה-Secret ב-GitHub.")
                          return []
                      else:
                          self.errors.append(f"groq_discovery: HTTP {r.status_code}: {r.text[:80]}")
                  except Exception as e:
                      self.errors.append(f"groq_discovery: {type(e).__name__}: {str(e)[:80]}")

                  self.discovered_groq_models = sorted(set(found))
                  if not found:
                      return []
                  ranked = []
                  for pref in self.PREFERRED_GROQ_PREFIXES:
                      for mid in found:
                          if pref in mid.lower() and mid not in ranked:
                              ranked.append(mid)
                  for mid in found:
                      if mid not in ranked:
                          ranked.append(mid)
                  print(f"AIRouter live Groq ladder ({len(found)} found): {ranked[:4]}", flush=True)
                  return ranked[:4]

              def _thinking_cfg(self, model_name: str):
                  if _gtypes is None or model_name in self.no_thinking_models:
                      return None
                  low = model_name.lower()
                  fields = getattr(_gtypes.ThinkingConfig, "model_fields", {}) or {}
                  try:
                      if "gemini-3" in low or "gemini-4" in low:
                          if "thinking_level" in fields:
                              return _gtypes.ThinkingConfig(thinking_level="MINIMAL")
                          if "thinking_budget" in fields:
                              return _gtypes.ThinkingConfig(thinking_budget=0)
                  except Exception:
                      try:
                          if "thinking_budget" in fields:
                              return _gtypes.ThinkingConfig(thinking_budget=0)
                      except Exception:
                          return None
                  return None

              def _call_gemini_once(self, key_alias: str, api_key: str, model_name: str, prompt_text: str, timeout_sec: int):
                  cl = self._get_client(key_alias, api_key, timeout_sec)
                  t_cfg = self._thinking_cfg(model_name)
                  if cl is not None and _gtypes is not None:
                      cfg_kwargs = {"temperature": 0.15, "response_mime_type": "application/json"}
                      if t_cfg is not None:
                          cfg_kwargs["thinking_config"] = t_cfg
                      resp = cl.models.generate_content(
                          model=model_name,
                          contents=prompt_text,
                          config=_gtypes.GenerateContentConfig(**cfg_kwargs),
                      )
                      txt_out = ""
                      cands_r = getattr(resp, "candidates", None) or []
                      if cands_r and getattr(cands_r[0], "content", None) and getattr(cands_r[0].content, "parts", None):
                          txt_out = "".join(
                              str(getattr(p, "text", "") or "")
                              for p in cands_r[0].content.parts
                              if not getattr(p, "thought", False)
                          ).strip()
                      if not txt_out:
                          txt_out = str(getattr(resp, "text", "") or "").strip()
                      if not txt_out:
                          raise RuntimeError("empty_response")
                      return _parse_json_lenient(txt_out)
                  else:
                      gen_cfg = {"temperature": 0.15, "responseMimeType": "application/json"}
                      r = requests.post(
                          f"https://generativelanguage.googleapis.com/v1beta/models/{model_name}:generateContent",
                          headers={"Content-Type": "application/json", "x-goog-api-key": api_key},
                          json={"contents": [{"parts": [{"text": prompt_text}]}], "generationConfig": gen_cfg},
                          timeout=timeout_sec
                      )
                      if r.status_code != 200:
                          raise RuntimeError(f"HTTP {r.status_code}: {r.text[:140]}")
                      parts = ((r.json().get("candidates") or [{}])[0].get("content") or {}).get("parts") or []
                      txt_out = "".join(p.get("text", "") for p in parts if not p.get("thought")).strip()
                      if not txt_out:
                          raise RuntimeError("empty_response")
                      return _parse_json_lenient(txt_out)

              def _call_openai_compat(self, url: str, headers: dict, model_name: str, prompt_text: str, timeout_sec: int, use_json_mode: bool = True):
                  body = {
                      "model": model_name,
                      "temperature": 0.15,
                      "messages": [
                          {"role": "system", "content": "You are a strict JSON API. Return ONLY a single valid JSON object matching the requested schema, with no markdown fences and no extra text."},
                          {"role": "user", "content": prompt_text},
                      ],
                  }
                  if use_json_mode:
                      body["response_format"] = {"type": "json_object"}
                  r = requests.post(url, headers={**headers, "Content-Type": "application/json", "Accept": "application/json"}, json=body, timeout=timeout_sec)
                  if r.status_code == 400 and use_json_mode and any(k in r.text.lower() for k in ("response_format", "json_validate", "json")):
                      return self._call_openai_compat(url, headers, model_name, prompt_text, timeout_sec, use_json_mode=False)
                  if r.status_code != 200:
                      raise RuntimeError(f"HTTP {r.status_code}: {r.text[:140]}")
                  raw_body = (r.text or "").strip()
                  if not raw_body:
                      raise RuntimeError("HTTP 200 empty body")
                  data_j = json.loads(raw_body)
                  content = ((((data_j.get("choices") or [{}])[0]).get("message") or {}).get("content") or "").strip()
                  # הסרת תגיות <think>...</think> אם דגם Qwen/DeepSeek החזיר אותן לפני ה-JSON
                  content = re.sub(r"<think>[\s\S]*?</think>", "", content, flags=re.I).strip()
                  if not content:
                      raise RuntimeError("empty_choices_content")
                  return _parse_json_lenient(content)

              def _record(self, stage, provider, model, key_alias, status, ms, err=""):
                  with self.lock:
                      self.call_log.append({
                          "stage": stage, "provider": provider, "model": model,
                          "key": key_alias, "status": status, "ms": int(ms),
                          "error": str(err)[:110] if err else ""
                      })
                      st = self.key_stats.get(key_alias)
                      if st:
                          if status == "ok":
                              st["ok"] += 1
                              st["status"] = "active"
                          else:
                              st["fail"] += 1
                              st["last_error"] = str(err)[:90]
                      if err:
                          self.errors.append(f"[{stage}] {key_alias}/{model}: {str(err)[:110]}")

              def _add_alert(self, msg_he: str):
                  with self.lock:
                      if msg_he not in self.alerts_he:
                          self.alerts_he.append(msg_he)

              def _try_fast_backups(self, prompt_text: str, stage: str):
                  backups = []
                  if self.groq_key and "Groq#1" not in self.dead_keys:
                      for m in self.groq_models:
                          if m not in self.dead_models:
                              backups.append(("groq", "Groq#1", "https://api.groq.com/openai/v1/chat/completions", {"Authorization": f"Bearer {self.groq_key}"}, m))
                  if self.cerebras_key and "Cerebras#1" not in self.dead_keys:
                      for m in self.CEREBRAS_MODELS:
                          if m not in self.dead_models:
                              backups.append(("cerebras", "Cerebras#1", "https://api.cerebras.ai/v1/chat/completions", {"Authorization": f"Bearer {self.cerebras_key}"}, m))
                  if self.openrouter_key and "OpenRouter#1" not in self.dead_keys:
                      for m in self.OPENROUTER_MODELS:
                          if m not in self.dead_models:
                              backups.append(("openrouter", "OpenRouter#1", "https://openrouter.ai/api/v1/chat/completions", {"Authorization": f"Bearer {self.openrouter_key}"}, m))

                  for prov, alias, url, hdrs, m_name in backups:
                      t0 = time.time()
                      try:
                          res = self._call_openai_compat(url, hdrs, m_name, prompt_text, 18)
                          self._record(stage, prov, m_name, alias, "ok", (time.time() - t0) * 1000)
                          self._add_alert(f"⚡ מעבר אוטומטי מהיר ל-{alias} ({m_name}) עקב עומס רגעי ב-Gemini!")
                          return res, f"{prov}:{m_name.split('/')[-1]}"
                      except Exception as e:
                          es = f"{type(e).__name__}: {str(e)}"
                          self._record(stage, prov, m_name, alias, "fail", (time.time() - t0) * 1000, es)
                          print(f"AIRouter [{stage}] {alias}/{m_name} failed: {es[:130]}", flush=True)
                          with self.lock:
