name: Recommend Popular Media
on:
  workflow_dispatch:
    inputs:
      request_id: { required: true, type: string }
      query: { required: false, default: "", type: string }
      channel: { required: false, default: "", type: string }
      max_results: { required: false, default: "60", type: string }
      min_views: { required: false, default: "100000", type: string }
      exclude_ids: { required: false, default: "", type: string }
      filter_prompt: { required: false, default: "", type: string }
run-name: rec-${{ inputs.request_id }}
permissions:
  contents: write
  models: read
jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install yt-dlp
        run: python3 -m pip install --upgrade --break-system-packages --pre "yt-dlp[default,curl-cffi]" yt-dlp-ejs requests
      - name: Search Channel or All-Time Popular Videos and Filter with Cloud AI
        env:
          REQ_ID: ${{ inputs.request_id }}
          QUERY: ${{ inputs.query }}
          CHANNEL: ${{ inputs.channel }}
          MAX_RESULTS: ${{ inputs.max_results }}
          MIN_VIEWS: ${{ inputs.min_views }}
          EXCLUDE_IDS: ${{ inputs.exclude_ids }}
          FILTER_PROMPT: ${{ inputs.filter_prompt }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import base64, json, os, re, subprocess, urllib.parse, requests
          from concurrent.futures import ThreadPoolExecutor

          query = os.environ.get("QUERY", "").strip()
          channel_input = os.environ.get("CHANNEL", "").strip()
          max_results = max(10, min(150, int(os.environ.get("MAX_RESULTS", "60") or 60)))
          min_views = int(os.environ.get("MIN_VIEWS", "100000") or 100000)
          exclude = set(filter(None, os.environ.get("EXCLUDE_IDS", "").split(",")))
          filter_prompt = os.environ.get("FILTER_PROMPT", "").strip()
          if not filter_prompt:
              filter_prompt = (
                  "הבא אך ורק תוצאות מקצועיות, נקיות וטהורות שעומדות בנושא המבוקש. "
                  "סנן החוצה תכנים זרים וכל תוכן שאינו מתאים למגזר שומר תורה ומצוות."
              )

          def fetch_yt_json(target_url_or_query, limit_str):
              cmd = [
                  "python3", "-m", "yt_dlp",
                  "--force-ipv4", "--dump-json", "--flat-playlist",
                  "--playlist-end", str(limit_str),
                  "--ignore-errors", "--no-warnings",
                  target_url_or_query
              ]
              r = subprocess.run(cmd, capture_output=True, text=True)
              items = []
              for line in r.stdout.splitlines():
                  try:
                      d = json.loads(line)
                      if d.get("id"):
                          items.append(d)
                  except Exception:
                      pass
              return items

          def resolve_channel_videos_url(ch_raw: str):
              """מאתר את כתובת לשונית הווידאו של הערוץ המבוקש מתוך קישור, @handle או שם ערוץ"""
              ch = ch_raw.strip()
              if not ch:
                  return "", ""
              if ch.startswith("http"):
                  base = re.sub(r"/(videos|shorts|streams|playlists|about|featured)/?$", "", ch.rstrip("/"))
                  return base + "/videos", ch
              if ch.startswith("@"):
                  handle = ch.split("/")[0]
                  return f"https://www.youtube.com/{handle}/videos", handle

              # חיפוש הערוץ ביוטיוב (sp=EgIQAg%3D%3D מסנן ערוצים בלבד)
              enc = urllib.parse.quote_plus(ch)
              ch_search_url = f"https://www.youtube.com/results?search_query={enc}&sp=EgIQAg%253D%253D"
              found_channels = fetch_yt_json(ch_search_url, "8")
              best_url = ""
              best_name = ch
              ch_low = ch.lower()

              for entry in found_channels:
                  c_url = entry.get("url") or entry.get("channel_url") or ""
                  c_title = (entry.get("channel") or entry.get("title") or entry.get("uploader") or "").strip()
                  if c_url and ("/@" in c_url or "/channel/" in c_url or "/c/" in c_url):
                      if ch_low in c_title.lower() or not best_url:
                          base = re.sub(r"/(videos|shorts|streams|playlists|about|featured)/?$", "", c_url.rstrip("/"))
                          best_url = base + "/videos"
                          if c_title:
                              best_name = c_title
                          if ch_low in c_title.lower():
                              break

              # גיבוי: שליפת כתובת הערוץ מתוך הסרטון המוביל של הערוץ
              if not best_url:
                  vids = fetch_yt_json(f"ytsearch15:{ch}", "15")
                  for v in vids:
                      v_ch = (v.get("channel") or v.get("uploader") or "").strip()
                      u_url = v.get("uploader_url") or v.get("channel_url") or ""
                      if u_url and (ch_low in v_ch.lower() or not best_url):
                          base = re.sub(r"/(videos|shorts|streams|playlists|about|featured)/?$", "", u_url.rstrip("/"))
                          best_url = base + "/videos"
                          if v_ch:
                              best_name = v_ch
                          if ch_low in v_ch.lower():
                              break

              return best_url, best_name

          en_query = ""
          if query and any("\u0590" <= ch <= "\u05FF" for ch in query):
              try:
                  tr_url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=iw&tl=en&dt=t&q=" + urllib.parse.quote(query)
                  tr_res = requests.get(tr_url, timeout=10)
                  if tr_res.status_code == 200:
                      en_query = "".join(part[0] for part in tr_res.json()[0] if part and part[0]).strip()
              except Exception:
                  pass

          raw = []
          resolved_channel_name = channel_input
          fetch_cap = str(max(120, max_results * 2))

          if channel_input:
              ch_videos_url, resolved_channel_name = resolve_channel_videos_url(channel_input)
              print(f"Channel mode active: '{channel_input}' -> URL='{ch_videos_url}', Name='{resolved_channel_name}'", flush=True)
              tasks = []
              if ch_videos_url:
                  tasks.append((ch_videos_url, fetch_cap))
              if query:
                  tasks.append((f"ytsearch80:{channel_input} {query}", "80"))
                  if en_query and en_query.lower() != query.lower():
                      tasks.append((f"ytsearch60:{channel_input} {en_query}", "60"))
              else:
                  tasks.append((f"ytsearch80:{channel_input}", "80"))

              with ThreadPoolExecutor(max_workers=3) as ex:
                  for batch in ex.map(lambda t: fetch_yt_json(t[0], t[1]), tasks):
                      raw.extend(batch)
          else:
              def yt_most_viewed_url(q_text):
                  enc = urllib.parse.quote_plus(q_text)
                  return f"https://www.youtube.com/results?search_query={enc}&sp=CAMSAhAB"

              search_targets = [
                  (yt_most_viewed_url(query), "120"),
                  (f"ytsearch80:{query}", "80"),
              ]
              if en_query and en_query.lower() != query.lower():
                  search_targets.extend([
                      (yt_most_viewed_url(en_query), "120"),
                      (f"ytsearch80:{en_query}", "80"),
                  ])

              with ThreadPoolExecutor(max_workers=4) as ex:
                  for batch in ex.map(lambda t: fetch_yt_json(t[0], t[1]), search_targets):
                      raw.extend(batch)

          BLOCKED_RX = re.compile(
              r"\b(movie|movies|film|trailer|cinema|netflix|hollywood|actor|actress|romance|dating|"
              r"bikini|sexy|girl|girls|woman|women|lady|ladies|female|wife|girlfriend|bride|"
              r"makeup|make-up|cosmetics|eyeshadow|lipstick|mascara|beauty|skincare|fashion|model|modeling|hairstyle|nails|"
              r"singer|music video|official video|concert|song|lyrics|album|dance|dancing|choreography|prank|tiktok|"
              r"סרט|סרטים|טריילר|קולנוע|סדרה|פרק מלא|שחקן|שחקנית|זמר|זמרת|קליפ|שיר|הופעה|רומנטי|"
              r"בנות|נשים|אישה|בחורה|כלה|איפור|צללית|שפתון|טיפוח|קוסמטיקה|אופנה|דוגמנית|תסרוקת|ריקוד|מתיחה)\b",
              re.IGNORECASE
          )

          STOP_WORDS = {"איך", "מדריך", "הדרכה", "מקצועי", "של", "על", "עם", "the", "and", "for", "how", "to", "in", "of", "with"}
          topic_tokens = []
          for src_q in (query, en_query):
              if not src_q:
                  continue
              for tok in re.split(r"[^\w\u0590-\u05FF]+", src_q.lower()):
                  if len(tok) >= 2 and tok not in STOP_WORDS:
                      topic_tokens.append(tok)

          def matches_topic_strictly(title_str: str, channel_str: str) -> bool:
              if not topic_tokens:
                  return True
              haystack = f"{title_str} {channel_str}".lower()
              return any(tok in haystack for tok in topic_tokens)

          ch_tokens = [
              t for t in re.split(r"[^\w\u0590-\u05FF]+", f"{channel_input} {resolved_channel_name}".lower())
              if len(t) >= 2
          ]

          def matches_channel_strictly(entry_channel: str, entry_uploader_url: str) -> bool:
              if not channel_input:
                  return True
              hay = f"{entry_channel} {entry_uploader_url}".lower()
              if not hay.strip():
                  # סרטונים שחזרו ישירות מתוך כתובת /videos של הערוץ עצמו
                  return True
              return any(tok in hay for tok in ch_tokens)

          seen = set(exclude)
          cands = []
          for e in raw:
              vid = e.get("id")
              title = (e.get("title") or "").strip()
              channel = (e.get("channel") or e.get("uploader") or resolved_channel_name or "").strip()
              up_url = (e.get("uploader_url") or e.get("channel_url") or "").strip()
              if not vid or vid in seen or len(vid) != 11 or not title:
                  continue
              seen.add(vid)
              if BLOCKED_RX.search(f"{title} {channel}"):
                  continue
              if not matches_channel_strictly(channel, up_url):
                  continue
              if query and not matches_topic_strictly(title, channel):
                  continue
              views = int(e.get("view_count") or 0)
              cands.append({
                  "id": vid,
                  "title": title,
                  "url": f"https://www.youtube.com/watch?v={vid}",
                  "channel": channel or resolved_channel_name,
                  "views": views,
                  "duration": int(e.get("duration") or 0),
                  "thumbnail": f"https://i.ytimg.com/vi/{vid}/mqdefault.jpg"
              })

          need_meta = [c for c in cands if c["views"] == 0][:80]
          def enrich(c):
              cmd = ["python3", "-m", "yt_dlp", "--force-ipv4", "--dump-json", "--no-playlist", "--skip-download", "--no-warnings", c["url"]]
              r = subprocess.run(cmd, capture_output=True, text=True)
              try:
                  d = json.loads(r.stdout.splitlines()[0])
                  c["views"] = int(d.get("view_count") or 0)
                  c["duration"] = int(d.get("duration") or c["duration"] or 0)
                  if not c["channel"]:
                      c["channel"] = (d.get("channel") or d.get("uploader") or resolved_channel_name).strip()
              except Exception:
                  pass

          if need_meta:
              with ThreadPoolExecutor(max_workers=12) as ex:
                  list(ex.map(enrich, need_meta))

          cands.sort(key=lambda x: x["views"], reverse=True)

          # במצב חיפוש ערוץ ספציפי, אם סינון הצפיות משאיר מעט מדי תוצאות, נכלול גם סרטונים נוספים של הערוץ כדי להביא עשרות תוצאות
          if channel_input:
              pool = [c for c in cands if c["views"] >= min_views]
              if len(pool) < min(max_results, 25):
                  pool = cands[:]
              pool = pool[:max(max_results + 20, 100)]
          else:
              user_asked_2026 = "2026" in query
              balanced_pool = []
              recent_2026_list = []
              for c in cands:
                  if c["views"] < min_views:
                      continue
                  if not user_asked_2026 and re.search(r"\b2026\b", c["title"]):
                      recent_2026_list.append(c)
                  else:
                      balanced_pool.append(c)
              pool = balanced_pool[:max_results + 20] + recent_2026_list[:8]
              pool.sort(key=lambda x: x["views"], reverse=True)
              if len(pool) < 20:
                  pool = cands[:max_results + 20]

          def call_ai_batch(batch_items, topic_str, ch_str, user_rule):
              compact = [{"id": c["id"], "title": c["title"], "channel": c["channel"]} for c in batch_items]
              sys_msg = (
                  "אתה מסנן תוכן קפדני עבור ציבור שומר תורה ומצוות. "
                  "תפקידך לבדוק את רשימת הסרטונים ולהחזיר אך ורק את המזהים (id) של סרטונים שעומדים בשני תנאים:\n"
                  "1. הם תואמים לערוץ או לנושא המבוקש ואינם שייכים לתחום זר.\n"
                  "2. הם עומדים ב-100% בהנחיית הסינון והנקיות של המשתמש.\n"
                  "החזר אך ורק JSON תקין בפורמט: {\"approved_ids\": [\"id1\", \"id2\"]}"
              )
              usr_msg = (
                  f"ערוץ מבוקש: {ch_str or 'כללי'}\n"
                  f"נושא מבוקש: {topic_str or 'כל תכני הערוץ הנקיים'}\n"
                  f"הנחיית סינון מהמשתמש: {user_rule}\n\n"
                  f"רשימת מועמדים:\n{json.dumps(compact, ensure_ascii=False)}"
              )

              gh_tok = os.environ.get("GH_TOKEN", "").strip()
              gem_key = os.environ.get("GEMINI_API_KEY", "").strip()

              endpoints = []
              if gh_tok:
                  endpoints.append((
                      "https://models.inference.ai.azure.com/chat/completions",
                      {"Authorization": f"Bearer {gh_tok}", "Content-Type": "application/json"},
                      {"model": "gpt-4o-mini", "messages": [{"role": "system", "content": sys_msg}, {"role": "user", "content": usr_msg}], "temperature": 0.0}
                  ))
              if gem_key:
                  endpoints.append((
                      f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={gem_key}",
                      {"Content-Type": "application/json"},
                      {"contents": [{"parts": [{"text": sys_msg + "\n\n" + usr_msg}]}]}
                  ))
              endpoints.append((
                  "https://text.pollinations.ai/openai",
                  {"Content-Type": "application/json"},
                  {"model": "openai", "messages": [{"role": "system", "content": sys_msg}, {"role": "user", "content": usr_msg}], "temperature": 0.0}
              ))

              for url, headers, payload in endpoints:
                  try:
                      resp = requests.post(url, headers=headers, json=payload, timeout=30)
                      if resp.status_code == 200:
                          data = resp.json()
                          text = ""
                          if "choices" in data and data["choices"]:
                              text = data["choices"][0].get("message", {}).get("content", "")
                          elif "candidates" in data and data["candidates"]:
                              text = data["candidates"][0].get("content", {}).get("parts", [{}])[0].get("text", "")
                          clean_txt = re.sub(r"```(?:json)?|```", "", text).strip()
                          m = re.search(r"\{.*\"approved_ids\"\s*:\s*\[.*?\].*\}", clean_txt, re.DOTALL)
                          if m:
                              parsed = json.loads(m.group(0))
                              approved = set(parsed.get("approved_ids") or [])
                              if approved:
                                  return [c for c in batch_items if c["id"] in approved]
                  except Exception:
                      pass
              return batch_items

          approved_all = []
          batch_size = 35
          for i in range(0, len(pool), batch_size):
              chunk = pool[i:i + batch_size]
              approved_all.extend(call_ai_batch(chunk, query, resolved_channel_name, filter_prompt))

          approved_all.sort(key=lambda x: x["views"], reverse=True)
          filtered = approved_all[:max_results]

          payload_bytes = json.dumps({
              "query": query,
              "channel": resolved_channel_name or channel_input,
              "en_query": en_query,
              "filter_prompt": filter_prompt,
              "items": filtered
          }, ensure_ascii=False).encode("utf-8")
          with open("recommendations.json", "wb") as f:
              f.write(payload_bytes)

          gh_repo = os.environ["GH_REPO"]
          gh_token = os.environ["GH_TOKEN"]
          r = requests.post(
              f"https://api.github.com/repos/{gh_repo}/git/blobs",
              headers={"Authorization": f"Bearer {gh_token}", "Accept": "application/vnd.github+json"},
              json={"content": base64.b64encode(payload_bytes).decode("ascii"), "encoding": "base64"},
              timeout=60
          )
          sha = r.json().get("sha", "") if r.status_code == 201 else ""
          with open("rec_notes.txt", "w", encoding="utf-8") as nf:
              nf.write(json.dumps({"blobs": [sha] if sha else []}))
          EOF

          TAG="rec-${REQ_ID}"
          gh release create "$TAG" recommendations.json --repo "$GH_REPO" --title "$TAG" --notes-file rec_notes.txt
