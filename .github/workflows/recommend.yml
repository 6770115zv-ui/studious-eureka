              return re.sub(r"\s+", " ", s).strip()

          HE_POST = [
              (r"\bEXTENDED HIGHLIGHTS\b", "תקציר מורחב"), (r"\b(?:HIGHLIGHTS|HHIHLIGHTS|RESUMEN)\b", "תקציר"),
              (r"\b(?:FULL MATCH|PARTIDO COMPLETO|PARTIDO ENTERO)\b", "משחק מלא"), (r"\bFIRST TEAM\b", "הקבוצה הבוגרת"),
              (r"\bBEST OF\b", "מיטב הרגעים של"), (r"\bFINAL\b", "גמר"), (r"\bVS\.?\b", "נגד"),
              (r"\bTorneo\b", "טורניר"), (r"\bAlev[ií]n\b", "ילדים"), (r"\bInfantil\b", "נערים"),
              (r"\bJuvenil\b", "נוער"), (r"\bCadete\b", "קדטים"), (r"\bBenjam[ií]n\b", "טרום-ילדים"),
              (r"\bEntrenamiento\b", "אימון"), (r"\bGoles\b", "שערים"), (r"\bBar[cç]a Atl[eè]tic\b", "ברצלונה אתלטיק"),
              (r"\bFC Barcelona\b|\bBar[cç]a\b|\bBarcelona\b", "ברצלונה"), (r"\bReal Madrid\b", "ריאל מדריד"),
              (r"\bAtl[eé]tico de Madrid\b", "אתלטיקו מדריד"), (r"\bValencia\b", "ולנסיה"), (r"\bSevilla\b", "סביליה"),
              (r"\bReal Betis\b", "ריאל בטיס"), (r"\bGirona\s*FC\b|\bGirona\b", "ג'ירונה"), (r"\bVillarreal\b", "ויאריאל"),
              (r"\bMalaga\s*CF\b|\bM[aá]laga\b", "מלאגה"), (r"\bAtalanta\b", "אטאלנטה"), (r"\bAl Ahly\b", "אל-אהלי"),
              (r"\bLa\s*Mas[ií]a\b|לה מסיה|לה מאסה", "לה מאסיה"), (r"\bLALIGA EA SPORTS\b|\bLALIGA\b", "לה ליגה"),
              (r"\bOrian Goren\b", "אוריין גורן"), (r"\bLamine Yamal\b|למין ימל|לאמין ימל", "לאמין ימאל"),
              (r"\bPau Cubars[ií]\b", "פאו קובארסי"), (r"\bJoan Garc[ií]a\b|חואן גרסיה|חואן גארסיה", "ז'ואן גרסיה"),
              (r"\bLionel Messi\b|\bLeo Messi\b", "ליונל מסי"), (r"\bAnsu Fati\b", "אנסו פאטי"), (r"\bGavi\b", "גאבי"),
              (r"\bMarc Bernal\b", "מארק ברנאל"), (r"\bDani Olmo\b", "דני אולמו"), (r"\bFerm[ií]n\b", "פרמין"),
              (r"\bEric Garc[ií]a\b", "אריק גרסיה"), (r"\bAndr[eé]s Iniesta\b", "אנדרס אינייסטה"),
              (r"\bדגשים\b|\bהבהרה\b|\bהבהרות\b", "תקציר")
          ]
          def polish_he(t: str) -> str:
              s = strip_noise(t)
              for pat, rep in HE_POST: s = re.sub(pat, rep, s, flags=re.I)
              return re.sub(r"\s+", " ", s).strip()

          def count_foreign_alpha(txt: str) -> int:
              return sum(1 for ch in str(txt or "") if ch.isalpha() and not ("\u0590" <= ch <= "\u05FF"))

          def has_foreign_words(txt: str) -> bool:
              return count_foreign_alpha(txt) >= 3

          def gtrans_post(q_txt: str, sl: str = "auto") -> str:
              for cid in ("gtx", "dict-chrome-ex"):
                  try:
                      r = requests.post("https://translate.googleapis.com/translate_a/single", params={"client":cid,"sl":sl,"tl":"iw","dt":"t","dj":"1"}, data={"q":q_txt}, headers={"User-Agent":UA_STR,"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"}, timeout=14)
                      if r.status_code == 200:
                          tr = "".join(s.get("trans","") for s in (r.json().get("sentences") or []) if "trans" in s).strip()
                          if tr: return tr
                  except Exception: pass
              return ""

          def translate_one_pure_he(orig_s: str) -> str:
              best = polish_he(gtrans_post(orig_s, "auto") or orig_s)
              if not has_foreign_words(best):
                  return best
              # נסה שפות מקור מפורשות (ספרדית / אנגלית / צרפתית / ערבית) על הטקסט המקורי הנקי!
              guess_langs = []
              if re.search(r"[\u0600-\u06FF]", orig_s): guess_langs.append("ar")
              if re.search(r"[áéíóúñ¡¿çèà]|\b(el|la|los|las|del|en|al|gana|contra|partido|torneo|final|goles|juvenil|alev[ií]n|infantil|ni[ñn]o)\b", orig_s, re.I):
                  guess_langs.append("es")
              for lg in ("es", "en", "fr"):
                  if lg not in guess_langs: guess_langs.append(lg)
              best_score = count_foreign_alpha(best)
              for sl in guess_langs:
                  cand = polish_he(gtrans_post(orig_s, sl) or "")
                  if cand:
                      sc = count_foreign_alpha(cand)
                      if sc < best_score:
                          best, best_score = cand, sc
                          if best_score < 3:
                              break
              return best

          if translate_titles and pool:
              need_tr = []
              for idx, it in enumerate(pool):
                  it["orig_title"] = it["title"]
                  src = strip_noise(it["title"])
                  it["title_he"] = src
                  if has_foreign_words(src): need_tr.append((idx, src))

              remaining = []
              if gemini_key and need_tr:
                  for b_s in range(0, len(need_tr), 35):
                      batch = need_tr[b_s:b_s + 35]
                      tr_prompt = (
                          "Translate EVERY SINGLE WORD of every YouTube title below (English, Spanish, Catalan, French, Arabic, etc.) into 100% pure, natural Israeli Hebrew.\n"
                          "RULES:\n"
                          "- Translate ALL Spanish/English youth football words (Torneo->טורניר, Alevín->ילדים, Infantil->נערים, Juvenil->נוער, gana al->מנצחת את, en la final->בגמר, Highlights->תקציר, Full Match->משחק מלא).\n"
                          "- Transliterate ALL club & player names cleanly into Hebrew.\n"
                          "- Leave ZERO untranslated Spanish, English, or French words!\n"
                          f"Return ONLY JSON object: {{\"titles\": [exactly {len(batch)} Hebrew strings in exact order]}}.\n"
                          f"Titles: {json.dumps([p[1] for p in batch], ensure_ascii=False)}"
                      )
                      g_tr, _ = call_gemini_json(tr_prompt, timeout_sec=35)
                      arr_tr = g_tr.get("titles") if isinstance(g_tr, dict) else (g_tr if isinstance(g_tr, list) else None)
                      if isinstance(arr_tr, list) and len(arr_tr) == len(batch):
                          for (item_idx, orig_s), he_t in zip(batch, arr_tr):
                              cleaned_he = polish_he(str(he_t or ""))
                              pool[item_idx]["title_he"] = cleaned_he
                              if has_foreign_words(cleaned_he): remaining.append((item_idx, orig_s))
                      else: remaining.extend(batch)
              else: remaining = need_tr

              if remaining:
                  with ThreadPoolExecutor(max_workers=6) as ex:
                      tr_out = list(ex.map(lambda p: translate_one_pure_he(p[1]), remaining))
                  for (i_idx, _), he_res in zip(remaining, tr_out):
                      pool[i_idx]["title_he"] = he_res

          # ====================================================================
          # הזרמת תמונות ממוזערות חדות (hqdefault 480x360 -> Crop 16:9 -> WebP 82% Base64!)
          # ====================================================================
          def fetch_sharp_webp_thumb(item):
              vid = item.get("id", "")
              if not vid: return
              sess = get_sess()
              for u in (f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg", f"https://i.ytimg.com/vi/{vid}/mqdefault.jpg"):
                  try:
                      r = sess.get(u, timeout=7)
                      if r.status_code == 200 and len(r.content) > 1200:
                          im = Image.open(io.BytesIO(r.content)).convert("RGB")
                          w, h = im.size
                          # חיתוך פסי ה-Letterbox השחורים של hqdefault (480x360 -> 480x270 16:9 חד!)
                          if w == 480 and h == 360: im = im.crop((0, 45, 480, 315))
                          elif w == 640 and h == 480: im = im.crop((0, 60, 640, 420))
                          im = im.resize((320, 180), Image.Resampling.LANCZOS)
                          buf = io.BytesIO()
                          im.save(buf, format="WEBP", quality=82, method=4)
                          b64 = base64.b64encode(buf.getvalue()).decode("ascii")
                          item["thumbnail"] = f"data:image/webp;base64,{b64}"
                          return
                  except Exception:
                      pass

          if pool:
              with ThreadPoolExecutor(max_workers=24) as ex:
                  list(ex.map(fetch_sharp_webp_thumb, pool[:180]))

          # הצעות חיפוש גיבוי אם Gemini לא החזיר
          if not suggested_searches and (clean_q or resolved_ch):
              base_t = clean_q or resolved_ch
              suggested_searches = [f"{base_t} 2026", f"{base_t} 2025/26", f"{base_t} תקציר", f"{base_t} כישרונות חדשים", f"{base_t} שערים ומהלכים", f"{base_t} משחק מלא", f"{base_t} אימון", f"{base_t} דוקומנטרי"]

          for item in pool:
              item.pop("orig_pos", None); item.pop("matched_date_op", None); item.pop("channel_id", None)
              rd = str(item.get("upload_date") or "").strip()
              item["date_formatted"] = f"{rd[6:8]}/{rd[4:6]}/{rd[0:4]}" if (len(rd) == 8 and rd.isdigit()) else item.get("published_rel", "")
              mh = int(item.get("max_height") or 0)
              qb = "4K" if mh >= 2160 else ("1440p" if mh >= 1440 else ("1080p HD" if mh >= 1080 else ("720p" if mh >= 720 else (f"{mh}p" if mh > 0 else ""))))
              item["quality_badge"] = qb
              item["channel"] = " • ".join(p for p in [item["channel"], f"🎬 {qb}" if qb else ""] if p)
              if item.get("title_he"): item["title"] = item["title_he"]

          payload_bytes = json.dumps({
              "query": query, "en_query": en_query, "expanded_queries": expanded_queries,
              "suggested_searches": suggested_searches, "channel": resolved_ch or channel_input,
              "sort_by": sort_by, "ai_status": ai_status, "items": pool
          }, ensure_ascii=False).encode("utf-8")
          with open("recommendations.json", "wb") as f: f.write(payload_bytes)
          gh_repo = os.environ["GH_REPO"]; gh_token = os.environ["GH_TOKEN"]
          r = requests.post(f"https://api.github.com/repos/{gh_repo}/git/blobs", headers={"Authorization":f"Bearer {gh_token}","Accept":"application/vnd.github+json"}, json={"content":base64.b64encode(payload_bytes).decode("ascii"),"encoding":"base64"}, timeout=60)
          sha = r.json().get("sha", "") if r.status_code == 201 else ""
          tag = f"rec-{req_id}"
          subprocess.run(["gh","release","create",tag,"recommendations.json","--repo",gh_repo,"--title",tag,"--notes",json.dumps({"blobs":[sha] if sha else [],"count":len(pool)})], capture_output=True, text=True, check=False)
          EOF
