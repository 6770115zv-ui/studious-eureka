          def fetch_search(q_str: str, sp_param: str = "", target_count: int = 120, must_match_uc: str = "", must_match_name: str = ""):
              if not q_str: return []
              api_url = "https://www.youtube.com/youtubei/v1/search?prettyPrint=false"
              ctx = {"client": {"clientName": "WEB", "clientVersion": "2.20261101.00.00", "hl": "he", "gl": "IL"}}
              payload = {"context": ctx, "query": q_str}
              if sp_param: payload["params"] = sp_param
              collected, seen_vids, visited = [], set(), set()
              max_s_pages = max(5, min(20, (target_count // 18) + 3))
              try:
                  r = requests.post(api_url, headers=build_headers(), json=payload, timeout=15)
                  if r.status_code != 200: return []
                  vids, toks, _ = [], [], []
                  walk_items(r.json(), vids, toks, _)
                  def accept(arr):
                      for v in arr:
                          if v["id"] in seen_vids: continue
                          if must_match_uc and v.get("channel_id") and v["channel_id"] != must_match_uc and v["channel_id"] not in allowed_uc_ids: continue
                          if must_match_name and not v.get("channel_id") and v.get("channel") and v["channel"].strip().lower() != must_match_name.strip().lower(): continue
                          seen_vids.add(v["id"]); collected.append(v)
                  accept(vids); pages = 0
                  while toks and len(collected) < target_count and pages < max_s_pages:
                      nt = toks.pop(0)
                      if nt in visited: continue
                      visited.add(nt); pages += 1
                      rn = requests.post(api_url, headers=build_headers(), json={"context": ctx, "continuation": nt}, timeout=15)
