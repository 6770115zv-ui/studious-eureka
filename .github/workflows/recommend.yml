                                      continue
                                  cd_until = self.cooldowns.get((alias, m_name), 0)
                                  if pass_i == 0 and cd_until > now:
                                      continue
                                  tried_any = True
                                  t0 = time.time()
                                  # דגמי Lite מקבלים 15-16s; דגמי Flash כבדים מקבלים 12s כדי לא לבזבז 24s על 504
                                  m_timeout = min(timeout_sec, 20) if "lite" in m_name else min(timeout_sec, 16)
                                  try:
                                      res = self._call_gemini_once(alias, self.gemini_keys[k_idx], m_name, prompt_text, m_timeout)
                                      self._record(stage, "gemini", m_name, alias, "ok", (time.time() - t0) * 1000)
                                      return res, m_name
                                  except Exception as e:
                                      ms = (time.time() - t0) * 1000
                                      es = f"{type(e).__name__}: {str(e)}"
                                      low_e = es.lower()
                                      if ("400" in low_e or "invalid_argument" in low_e) and ("thinking" in low_e or "budget" in low_e or "level" in low_e) and m_name not in self.no_thinking_models:
                                          self.no_thinking_models.add(m_name)
                                          t_r = time.time()
                                          try:
                                              res = self._call_gemini_once(alias, self.gemini_keys[k_idx], m_name, prompt_text, m_timeout)
                                              self._record(stage, "gemini", m_name, alias, "ok", (time.time() - t_r) * 1000)
                                              return res, m_name
                                          except Exception as e2:
                                              es = f"{type(e2).__name__}: {str(e2)}"
                                              low_e = es.lower()
                                      stage_gem_fails += 1
                                      self._record(stage, "gemini", m_name, alias, "fail", ms, es)
                                      print(f"AIRouter [{stage}] {alias}/{m_name} failed ({int(ms)}ms): {es[:130]}", flush=True)
                                      _bad_k_alert = False
                                      with self.lock:
                                          if "401" in low_e or "403" in low_e or "api_key_invalid" in low_e or "permission_denied" in low_e:
                                              self.dead_keys.add(alias)
                                              self.key_stats[alias]["status"] = "invalid_key"
                                              _bad_k_alert = True
                                          elif "404" in low_e or "not_found" in low_e:
                                              self.dead_models.add(m_name)
                                          elif "429" in low_e or "resource_exhausted" in low_e or "quota" in low_e:
                                              self.cooldowns[(alias, m_name)] = time.time() + 30
                                              self.key_stats[alias]["status"] = "quota_429"
                                          elif "504" in low_e or "500" in low_e or "internal" in low_e or "deadline_exceeded" in low_e or "timeout" in low_e:
                                              self.cooldowns[(alias, m_name)] = time.time() + 14
                                              self.key_stats[alias]["status"] = "busy_503"
                                          elif "503" in low_e or "unavailable" in low_e or "high demand" in low_e:
                                              self.cooldowns[(alias, m_name)] = time.time() + 10
                                              self.key_stats[alias]["status"] = "busy_503"
                                      if _bad_k_alert:
