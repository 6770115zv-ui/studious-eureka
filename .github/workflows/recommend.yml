                          self.rr_cursor += 1
                      key_indices = [(start_k + i) % len(self.gemini_keys) for i in range(len(self.gemini_keys))]

                      for pass_i in range(2):
                          now = time.time()
                          tried_any = False
                          models_to_try = self.gemini_models if pass_i == 0 else self.gemini_models[:2]
                          for m_name in models_to_try:
                              if m_name in self.dead_models:
