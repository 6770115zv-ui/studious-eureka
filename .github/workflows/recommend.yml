                          ch_runs = ((vr.get("ownerText") or vr.get("longBylineText") or vr.get("shortBylineText") or {}).get("runs") or [])
                          ch_id = next(((((r_i.get("navigationEndpoint") or {}).get("browseEndpoint") or {}).get("browseId") or "") for r_i in ch_runs if (((r_i.get("navigationEndpoint") or {}).get("browseEndpoint") or {}).get("browseId") or "").startswith("UC")), "")
                          out_vids.append({"id":vid,"title":title.strip(),"channel":"".join(r.get("text","") for r in ch_runs).strip(),"channel_id":ch_id,"view_count":parse_views_text(vc_txt),"published_rel":pub_rel.strip(),"duration":dur_sec})
