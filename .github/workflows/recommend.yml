name: Recommend Popular Media
on:
  workflow_dispatch:
    inputs:
      request_id: { required: true, type: string }
      query: { required: true, type: string }
      min_views: { required: false, default: "1000000", type: string }
      exclude_ids: { required: false, default: "", type: string }
run-name: rec-${{ inputs.request_id }}
permissions: { contents: write }
jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install yt-dlp
        run: python3 -m pip install --upgrade --break-system-packages "yt-dlp[default,curl-cffi]" requests
      - name: Search Historical Popular Videos
        env:
          REQ_ID: ${{ inputs.request_id }}
          QUERY: ${{ inputs.query }}
          MIN_VIEWS: ${{ inputs.min_views }}
          EXCLUDE_IDS: ${{ inputs.exclude_ids }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import base64, json, os, re, subprocess, requests
          from concurrent.futures import ThreadPoolExecutor

          query = os.environ.get("QUERY", "").strip()
          min_views = int(os.environ.get("MIN_VIEWS", "1000000") or 1000000)
          exclude = set(filter(None, os.environ.get("EXCLUDE_IDS", "").split(",")))

          # חיפוש מורחב שכולל גם מונחי שיא היסטוריים להבאת הסרטונים הנצפים אי פעם
          search_queries = [
              f"ytsearch100:{query} best moments all time",
              f"ytsearch80:{query} top plays",
              f"ytsearch60:{query}"
          ]

          def fetch_search(q):
              cmd = ["yt-dlp", "--dump-json", "--flat-playlist", "--ignore-errors", "--no-warnings", q]
              r = subprocess.run(cmd, capture_output=True, text=True)
              items = []
              for line in r.stdout.splitlines():
                  try:
                      d = json.loads(line)
                      if d.get("id"): items.append(d)
                  except: pass
              return items

          raw = []
          with ThreadPoolExecutor(max_workers=3) as ex:
              for batch in ex.map(fetch_search, search_queries):
                  raw.extend(batch)

          seen = set(exclude)
          cands = []
          for e in raw:
              vid = e.get("id")
              title = (e.get("title") or "").strip()
              if not vid or vid in seen or len(vid) != 11 or not title: continue
              seen.add(vid)
              views = int(e.get("view_count") or 0)
              cands.append({
                  "id": vid,
                  "title": title,
                  "url": f"https://www.youtube.com/watch?v={vid}",
                  "channel": (e.get("channel") or e.get("uploader") or "").strip(),
                  "views": views,
                  "duration": int(e.get("duration") or 0),
                  "thumbnail": f"https://i.ytimg.com/vi/{vid}/mqdefault.jpg"
              })

          # השלמת נתוני צפיות לחלק שלא מחזיר בחיפוש שטוח
          need_meta = [c for c in cands if c["views"] == 0][:50]
          def enrich(c):
              cmd = ["yt-dlp", "--dump-json", "--no-playlist", "--skip-download", "--no-warnings", c["url"]]
              r = subprocess.run(cmd, capture_output=True, text=True)
              try:
                  d = json.loads(r.stdout.splitlines()[0])
                  c["views"] = int(d.get("view_count") or 0)
                  c["duration"] = int(d.get("duration") or c["duration"] or 0)
              except: pass

          if need_meta:
              with ThreadPoolExecutor(max_workers=10) as ex:
                  list(ex.map(enrich, need_meta))

          # מיון לפי כמות צפיות מוחלטת (מהגבוה ביותר לנמוך ביותר)
          cands.sort(key=lambda x: x["views"], reverse=True)
          filtered = [c for c in cands if c["views"] >= min_views][:30]
          if not filtered: filtered = cands[:30]

          payload_bytes = json.dumps({"query": query, "items": filtered}, ensure_ascii=False).encode("utf-8")
          with open("recommendations.json", "wb") as f:
              f.write(payload_bytes)

          gh_repo = os.environ["GH_REPO"]
          gh_token = os.environ["GH_TOKEN"]
          r = requests.post(
              f"https://api.github.com/repos/{gh_repo}/git/blobs",
              headers={"Authorization": f"Bearer {gh_token}", "Accept": "application/vnd.github+json"},
              json={"content": base64.b64encode(payload_bytes).decode("ascii"), "encoding": "base64"},
              timeout=60
          )
          sha = r.json().get("sha", "") if r.status_code == 201 else ""
          with open("rec_notes.txt", "w", encoding="utf-8") as nf:
              nf.write(json.dumps({"blobs": [sha] if sha else []}))
          EOF

          TAG="rec-${REQ_ID}"
          gh release create "$TAG" recommendations.json --repo "$GH_REPO" --title "$TAG" --notes-file rec_notes.txt