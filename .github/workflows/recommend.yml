              if high_quality_only and ("#shorts" in tl or (0 < d < 65)): return False
              if dur_filter == "no_shorts": return d == 0 or d >= 61
              if dur_filter == "clips": return d == 0 or (60 <= d <= 1200)
              if dur_filter == "long": return d >= 1200
              if dur_filter == "short5": return 0 < d <= 300
              return True
          selected_pool = [c for c in selected_pool if match_dur(c)]
          if high_quality_only: selected_pool = [c for c in selected_pool if (c.get("max_height", 0) >= 1080 or c.get("max_height", 0) == 0)]
          if min_views > 0: selected_pool = [c for c in selected_pool if int(c.get("views") or 0) >= min_views]

          # סינון, דירוג ונימוק AI קומפקטי (2 מקבצים × 90 סרטונים = 2 קריאות בלבד, מהיר ועמיד לעומס!)
          ai_status = ""
          used_models = []
          ai_sent_by_q = {}
          if filter_prompt:
              if not ai_router.has_any_provider():
                  ai_status = "⚠️ סינון AI כבוי (חסר מפתח AI ב-Secrets)"
              elif selected_pool:
                  ai_slice = selected_pool[:min(len(selected_pool), max(max_results * 2, 180))]
                  for it_s in ai_slice:
                      sq_s = it_s.get("source_q") or ""
                      if sq_s:
                          ai_sent_by_q[sq_s] = ai_sent_by_q.get(sq_s, 0) + 1
                  chunk_sz = 90
                  chunks_ai = [(off, ai_slice[off:off + chunk_sz]) for off in range(0, len(ai_slice), chunk_sz)]

                  def _score_ai_chunk(pair, attempt_tag=""):
                      offset, sub_items = pair
                      compact = [[
                          offset + idx,
                          str(it.get("title") or "")[:115],
                          str(it.get("channel") or "")[:36],
                          int(it.get("views") or 0)
                      ] for idx, it in enumerate(sub_items)]
                      ai_prompt = (
                          f"Query=\"{query or 'N/A'}\" | Channel=\"{resolved_ch or 'Any'}\" | Type={content_type}\n"
                          + (f"Strategy: {ai_strategy_he}\n" if ai_strategy_he else "")
                          + f"User Modesty/Focus Rule: {filter_prompt}\n"
                          + "IMPORTANT MULTI-CONCEPT SCORING RUBRIC (DO NOT require EVERY query word to appear in the same title!):\n"
                          + "  * Score 9-10 (Top ~12%): Directly combines ALL core parts of the user's query.\n"
                          + "  * Score 7-8 (Strong): Strongly covers most core concepts or the primary entity/angle of the query.\n"
                          + "  * Score 5-6 (Related Gems): Quality video tightly relevant to ONE core angle of this theme (specific key figure, interview, podcast, or deep breakdown).\n"
                          + "  * DROP (<5): Confused/similar-named wrong entity, gaming/FIFA/EA FC (unless asked), unrelated topics/celebrities, clickbait spam, or filter-rule violations.\n"
                          + "Note: 'ללא דמויות אחרות' means no unrelated people/topics — directly relevant figures within the requested subject are WELCOME!\n"
                          + "CRITICAL RECALL TARGET: Aim to keep ~22 to 40 valid items from this 90-item batch! If fewer than 20 items qualify for scores 7-10, actively include strong Tier 3 (score 5-6) related club/youth/podcast/press-conference videos so good videos are not over-pruned. Write a crisp Hebrew reason (3-6 words) per kept video.\n"
                          + "Return ONLY compact JSON: {\"k\": [[id, score, \"סיבה קצרה בעברית\"]]}\n"
                          + f"Items: {json.dumps(compact, ensure_ascii=False)}"
                      )
                      st_lbl = f"scorer_{offset // chunk_sz + 1}{attempt_tag}"
                      return call_gemini_json(ai_prompt, timeout_sec=24, stage=st_lbl)

                  score_map, reason_map = {}, {}
                  failed_chunks = []

                  def _ingest_ai_resp(g_data, m_used):
                      if m_used and m_used not in used_models:
                          used_models.append(m_used)
                      if not isinstance(g_data, dict):
                          return False
                      rows = g_data.get("k") if isinstance(g_data.get("k"), list) else (g_data.get("keep") if isinstance(g_data.get("keep"), list) else None)
                      if rows is None:
                          return False
                      for r in rows:
                          idx_r, sc_r, rs_r = None, 7, ""
                          try:
                              if isinstance(r, list) and len(r) >= 2 and str(r[0]).strip().isdigit():
                                  idx_r = int(str(r[0]).strip())
                                  sc_r = int(float(r[1] or 7))
                                  rs_r = str(r[2] or "").strip() if len(r) >= 3 else ""
                              elif isinstance(r, dict) and str(r.get("i", "")).strip().isdigit():
                                  idx_r = int(str(r["i"]).strip())
                                  sc_r = int(float(r.get("s") or 7))
                                  rs_r = str(r.get("r") or "").strip()
                          except Exception:
                              idx_r = None
                          if idx_r is not None and sc_r >= 4:
                              score_map[idx_r] = min(10, max(4, sc_r))
                              if rs_r:
                                  reason_map[idx_r] = rs_r[:90]
                      return True

                  # על מפתח Gemini בודד מריצים בטור עם 0.6 שנ' רווח למניעת פרץ 429/503; עם 2+ מפתחות רצים במקביל!
                  if len(ai_router.gemini_keys) >= 2 or ai_router.groq_key or ai_router.cerebras_key:
                      with ThreadPoolExecutor(max_workers=len(chunks_ai)) as ex:
                          for pair_c, (g_data, m_used) in zip(chunks_ai, ex.map(_score_ai_chunk, chunks_ai)):
                              if not _ingest_ai_resp(g_data, m_used):
                                  failed_chunks.append(pair_c)
                  else:
                      for c_i, pair_c in enumerate(chunks_ai):
                          if c_i > 0:
                              time.sleep(0.6)
                          g_data, m_used = _score_ai_chunk(pair_c)
                          if not _ingest_ai_resp(g_data, m_used):
                              failed_chunks.append(pair_c)

                  # ניסיון חוזר אחד למקבצים שנפלו כדי שלא נישאר עם 5 תוצאות בלבד
                  if failed_chunks:
                      time.sleep(2.5)
                      for pair_c in failed_chunks:
                          g_data, m_used = _score_ai_chunk(pair_c, "_retry")
                          _ingest_ai_resp(g_data, m_used)

                  if score_map:
                      filtered = []
                      for idx, it in enumerate(ai_slice):
                          if idx in score_map:
                              it["ai_score"] = score_map[idx]
                              if idx in reason_map:
                                  it["ai_reason"] = reason_map[idx]
                              filtered.append(it)
                      m_lbl = used_models[0] if used_models else "ai"
                      if filtered:
                          selected_pool = filtered
                          ai_status = f"🤖 {m_lbl} ({len(filtered)}/{len(ai_slice)})"
                      else:
                          ai_status = f"🤖 {m_lbl} (מוצגות כל התוצאות)"
                  else:
                      ai_status = "⚠️ שרתי ה-AI בעומס זמני (מוצגות תוצאות ללא סינון AI)"
          if sort_by == "relevance": selected_pool.sort(key=lambda x: (int(x.get("ai_score") or 0) * 1.8 + math.log10(max(0, int(x.get("views") or 0)) + 1), int(x.get("views") or 0)), reverse=True)
          elif sort_by == "likes": selected_pool.sort(key=lambda x: (int(x.get("likes") or 0), int(x.get("views") or 0)), reverse=True)
          elif sort_by == "quality_score": selected_pool.sort(key=lambda x: (int(x.get("max_height") or 0) >= 1080, int(x.get("likes") or 0) * 25 + int(x.get("views") or 0)), reverse=True)
          elif sort_by == "date_desc": selected_pool.sort(key=lambda x: (str(x.get("upload_date") or "00000000"), -int(x.get("orig_pos") or 0)), reverse=True)
          elif sort_by == "date_asc": selected_pool.sort(key=lambda x: (str(x.get("upload_date") or "99999999"), int(x.get("orig_pos") or 0)), reverse=False)
          else: selected_pool.sort(key=lambda x: (int(x.get("views") or 0), int(x.get("likes") or 0)), reverse=True)

          pool = selected_pool[:max_results]
          ai_passed_by_q = {}
          for it_k in selected_pool:
              sq_k = it_k.get("source_q") or ""
              if sq_k: ai_passed_by_q[sq_k] = ai_passed_by_q.get(sq_k, 0) + 1
          _sent_map = ai_sent_by_q if "ai_sent_by_q" in locals() else {}
          query_stats = []
          for eq in expanded_queries:
              qm = query_meta_map.get(eq.lower()) or {}
              sent_n = _sent_map.get(eq, 0)
              pass_n = ai_passed_by_q.get(eq, 0)
              base_note = qm.get("note_he", "")
              eff_tag = f" (✓ {pass_n}/{sent_n} עברו AI)" if sent_n > 0 else ""
              query_stats.append({
                  "q": eq,
                  "angle": qm.get("angle", "direct"),
                  "note_he": (base_note + eff_tag).strip(),
                  "hits": len(query_hits_map.get(eq, set())),
                  "sent_to_ai": sent_n,
                  "passed_ai": pass_n
              })
          ai_trace = {
              "planner_model": planner_model_used or "",
              "scorer_model": (used_models[0] if "used_models" in locals() and used_models else ""),
              "skipped_models": sorted(dead_gemini_models),
              "gemini_errors": ai_router.errors[:12],
              "ai_infra": ai_router.export_telemetry(),
              "strategy_he": ai_strategy_he,
              "queries": query_stats,
              "refinement_tips_he": ai_refinement_tips,
              "pipeline": {
                  "raw_total": len(raw),
                  "unique_cands": len(cands),
                  "sent_to_ai": sum(_sent_map.values()) if _sent_map else 0,
                  "ai_kept": len(selected_pool),
                  "final_shown": len(pool)
              },
              "prompts_summary": {
                  "user_filter_rule": filter_prompt,
                  "langs": search_langs,
                  "content_type": content_type,
                  "ranking_formula": "ai_score * 1.8 + log10(views + 1)" if sort_by == "relevance" else sort_by
              }
          }

          # 100% תרגום עברית מלא (כולל ספרדית/צרפתית/אנגלית + שמות קבוצות, שחקנים וטורנירים)
          def strip_noise(t: str) -> str:
              s = re.sub(r"[\u2066-\u2069\u200e\u200f]", "", str(t or ""))
              s = re.sub(r"^\s*\[(?:ESP|ENG|CAT|FR|ITA|DE|PT|AR|HD|4K)\]\s*", "", s, flags=re.I)
              s = re.sub(r"#[a-zA-Z0-9_\u0590-\u05FF]+", "", s)
              return re.sub(r"\s+", " ", s).strip()

          HE_POST = [
              (r"\bEXTENDED HIGHLIGHTS\b", "תקציר מורחב"), (r"\b(?:HIGHLIGHTS|HHIHLIGHTS|RESUMEN)\b", "תקציר"),
              (r"\b(?:FULL MATCH|PARTIDO COMPLETO|PARTIDO ENTERO)\b", "משחק מלא"), (r"\bFIRST TEAM\b", "הקבוצה הבוגרת"),
              (r"\bBEST OF\b", "מיטב הרגעים של"), (r"\bFINAL\b", "גמר"), (r"\bVS\.?\b", "נגד"),
              (r"\bTorneo\b", "טורניר"), (r"\bAlev[ií]n\b", "ילדים"), (r"\bInfantil\b", "נערים"),
              (r"\bJuvenil\b", "נוער"), (r"\bCadete\b", "קדטים"), (r"\bBenjam[ií]n\b", "טרום-ילדים"),
              (r"\bEntrenamiento\b", "אימון"), (r"\bGoles\b", "שערים"), (r"\bBar[cç]a Atl[eè]tic\b", "ברצלונה אתלטיק"),
              (r"\bFC Barcelona\b|\bBar[cç]a\b|\bBarcelona\b", "ברצלונה"), (r"\bReal Madrid\b", "ריאל מדריד"),
              (r"\bAtl[eé]tico de Madrid\b", "אתלטיקו מדריד"), (r"\bValencia\b", "ולנסיה"), (r"\bSevilla\b", "סביליה"),
              (r"\bReal Betis\b", "ריאל בטיס"), (r"\bGirona\s*FC\b|\bGirona\b", "ג'ירונה"), (r"\bVillarreal\b", "ויאריאל"),
              (r"\bMalaga\s*CF\b|\bM[aá]laga\b", "מלאגה"), (r"\bAtalanta\b", "אטאלנטה"), (r"\bAl Ahly\b", "אל-אהלי"),
              (r"\bLa\s*Mas[ií]a\b|לה מסיה|לה מאסה", "לה מאסיה"), (r"\bLALIGA EA SPORTS\b|\bLALIGA\b", "לה ליגה"),
              (r"\bOrian Goren\b", "אוריין גורן"), (r"\bLamine Yamal\b|למין ימל|לאמין ימל", "לאמין ימאל"),
              (r"\bPau Cubars[ií]\b", "פאו קובארסי"), (r"\bJoan Garc[ií]a\b|חואן גרסיה|חואן גארסיה", "ז'ואן גרסיה"),
              (r"\bLionel Messi\b|\bLeo Messi\b", "ליונל מסי"), (r"\bAnsu Fati\b", "אנסו פאטי"), (r"\bGavi\b", "גאבי"),
              (r"\bMarc Bernal\b", "מארק ברנאל"), (r"\bDani Olmo\b", "דני אולמו"), (r"\bFerm[ií]n\b", "פרמין"),
              (r"\bEric Garc[ií]a\b", "אריק גרסיה"), (r"\bAndr[eé]s Iniesta\b", "אנדרס אינייסטה"),
              (r"\bHansi\s+Flick\b|פליק של הנסי|פליק הנסי|הנסי פליק|האנסי פליק", "האנזי פליק"),
              (r"\bFlick\b|ס[\u0591-\u05C7]*ט[\u0591-\u05C7]*י[\u0591-\u05C7]*ר[\u0591-\u05C7]*ה\s+ק[\u0591-\u05C7]*ל[\u0591-\u05C7]*ה", "פליק"),
              (r"\bDeco\b", "דקו"), (r"\bBar[cç]a\s+Atl[eèé]tic\b|ברצלונה\s+ATL[EÈÉ]TIC", "ברצלונה אתלטיק"),
              (r"פ[\u0591-\u05C7]*נ[\u0591-\u05C7]*י[\u0591-\u05C7]*נ[\u0591-\u05C7]*ה", "פנינה"),
              (r"\bדגשים\b|\bהבהרה\b|\bהבהרות\b", "תקציר")
          ]
          def polish_he(t: str) -> str:
              s = strip_noise(t)
              for pat, rep in HE_POST: s = re.sub(pat, rep, s, flags=re.I)
              return re.sub(r"\s+", " ", s).strip()

          def count_foreign_alpha(txt: str) -> int:
              return sum(1 for ch in str(txt or "") if ch.isalpha() and not ("\u0590" <= ch <= "\u05FF"))

          def has_foreign_words(txt: str) -> bool:
              return count_foreign_alpha(txt) >= 3

          def gtrans_post(q_txt: str, sl: str = "auto") -> str:
              for cid in ("gtx", "dict-chrome-ex"):
                  try:
                      r = requests.post("https://translate.googleapis.com/translate_a/single", params={"client":cid,"sl":sl,"tl":"iw","dt":"t","dj":"1"}, data={"q":q_txt}, headers={"User-Agent":UA_STR,"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"}, timeout=14)
                      if r.status_code == 200:
                          tr = "".join(s.get("trans","") for s in (r.json().get("sentences") or []) if "trans" in s).strip()
                          if tr: return tr
                  except Exception: pass
              return ""

          def _decap_latin(s: str) -> str:
              """ממיר מילים ב-ALL CAPS ל-lowercase כדי ש-Google Translate לא ידלג עליהן כראשי תיבות."""
              def _fix_w(m):
                  w = m.group(0)
                  if w in ("FC", "UEFA", "FIFA", "NBA", "NFL", "UFC", "HD", "4K", "U19", "U18", "U17", "U16", "U14", "U12", "PSG", "TV", "VIP"):
                      return w
                  return w.lower()
              return re.sub(r"\b[A-ZÀÈÌÒÙÁÉÍÓÚÑÇÜ]{2,}\b", _fix_w, str(s or ""))

          def _protect_terms_latin(s: str) -> str:
              s = re.sub(r"\bhansi\s+flick\b", "XHFLICKX", s, flags=re.I)
              s = re.sub(r"\bflick\b", "XFLICKX", s, flags=re.I)
              s = re.sub(r"\bbar[cç]a\s+atl[eèé]tic\b", "XBATLETICX", s, flags=re.I)
              return s

          def _restore_terms_he(s: str) -> str:
              s = re.sub(r"XHFLICKX", "האנזי פליק", s, flags=re.I)
              s = re.sub(r"XFLICKX", "פליק", s, flags=re.I)
              s = re.sub(r"XBATLETICX", "ברצלונה אתלטיק", s, flags=re.I)
              return polish_he(s)

          def translate_one_pure_he(orig_s: str) -> str:
              prep = _protect_terms_latin(_decap_latin(orig_s))
              best = _restore_terms_he(gtrans_post(prep, "auto") or prep)
              if not has_foreign_words(best):
                  return best
              guess_langs = []
              if re.search(r"[\u0600-\u06FF]", prep): guess_langs.append("ar")
              if re.search(r"[áéíóúñ¡¿çèà]|\b(el|la|los|las|del|en|al|tras|rueda|prensa|completa|entrevista|directo|futuro|frente|gana|contra|partido|torneo|final|goles|juvenil|alev[ií]n|infantil|ni[ñn]o)\b", prep, re.I):
                  guess_langs.append("es")
              for lg in ("es", "en", "fr"):
                  if lg not in guess_langs: guess_langs.append(lg)
              best_score = count_foreign_alpha(best)
              for sl in guess_langs:
                  cand = _restore_terms_he(gtrans_post(prep, sl) or "")
                  if cand:
                      sc = count_foreign_alpha(cand)
                      if sc < best_score:
                          best, best_score = cand, sc
                          if best_score < 3:
                              break
              if best_score >= 3:
                  rebuilt = best
                  for m_sp in re.finditer(r"[A-Za-z\u00C0-\u024F][A-Za-z\u00C0-\u024F0-9\s'’&.-]{2,}", best):
                      sp = m_sp.group(0).strip()
                      if count_foreign_alpha(sp) < 3: continue
                      tr_sp = gtrans_post(_decap_latin(sp), guess_langs[0]) or gtrans_post(_decap_latin(sp), "en")
                      if tr_sp and count_foreign_alpha(tr_sp) < count_foreign_alpha(sp):
                          rebuilt = rebuilt.replace(sp, polish_he(tr_sp), 1)
                  if count_foreign_alpha(rebuilt) < best_score:
                      best = polish_he(rebuilt)
              return best

          if translate_titles and pool:
              need_tr = []
              for idx, it in enumerate(pool):
                  it["orig_title"] = it["title"]
                  src = strip_noise(it["title"])
                  it["title_he"] = src
                  if has_foreign_words(src): need_tr.append((idx, src))

              # תרגום ישיר ומהיר (8 תהליכונים + נירמול ALL-CAPS + מילון ספורט) — חוסך 2-3 קריאות Gemini ומונע 429!
              if need_tr:
                  with ThreadPoolExecutor(max_workers=8) as ex:
                      tr_out = list(ex.map(lambda p: translate_one_pure_he(p[1]), need_tr))
                  for (i_idx, _), he_res in zip(need_tr, tr_out):
                      pool[i_idx]["title_he"] = he_res

          # ====================================================================
          # הזרמת תמונות ממוזערות חדות (hqdefault 480x360 -> Crop 16:9 -> WebP 82% Base64!)
          # ====================================================================
          def fetch_sharp_webp_thumb(item):
              vid = item.get("id", "")
              if not vid: return
              sess = get_sess()
              for u in (f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg", f"https://i.ytimg.com/vi/{vid}/mqdefault.jpg"):
                  try:
                      r = sess.get(u, timeout=7)
                      if r.status_code == 200 and len(r.content) > 1200:
                          im = Image.open(io.BytesIO(r.content)).convert("RGB")
                          w, h = im.size
                          # חיתוך פסי ה-Letterbox השחורים של hqdefault (480x360 -> 480x270 16:9 חד!)
                          if w == 480 and h == 360: im = im.crop((0, 45, 480, 315))
                          elif w == 640 and h == 480: im = im.crop((0, 60, 640, 420))
                          im = im.resize((320, 180), Image.Resampling.LANCZOS)
                          buf = io.BytesIO()
                          im.save(buf, format="WEBP", quality=82, method=4)
                          b64 = base64.b64encode(buf.getvalue()).decode("ascii")
                          item["thumbnail"] = f"data:image/webp;base64,{b64}"
                          return
                  except Exception:
                      pass

          if pool:
              with ThreadPoolExecutor(max_workers=24) as ex:
                  list(ex.map(fetch_sharp_webp_thumb, pool[:180]))

          # הצעות חיפוש גיבוי אם Gemini לא החזיר
          if not suggested_searches and (clean_q or resolved_ch):
              base_t = clean_q or resolved_ch
              suggested_searches = [f"{base_t} 2026", f"{base_t} 2025/26", f"{base_t} תקציר", f"{base_t} כישרונות חדשים", f"{base_t} שערים ומהלכים", f"{base_t} משחק מלא", f"{base_t} אימון", f"{base_t} דוקומנטרי"]

          for item in pool:
              item.pop("orig_pos", None); item.pop("source_q", None); item.pop("is_il_stub", None); item.pop("matched_date_op", None); item.pop("channel_id", None)
              rd = str(item.get("upload_date") or "").strip()
              item["date_formatted"] = f"{rd[6:8]}/{rd[4:6]}/{rd[0:4]}" if (len(rd) == 8 and rd.isdigit()) else item.get("published_rel", "")
              mh = int(item.get("max_height") or 0)
              qb = "4K" if mh >= 2160 else ("1440p" if mh >= 1440 else ("1080p HD" if mh >= 1080 else ("720p" if mh >= 720 else (f"{mh}p" if mh > 0 else ""))))
              item["quality_badge"] = qb
              item["channel"] = " • ".join(p for p in [item["channel"], f"🎬 {qb}" if qb else ""] if p)
              if item.get("title_he"): item["title"] = item["title_he"]

          ai_trace["ai_infra"] = ai_router.export_telemetry()
          ai_trace["gemini_errors"] = ai_router.errors[:12]
          payload_bytes = json.dumps({
              "query": query, "en_query": en_query, "expanded_queries": expanded_queries,
              "suggested_searches": suggested_searches, "channel": resolved_ch or channel_input,
              "sort_by": sort_by, "ai_status": ai_status, "ai_trace": ai_trace, "items": pool
          }, ensure_ascii=False).encode("utf-8")
          with open("recommendations.json", "wb") as f: f.write(payload_bytes)
          gh_repo = os.environ["GH_REPO"]; gh_token = os.environ["GH_TOKEN"]
          r = requests.post(f"https://api.github.com/repos/{gh_repo}/git/blobs", headers={"Authorization":f"Bearer {gh_token}","Accept":"application/vnd.github+json"}, json={"content":base64.b64encode(payload_bytes).decode("ascii"),"encoding":"base64"}, timeout=60)
          sha = r.json().get("sha", "") if r.status_code == 201 else ""
          tag = f"rec-{req_id}"
          rel_p = subprocess.run(["gh","release","create",tag,"recommendations.json","--repo",gh_repo,"--title",tag,"--notes",json.dumps({"blobs":[sha] if sha else [],"count":len(pool)})], capture_output=True, text=True, check=False)
          if rel_p.returncode != 0:
              raise SystemExit(f"::error::gh release create failed: {rel_p.stderr[:250]}")
          EOF
