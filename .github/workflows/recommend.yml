name: Recommend Popular Media
on:
  workflow_dispatch:
    inputs:
      request_id: { required: true, type: string }
      query: { required: false, default: "", type: string }
      channel: { required: false, default: "", type: string }
      sort_by: { required: false, default: "views", type: string }
      max_results: { required: false, default: "60", type: string }
      min_views: { required: false, default: "0", type: string }
      exclude_ids: { required: false, default: "", type: string }
      filter_prompt: { required: false, default: "", type: string }
      cookies_enc: { required: false, default: "", type: string }
run-name: rec-${{ inputs.request_id }}
permissions:
  contents: write
  models: read
jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install yt-dlp
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends python3-cryptography
          python3 -m pip install --upgrade --break-system-packages --pre "yt-dlp[default,curl-cffi]" yt-dlp-ejs requests cryptography
      - name: Search Full Channel Archive or Videos and Sort by Views / Likes / Date
        env:
          REQ_ID: ${{ inputs.request_id }}
          QUERY: ${{ inputs.query }}
          CHANNEL: ${{ inputs.channel }}
          SORT_BY: ${{ inputs.sort_by }}
          MAX_RESULTS: ${{ inputs.max_results }}
          MIN_VIEWS: ${{ inputs.min_views }}
          EXCLUDE_IDS: ${{ inputs.exclude_ids }}
          FILTER_PROMPT: ${{ inputs.filter_prompt }}
          COOKIES_ENC: ${{ inputs.cookies_enc }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
          COOKIE_KEY_FALLBACK: "ea1641dc747be6a7af79e7152865d3f8d566fd74ec00c02cb13db642d05fddc3"
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import base64, json, os, re, subprocess, urllib.parse, requests
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          req_id = os.environ.get("REQ_ID", "").strip()
          query = os.environ.get("QUERY", "").strip()
          channel_input = os.environ.get("CHANNEL", "").strip()
          sort_by = os.environ.get("SORT_BY", "views").strip().lower() or "views"
          max_results = max(10, min(150, int(os.environ.get("MAX_RESULTS", "60") or 60)))
          min_views = int(os.environ.get("MIN_VIEWS", "0") or 0)
          exclude = set(filter(None, os.environ.get("EXCLUDE_IDS", "").split(",")))
          filter_prompt = os.environ.get("FILTER_PROMPT", "").strip()
          cookies_enc = os.environ.get("COOKIES_ENC", "").strip()
          secret_key_env = os.environ.get("COOKIE_KEY", "").strip()
          fallback_key_env = os.environ.get("COOKIE_KEY_FALLBACK", "").strip()

          cookie_file = Path("/tmp/rec_cookies.txt")
          has_ck = False
          if cookies_enc:
              raw_enc = base64.b64decode(cookies_enc)
              for candidate_hex in (fallback_key_env, secret_key_env):
                  if len(candidate_hex) == 64:
                      try:
                          plain_txt = AESGCM(bytes.fromhex(candidate_hex)).decrypt(raw_enc[:12], raw_enc[12:], None).decode("utf-8", errors="replace")
                          if "youtube.com" in plain_txt or "# Netscape" in plain_txt:
                              cookie_file.write_text(plain_txt, encoding="utf-8")
                              has_ck = True
                              break
                      except Exception:
                          pass

          print(f"[STEP 1] Params: req_id={req_id}, channel='{channel_input}', query='{query}', sort_by={sort_by}, has_ck={has_ck}", flush=True)

          def fetch_yt_json(target_url_or_query, limit_str):
              cmd = [
                  "python3", "-m", "yt_dlp",
                  "--force-ipv4", "--dump-json", "--flat-playlist",
                  "--playlist-end", str(limit_str),
                  "--ignore-errors", "--no-warnings",
                  "--js-runtimes", "deno",
              ]
              if has_ck:
                  cmd += ["--cookies", str(cookie_file)]
              cmd.append(target_url_or_query)
              r = subprocess.run(cmd, capture_output=True, text=True)
              items = []
              for line in r.stdout.splitlines():
                  try:
                      d = json.loads(line)
                      if d.get("id"):
                          items.append(d)
                  except Exception:
                      pass
              return items

          def resolve_channel_base_url(ch_raw: str):
              ch = ch_raw.strip()
              if not ch:
                  return "", "", ""
              if ch.startswith("http"):
                  base = re.sub(r"/(videos|shorts|streams|playlists|about|featured)/?$", "", ch.rstrip("/"))
                  m_handle = re.search(r"(@[a-zA-Z0-9_.-]+)", base)
                  clean_term = m_handle.group(1) if m_handle else base.split("/")[-1]
                  return base, clean_term, clean_term
              if ch.startswith("@"):
                  handle = ch.split("/")[0]
                  return f"https://www.youtube.com/{handle}", handle, handle

              enc = urllib.parse.quote_plus(ch)
              ch_search_url = f"https://www.youtube.com/results?search_query={enc}&sp=EgIQAg%253D%253D"
              found_channels = fetch_yt_json(ch_search_url, "8")
              best_base = ""
              best_name = ch
              ch_low = ch.lower()

              for entry in found_channels:
                  c_url = entry.get("url") or entry.get("channel_url") or ""
                  c_title = (entry.get("channel") or entry.get("title") or entry.get("uploader") or "").strip()
                  if c_url and ("/@" in c_url or "/channel/" in c_url or "/c/" in c_url):
                      if ch_low in c_title.lower() or not best_base:
                          best_base = re.sub(r"/(videos|shorts|streams|playlists|about|featured)/?$", "", c_url.rstrip("/"))
                          if c_title:
                              best_name = c_title
                          if ch_low in c_title.lower():
                              break

              if not best_base:
                  vids = fetch_yt_json(f"ytsearch15:{ch}", "15")
                  for v in vids:
                      v_ch = (v.get("channel") or v.get("uploader") or "").strip()
                      u_url = v.get("uploader_url") or v.get("channel_url") or ""
                      if u_url and (ch_low in v_ch.lower() or not best_base):
                          best_base = re.sub(r"/(videos|shorts|streams|playlists|about|featured)/?$", "", u_url.rstrip("/"))
                          if v_ch:
                              best_name = v_ch
                          if ch_low in v_ch.lower():
                              break

              return best_base, best_name, best_name

          en_query = ""
          if query and any("\u0590" <= ch <= "\u05FF" for ch in query):
              try:
                  tr_url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=iw&tl=en&dt=t&q=" + urllib.parse.quote(query)
                  tr_res = requests.get(tr_url, timeout=10)
                  if tr_res.status_code == 200:
                      en_query = "".join(part[0] for part in tr_res.json()[0] if part and part[0]).strip()
              except Exception:
                  pass

          def yt_search_sorted_url(q_text, mode_sort):
              enc = urllib.parse.quote_plus(q_text)
              sp_map = {
                  "views": "CAMSAhAB",
                  "date_desc": "CAI%253D",
                  "likes": "CAE%253D",
              }
              sp = sp_map.get(mode_sort, "CAMSAhAB")
              return f"https://www.youtube.com/results?search_query={enc}&sp={sp}"

          raw = []
          resolved_channel_name = channel_input

          if channel_input:
              ch_base_url, resolved_channel_name, clean_ch_term = resolve_channel_base_url(channel_input)
              print(f"[STEP 2] Resolved channel base='{ch_base_url}', term='{clean_ch_term}'", flush=True)
              tasks = []
              if ch_base_url:
                  # סריקה עמוקה של כל ההיסטוריה המלאה של הערוץ (עד 5,000 סרטונים כולל שנת 2022 ומטה)
                  tasks.append((f"{ch_base_url}/videos", "5000"))
                  tasks.append((f"{ch_base_url}/videos?sp=EgZ2aWRlb3PyBgQKAjoA", "300"))
                  tasks.append((f"{ch_base_url}/streams", "1000"))

              if query:
                  tasks.append((yt_search_sorted_url(f"{clean_ch_term} {query}", sort_by), "120"))
                  if en_query and en_query.lower() != query.lower():
                      tasks.append((yt_search_sorted_url(f"{clean_ch_term} {en_query}", sort_by), "100"))
              else:
                  tasks.append((yt_search_sorted_url(clean_ch_term, "views"), "200"))

              with ThreadPoolExecutor(max_workers=4) as ex:
                  for batch in ex.map(lambda t: fetch_yt_json(t[0], t[1]), tasks):
                      raw.extend(batch)
          else:
              search_targets = [
                  (yt_search_sorted_url(query, sort_by), "150"),
                  (f"ytsearch100:{query}", "100"),
              ]
              if en_query and en_query.lower() != query.lower():
                  search_targets.extend([
                      (yt_search_sorted_url(en_query, sort_by), "150"),
                      (f"ytsearch100:{en_query}", "100"),
                  ])

              with ThreadPoolExecutor(max_workers=4) as ex:
                  for batch in ex.map(lambda t: fetch_yt_json(t[0], t[1]), search_targets):
                      raw.extend(batch)

          print(f"[STEP 3] Total raw historical entries fetched: {len(raw)}", flush=True)

          if channel_input and raw:
              for r_item in raw[:25]:
                  real_ch = (r_item.get("channel") or r_item.get("uploader") or "").strip()
                  if real_ch and not real_ch.startswith("http") and not real_ch.startswith("@"):
                      resolved_channel_name = real_ch
                      break

          STOP_WORDS = {"איך", "מדריך", "הדרכה", "מקצועי", "של", "על", "עם", "the", "and", "for", "how", "to", "in", "of", "with"}
          topic_tokens = []
          for src_q in (query, en_query):
              if not src_q:
                  continue
              for tok in re.split(r"[^\w\u0590-\u05FF]+", src_q.lower()):
                  if len(tok) >= 2 and tok not in STOP_WORDS:
                      topic_tokens.append(tok)

          def matches_topic_strictly(title_str: str, channel_str: str) -> bool:
              if not topic_tokens:
                  return True
              haystack = f"{title_str} {channel_str}".lower()
              return any(tok in haystack for tok in topic_tokens)

          ch_tokens = [
              t for t in re.split(r"[^\w\u0590-\u05FF]+", f"{channel_input} {resolved_channel_name}".lower())
              if len(t) >= 2 and t not in ("https", "http", "www", "youtube", "com", "videos", "streams")
          ]

          def matches_channel_strictly(entry_channel: str, entry_uploader_url: str) -> bool:
              if not channel_input:
                  return True
              hay = f"{entry_channel} {entry_uploader_url}".lower()
              if not hay.strip():
                  return True
              return any(tok in hay for tok in ch_tokens)

          seen = set(exclude)
          cands = []
          for idx_pos, e in enumerate(raw):
              vid = e.get("id")
              title = (e.get("title") or "").strip()
              channel = (e.get("channel") or e.get("uploader") or resolved_channel_name or "").strip()
              up_url = (e.get("uploader_url") or e.get("channel_url") or "").strip()
              if not vid or vid in seen or len(vid) != 11 or not title:
                  continue
              seen.add(vid)
              if not matches_channel_strictly(channel, up_url):
                  continue
              if query and not matches_topic_strictly(title, channel):
                  continue
              views = int(e.get("view_count") or 0)
              likes = int(e.get("like_count") or 0)
              up_date = str(e.get("upload_date") or "").strip()
              cands.append({
                  "id": vid,
                  "title": title,
                  "url": f"https://www.youtube.com/watch?v={vid}",
                  "channel": channel or resolved_channel_name,
                  "views": views,
                  "likes": likes,
                  "upload_date": up_date,
                  "orig_pos": idx_pos,
                  "duration": int(e.get("duration") or 0),
                  "thumbnail": f"https://i.ytimg.com/vi/{vid}/mqdefault.jpg"
              })

          print(f"[STEP 4] Unique historical candidates across channel: {len(cands)}", flush=True)

          if sort_by in ("views", "likes"):
              cands.sort(key=lambda x: x["views"], reverse=True)
              need_meta = cands[:max(max_results + 35, 110)]
          elif sort_by == "date_asc":
              need_meta = list(reversed(cands[-max(max_results + 35, 110):]))
          else:
              need_meta = cands[:max(max_results + 35, 110)]

          def enrich(c):
              cmd = ["python3", "-m", "yt_dlp", "--force-ipv4", "--dump-json", "--no-playlist", "--skip-download", "--no-warnings"]
              if has_ck:
                  cmd += ["--cookies", str(cookie_file)]
              cmd.append(c["url"])
              r = subprocess.run(cmd, capture_output=True, text=True)
              try:
                  d = json.loads(r.stdout.splitlines()[0])
                  c["views"] = int(d.get("view_count") or c["views"] or 0)
                  c["likes"] = int(d.get("like_count") or c["likes"] or 0)
                  c["upload_date"] = str(d.get("upload_date") or c["upload_date"] or "").strip()
                  c["duration"] = int(d.get("duration") or c["duration"] or 0)
                  real_name = (d.get("channel") or d.get("uploader") or "").strip()
                  if real_name:
                      c["channel"] = real_name
              except Exception:
                  pass

          if need_meta:
              with ThreadPoolExecutor(max_workers=15) as ex:
                  list(ex.map(enrich, need_meta))

          def sort_candidates(items_list, mode_sort):
              if mode_sort == "likes":
                  items_list.sort(key=lambda x: (x["likes"], x["views"]), reverse=True)
              elif mode_sort == "date_desc":
                  items_list.sort(key=lambda x: (x["upload_date"] or "00000000", -x["orig_pos"]), reverse=True)
              elif mode_sort == "date_asc":
                  items_list.sort(key=lambda x: (x["upload_date"] if x["upload_date"] else "99999999", -x["orig_pos"]), reverse=False)
              else:
                  items_list.sort(key=lambda x: x["views"], reverse=True)

          sort_candidates(need_meta, sort_by)

          if channel_input:
              pool = [c for c in need_meta if c["views"] >= min_views]
              if len(pool) < min(max_results, 25):
                  pool = need_meta[:]
              pool = pool[:max_results + 25]
          else:
              pool = [c for c in need_meta if c["views"] >= min_views][:max_results + 25]
              if len(pool) < 20:
                  pool = need_meta[:max_results + 25]

          def call_ai_batch(batch_items, topic_str, ch_str, user_rule):
              if not user_rule:
                  return batch_items
              compact = [{"id": c["id"], "title": c["title"], "channel": c["channel"]} for c in batch_items]
              sys_msg = (
                  "אתה מסנן תוכן קפדני עבור ציבור שומר תורה ומצוות. "
                  "החזר אך ורק את המזהים (id) של סרטונים שעומדים בהנחיית הסינון והנקיות של המשתמש. "
                  "החזר אך ורק JSON תקין בפורמט: {\"approved_ids\": [\"id1\", \"id2\"]}"
              )
              usr_msg = (
                  f"ערוץ: {ch_str or 'כללי'} | נושא: {topic_str or 'כללי'}\n"
                  f"הנחיית סינון: {user_rule}\n\n"
                  f"רשימת מועמדים:\n{json.dumps(compact, ensure_ascii=False)}"
              )

              gh_tok = os.environ.get("GH_TOKEN", "").strip()
              gem_key = os.environ.get("GEMINI_API_KEY", "").strip()
              endpoints = []
              if gh_tok:
                  endpoints.append((
                      "https://models.inference.ai.azure.com/chat/completions",
                      {"Authorization": f"Bearer {gh_tok}", "Content-Type": "application/json"},
                      {"model": "gpt-4o-mini", "messages": [{"role": "system", "content": sys_msg}, {"role": "user", "content": usr_msg}], "temperature": 0.0}
                  ))
              if gem_key:
                  endpoints.append((
                      f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={gem_key}",
                      {"Content-Type": "application/json"},
                      {"contents": [{"parts": [{"text": sys_msg + "\n\n" + usr_msg}]}]}
                  ))

              for url, headers, payload in endpoints:
                  try:
                      resp = requests.post(url, headers=headers, json=payload, timeout=30)
                      if resp.status_code == 200:
                          data = resp.json()
                          text = ""
                          if "choices" in data and data["choices"]:
                              text = data["choices"][0].get("message", {}).get("content", "")
                          elif "candidates" in data and data["candidates"]:
                              text = data["candidates"][0].get("content", {}).get("parts", [{}])[0].get("text", "")
                          clean_txt = re.sub(r"```(?:json)?|```", "", text).strip()
                          m = re.search(r"\{.*\"approved_ids\"\s*:\s*\[.*?\].*\}", clean_txt, re.DOTALL)
                          if m:
                              parsed = json.loads(m.group(0))
                              approved = set(parsed.get("approved_ids") or [])
                              if approved:
                                  return [c for c in batch_items if c["id"] in approved]
                  except Exception:
                      pass
              return batch_items

          approved_all = []
          batch_size = 35
          for i in range(0, len(pool), batch_size):
              chunk = pool[i:i + batch_size]
              approved_all.extend(call_ai_batch(chunk, query, resolved_channel_name, filter_prompt))

          sort_candidates(approved_all, sort_by)
          filtered = approved_all[:max_results]
          for item in filtered:
              item.pop("orig_pos", None)

          print(f"[STEP 5] Final approved items: {len(filtered)}", flush=True)

          payload_bytes = json.dumps({
              "query": query,
              "channel": resolved_channel_name or channel_input,
              "sort_by": sort_by,
              "en_query": en_query,
              "filter_prompt": filter_prompt,
              "items": filtered
          }, ensure_ascii=False).encode("utf-8")
          with open("recommendations.json", "wb") as f:
              f.write(payload_bytes)

          gh_repo = os.environ["GH_REPO"]
          gh_token = os.environ["GH_TOKEN"]
          r = requests.post(
              f"https://api.github.com/repos/{gh_repo}/git/blobs",
              headers={"Authorization": f"Bearer {gh_token}", "Accept": "application/vnd.github+json"},
              json={"content": base64.b64encode(payload_bytes).decode("ascii"), "encoding": "base64"},
              timeout=60
          )
          sha = r.json().get("sha", "") if r.status_code == 201 else ""

          tag = f"rec-{req_id}"
          notes_str = json.dumps({"blobs": [sha] if sha else [], "count": len(filtered)})
          subprocess.run(
              ["gh", "release", "create", tag, "recommendations.json", "--repo", gh_repo, "--title", tag, "--notes", notes_str],
              capture_output=True, text=True, check=False
          )
          EOF
