name: Recommend Popular Media

on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      query:
        required: true
        type: string
      min_views:
        required: false
        default: "500000"
        type: string
      exclude_ids:
        required: false
        default: ""
        type: string

run-name: rec-${{ inputs.request_id }}

permissions:
  contents: write

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade --break-system-packages "yt-dlp[default,curl-cffi]"

      - name: Search Historical Popular Videos
        env:
          REQ_ID: ${{ inputs.request_id }}
          QUERY: ${{ inputs.query }}
          MIN_VIEWS: ${{ inputs.min_views }}
          EXCLUDE_IDS: ${{ inputs.exclude_ids }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import json, os, re, urllib.parse, subprocess
          from concurrent.futures import ThreadPoolExecutor

          query = os.environ.get("QUERY", "").strip()
          try:
              min_views = int(os.environ.get("MIN_VIEWS", "500000"))
          except Exception:
              min_views = 500000
          exclude = set(filter(None, os.environ.get("EXCLUDE_IDS", "").split(",")))

          tokens = [t.lower() for t in re.split(r"[\s\-_,.;:|]+", query) if len(t) >= 2]

          encoded_q = urllib.parse.quote_plus(query)
          # sp=CAMSAhAB ממיין ביוטיוב לפי שיא צפיות מכל הזמנים (View Count All-Time)
          view_sorted_url = f"https://www.youtube.com/results?search_query={encoded_q}&sp=CAMSAhAB"
          # חיפוש נוסף ממוין לפי צפיות עם מילת המפתח
          urls_to_scan = [
              (view_sorted_url, "1:90"),
              (f"ytsearch80:{query}", None)
          ]

          def fetch_list(target):
              url, pl_items = target
              cmd = [
                  "yt-dlp",
                  "--flat-playlist",
                  "--dump-json",
                  "--ignore-errors",
                  "--no-warnings",
                  "--extractor-args", "youtube:lang=he"
              ]
              if pl_items:
                  cmd += ["--playlist-items", pl_items]
              cmd.append(url)
              res = subprocess.run(cmd, capture_output=True, text=True)
              items = []
              for line in res.stdout.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      items.append(json.loads(line))
                  except Exception:
                      pass
              return items

          raw_entries = []
          with ThreadPoolExecutor(max_workers=2) as ex:
              for batch in ex.map(fetch_list, urls_to_scan):
                  raw_entries.extend(batch)

          seen = set(exclude)
          candidates = []
          for idx, e in enumerate(raw_entries):
              vid = e.get("id")
              title = (e.get("title") or "").strip()
              if not vid or len(vid) != 11 or vid in seen or not title:
                  continue
              seen.add(vid)

              channel_name = (e.get("channel") or e.get("uploader") or "").strip()
              haystack = f"{title} {channel_name}".lower()

              # התאמה לנושא החיפוש
              matched_tokens = sum(1 for t in tokens if t in haystack) if tokens else 1
              if tokens and matched_tokens == 0:
                  continue

              views = int(e.get("view_count") or 0)
              candidates.append({
                  "id": vid,
                  "title": title,
                  "url": f"https://www.youtube.com/watch?v={vid}",
                  "channel": channel_name,
                  "views": views,
                  "duration": int(e.get("duration") or 0),
                  "thumbnail": f"https://i.ytimg.com/vi/{vid}/mqdefault.jpg",
                  "match_score": matched_tokens,
                  "order_idx": idx
              })

          # השלמת מספר צפיות מדויק לסרטונים שבהם יוטיוב לא החזיר view_count ברשימה השטוחה
          need_meta = [c for c in candidates if c["views"] == 0][:40]
          def enrich(c):
              cmd = ["yt-dlp", "--dump-json", "--no-playlist", "--skip-download", "--no-warnings", c["url"]]
              r = subprocess.run(cmd, capture_output=True, text=True)
              try:
                  first_line = r.stdout.splitlines()[0]
                  d = json.loads(first_line)
                  c["views"] = int(d.get("view_count") or 0)
                  c["duration"] = int(d.get("duration") or c["duration"] or 0)
                  c["channel"] = d.get("channel") or d.get("uploader") or c["channel"]
              except Exception:
                  pass

          if need_meta:
              with ThreadPoolExecutor(max_workers=8) as ex:
                  list(ex.map(enrich, need_meta))

          # מיון קשיח: קודם התאמה מלאה לכל מילות החיפוש + כמות צפיות היסטורית מהגבוה לנמוך
          candidates.sort(key=lambda x: (x["match_score"] == len(tokens), x["views"]), reverse=True)

          filtered = [c for c in candidates if c["views"] >= min_views]
          if len(filtered) < 10:
              filtered = sorted(candidates, key=lambda x: x["views"], reverse=True)[:30]
          else:
              filtered = sorted(filtered, key=lambda x: x["views"], reverse=True)[:30]

          for c in filtered:
              c.pop("match_score", None)
              c.pop("order_idx", None)

          with open("recommendations.json", "w", encoding="utf-8") as f:
              json.dump({"query": query, "items": filtered}, f, ensure_ascii=False)
          EOF

          TAG="rec-${REQ_ID}"
          gh release create "$TAG" recommendations.json --repo "$GH_REPO" --title "$TAG" --notes "Recommendations result"
