name: download
run-name: dl-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id: { required: true, type: string }
      url: { required: true, type: string }
      quality: { required: false, default: "best", type: string }
      mode: { required: false, default: "video", type: string }
      urls: { required: false, default: "", type: string }
      clip_start: { required: false, default: "", type: string }
      clip_end: { required: false, default: "", type: string }
      subtitles: { required: false, default: "none", type: string }
      sponsorblock: { required: false, default: "{}", type: string }
      cookies_enc: { required: false, default: "", type: string }

permissions:
  contents: write
  actions: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ytcloud-v23-9
          restore-keys: pip-ytcloud-

      - name: Install yt-dlp + ffmpeg + curl_cffi + bgutil-pot
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker run -d --rm -p 4416:4416 --name bgutil-pot brainicism/bgutil-ytdlp-pot-provider:latest >/dev/null 2>&1 &
          fi
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            (curl -fsSL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ff.tar.xz && tar -xf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-*/bin/ffmpeg /tmp/ffmpeg-*/bin/ffprobe /usr/bin/ && sudo chmod +x /usr/bin/ffmpeg /usr/bin/ffprobe && rm -rf /tmp/ff.tar.xz /tmp/ffmpeg-*) &
          fi
          python3 -m pip install --break-system-packages -q -U cryptography requests PySocks deep-translator mutagen yt-dlp-ejs bgutil-ytdlp-pot-provider
          python3 -m pip install --break-system-packages -q -U --pre "yt-dlp[default,curl-cffi]"
          wait
          which ffmpeg && ffmpeg -version | head -n 1
          for i in $(seq 1 14); do
            if curl -s http://127.0.0.1:4416/ping >/dev/null 2>&1 || curl -s http://127.0.0.1:4416 >/dev/null 2>&1; then
              echo "BgUtils PO Token Server is ready on port 4416."
              break
            fi
            sleep 1
          done
          python3 -m yt_dlp --version

      - name: Execute Smart Engine v5 (Release + Direct API Blob Bridge + Email Delivery)
        env:
          GH_TOKEN: ${{ github.token }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          IL_PROXY: ${{ secrets.IL_PROXY }}
          CUSTOM_PROXY: ${{ secrets.CUSTOM_PROXY }}
        run: |
          python3 scripts/download_engine.py

      - name: Upload Backup Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dl-${{ inputs.request_id }}
          path: /tmp/out/*
          if-no-files-found: ignore
          retention-days: 1
