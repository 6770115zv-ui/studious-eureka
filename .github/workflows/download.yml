          gd_cid = re.sub(r"\s+", "", os.environ.get("GDRIVE_CLIENT_ID", "")).strip("\"'")
          gd_sec = re.sub(r"\s+", "", os.environ.get("GDRIVE_CLIENT_SECRET", "")).strip("\"'")
          gd_ref = re.sub(r"\s+", "", os.environ.get("GDRIVE_REFRESH_TOKEN", "")).strip("\"'")
          gd_fld = re.sub(r"\s+", "", os.environ.get("GDRIVE_FOLDER_ID", "")).strip("\"'")
          _share_target = email_opt if (email_opt and "@" in email_opt) else (os.environ.get("EMAIL_TO", "").strip() or os.environ.get("SMTP_TO", "").strip() or os.environ.get("SMTP_USER", "").strip() or os.environ.get("EMAIL_USER", "").strip() or os.environ.get("GMAIL_USER", "").strip())
          if _share_target and "@" in _share_target: print(f"::add-mask::{_share_target}", flush=True)
          has_gd_secrets = bool(gd_cid and gd_sec and gd_ref)
          auto_drive_for_mail = bool(send_email_flag and has_gd_secrets and primary_file.exists() and primary_file.stat().st_size > int(17.5 * 1024 * 1024))
          if upload_drive_flag or auto_drive_for_mail:
              if not (gd_cid and gd_sec and gd_ref):
                  print(f"Drive secrets status: cid={bool(gd_cid)} sec={bool(gd_sec)} ref={bool(gd_ref)} fld={bool(gd_fld)}", flush=True)
                  drive_status = "⚠️ חסרים Secrets של Google Drive (GDRIVE_CLIENT_ID/SECRET/REFRESH_TOKEN)"
              else:
                  try:
                      tr = requests.post("https://oauth2.googleapis.com/token", data={"client_id": gd_cid, "client_secret": gd_sec, "refresh_token": gd_ref, "grant_type": "refresh_token"}, timeout=20)
                      tr.raise_for_status()
                      acc_tok = tr.json()["access_token"]
                      print(f"::add-mask::{acc_tok}", flush=True)
                      gd_h = {"Authorization": f"Bearer {acc_tok}"}
                      if not gd_fld:
                          fq = requests.get("https://www.googleapis.com/drive/v3/files", headers=gd_h, params={"q": "name='YouTube Cloud Ultra' and mimeType='application/vnd.google-apps.folder' and trashed=false", "fields": "files(id)"}, timeout=15)
                          flist = (fq.json().get("files") or []) if fq.ok else []
                          if flist:
                              gd_fld = flist[0]["id"]
                          else:
                              fc = requests.post("https://www.googleapis.com/drive/v3/files", headers={**gd_h, "Content-Type": "application/json"}, json={"name": "YouTube Cloud Ultra", "mimeType": "application/vnd.google-apps.folder"}, timeout=15)
                              if fc.ok: gd_fld = fc.json().get("id", "")
                      _t_drv = time.time()
                      if len(files) == 1 or split_join_meta:
                          drive_targets = [primary_file]
                      elif cloud_only_flag:
                          drive_targets = list(files)
                      else:
                          drive_targets = [zip_path]

                      uploaded_fids = []
                      first_link = ""
                      for up_target in drive_targets:
                          f_total = up_target.stat().st_size
                          meta = {"name": up_target.name}
                          if gd_fld: meta["parents"] = [gd_fld]
                          init_r = requests.post("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,webViewLink", headers={**gd_h, "Content-Type": "application/json; charset=UTF-8", "X-Upload-Content-Type": "application/octet-stream", "X-Upload-Content-Length": str(f_total)}, json=meta, timeout=25)
                          init_r.raise_for_status()
                          up_url = init_r.headers["Location"]
                          chunk_sz = 16 * 1024 * 1024
                          fin_json = {}
                          with open(up_target, "rb") as fp:
                              pos = 0
                              while pos < f_total:
                                  buf = fp.read(chunk_sz)
                                  if not buf: break
                                  end_b = pos + len(buf) - 1
                                  cr = None
                                  for _ctry in range(3):
                                      try:
                                          cr = requests.put(up_url, headers={**gd_h, "Content-Length": str(len(buf)), "Content-Range": f"bytes {pos}-{end_b}/{f_total}"}, data=buf, timeout=180)
                                          if cr.status_code in (200, 201, 308):
                                              break
                                      except Exception:
                                          cr = None
                                      time.sleep(2.0 * (_ctry + 1))
                                  if cr is None or cr.status_code not in (200, 201, 308):
                                      raise RuntimeError(f"Drive chunk HTTP {getattr(cr, 'status_code', 'NET_ERR')}")
                                  pos += len(buf)
                                  if cr.status_code in (200, 201):
                                      fin_json = cr.json()
                                      break
                          fid = fin_json.get("id", "")
                          if fid:
                              uploaded_fids.append(fid)
                              print(f"::add-mask::{fid}", flush=True)
                              if not first_link:
                                  first_link = fin_json.get("webViewLink") or f"https://drive.google.com/file/d/{fid}/view"
                              if _share_target and "@" in _share_target:
                                  try:
                                      requests.post(f"https://www.googleapis.com/drive/v3/files/{fid}/permissions", headers={**gd_h, "Content-Type": "application/json"}, params={"sendNotificationEmail": "false"}, json={"type": "user", "role": "reader", "emailAddress": _share_target}, timeout=20)
                                  except Exception: pass

                      telemetry["drive_sec"] = round(time.time() - _t_drv, 1)
                      if uploaded_fids:
                          drive_web_link = (f"https://drive.google.com/drive/folders/{gd_fld}" if (len(uploaded_fids) > 1 and gd_fld) else first_link)
                          print(f"::add-mask::{drive_web_link}", flush=True)
                          if len(secret_key_env) == 64:
                              _iv = os.urandom(12)
                              _ct = AESGCM(bytes.fromhex(secret_key_env)).encrypt(_iv, drive_web_link.encode("utf-8"), None)
                              drive_url_enc = base64.b64encode(_iv + _ct).decode("ascii")
                              drive_status = f"☁️ הועלו {len(uploaded_fids)} קבצים ל-Google Drive בהצלחה" if len(uploaded_fids) > 1 else "☁️ הועלה ל-Google Drive בהצלחה"
                          else:
                              drive_status = f"☁️ הועלה ל-Drive ({len(uploaded_fids)} קבצים) — הגדר COOKIE_KEY להצגת קישור בתוסף"
                          print(f"Google Drive upload succeeded ({len(uploaded_fids)} file(s)).", flush=True)
                  except Exception as gd_err:
                      _code = getattr(getattr(gd_err, "response", None), "status_code", "")
                      _rtxt = str(getattr(getattr(gd_err, "response", None), "text", ""))[:180].replace("\n", " ")
                      print(f"Google Drive upload error: {type(gd_err).__name__} HTTP={_code} {_rtxt or gd_err}", flush=True)
                      drive_status = f"⚠️ שגיאת Drive ({type(gd_err).__name__} {_code})"

          # === SAFE_EMAIL_AND_DRIVE_V21 ===
          MAX_GMAIL_RAW_BYTES = int(17.5 * 1024 * 1024)
          TARGET_CHUNK_BYTES = int(13.8 * 1024 * 1024)
          MAX_SAFE_SMTP_PARTS = 5
          SMTP_COOLDOWN_SEC = 25

          smtp_user = (
              os.environ.get("SMTP_USER", "").strip()
              or os.environ.get("EMAIL_USER", "").strip()
              or os.environ.get("GMAIL_USER", "").strip()
          )
          smtp_pass = (
              os.environ.get("SMTP_PASS", "").strip()
              or os.environ.get("EMAIL_PASS", "").strip()
              or os.environ.get("GMAIL_APP_PASSWORD", "").strip()
              or os.environ.get("GMAIL_PASS", "").strip()
          )
          secret_to = (
              os.environ.get("EMAIL_TO", "").strip()
              or os.environ.get("SMTP_TO", "").strip()
              or smtp_user
          )
          recipient = email_opt if (email_opt and "@" in email_opt) else secret_to
          for _em in (smtp_user, smtp_pass, secret_to, recipient):
              if _em and len(_em) >= 4:
                  print(f"::add-mask::{_em}", flush=True)

          def _mail_safe_stem(raw_name: str) -> str:
              s = re.sub(r"\.f\d+(?:-\d+)?$", "", str(raw_name or "video"), flags=re.I)
              s = re.sub(r"[\U00010000-\U0010FFFF\u2600-\u27BF\uFE00-\uFEFF]", " ", s)
              s = re.sub(r'[<>:"/\\|?*\x00-\x1f#~%&{}^`!@$+=;]+', " ", s)
              s = re.sub(r"\s+", " ", s).strip(" ._-")
              return (s[:72].strip(" ._-")) or "youtube-video"

          def _probe_dur_sec(fp: Path) -> float:
              try:
                  r = subprocess.run(
                      ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", str(fp)],
                      capture_output=True, text=True, timeout=15
                  )
                  return max(0.0, float((r.stdout or "0").strip()))
              except Exception:
                  return 0.0

          def _probe_has_subs(fp: Path) -> bool:
              try:
                  r = subprocess.run(
                      ["ffprobe", "-v", "error", "-select_streams", "s", "-show_entries", "stream=index", "-of", "csv=p=0", str(fp)],
                      capture_output=True, text=True, timeout=15
                  )
                  return bool((r.stdout or "").strip())
              except Exception:
                  return False

          def _parse_raw_srt(raw_txt: str):
              cues = []
              for blk in re.split(r"\r?\n\r?\n+", raw_txt.lstrip("\ufeff").strip()):
                  lns = [l for l in blk.splitlines() if l.strip()]
                  ti = next((i for i, l in enumerate(lns[:3]) if "-->" in l), -1)
                  if ti < 0: continue
                  parts = lns[ti].split("-->")
                  if len(parts) < 2: continue
                  s_ms = ts_to_ms(parts[0])
                  e_ms = ts_to_ms(parts[1].strip().split()[0])
                  body = "\r\n".join(lns[ti + 1:]).strip()
                  if e_ms > s_ms and body:
                      cues.append((s_ms, e_ms, body))
              return cues

          def _slice_srt_window(cues, win_start_ms: int, win_end_ms: int) -> str:
              out = []
              idx_c = 1
              dur_ms = max(1, win_end_ms - win_start_ms)
              for cs, ce, body in cues:
                  if ce <= win_start_ms or cs >= win_end_ms: continue
                  ns = max(0, cs - win_start_ms)
                  ne = min(dur_ms, ce - win_start_ms)
                  if ne - ns < 120: continue
                  out.append(f"{idx_c}\r\n{ms_to_ts(ns)} --> {ms_to_ts(ne)}\r\n{body}")
                  idx_c += 1
              return ("\ufeff" + "\r\n\r\n".join(out) + "\r\n") if out else ""

          def _split_lossless_once(src_fp: Path, dst_dir: Path, prefix: str, seg_sec: int, is_vid: bool):
              dst_dir.mkdir(parents=True, exist_ok=True)
              ext = src_fp.suffix.lower()
              pattern = str(dst_dir / f"{prefix}_%03d{ext}")
              cmd = ["/usr/bin/ffmpeg", "-y", "-i", str(src_fp), "-dn", "-map_chapters", "-1"]
              cmd += ["-map", "0:v:0", "-map", "0:a:0?"] if is_vid else ["-map", "0:a:0"]
              cmd += ["-c", "copy", "-f", "segment", "-segment_time", str(max(4, seg_sec)), "-reset_timestamps", "1"]
              if ext in (".mp4", ".m4a", ".mov"):
                  cmd += ["-segment_format_options", "movflags=+faststart"]
              cmd.append(pattern)
              subprocess.run(cmd, capture_output=True, text=True, check=False)
              return sorted([p for p in dst_dir.glob(f"{prefix}_*{ext}") if p.is_file() and p.stat().st_size > 0])

          email_sent_status = ""
          email_delivered_ok = False
          if send_email_flag and not (smtp_user and smtp_pass and recipient and "@" in recipient):
              email_sent_status = "⚠️ חסרים Secrets של מייל (SMTP_USER/SMTP_PASS)"
          elif send_email_flag:
              _t_em = time.time()
              try:
                  clean_stem = _mail_safe_stem(primary_file.stem)
                  ext_low = primary_file.suffix.lower()
                  base_subject = f"YouTube Cloud Ultra [{quality_report}] - {clean_stem}"

                  def _open_smtp():
                      s = smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=120)
                      s.login(smtp_user, smtp_pass)
                      return s

                  # מצב א' (הטוב והבטוח ביותר): הקובץ כבר הועלה ל-Google Drive -> שלח מייל אחד קליל (2KB) עם קישור צפייה והורדה!
                  if drive_web_link and primary_file.stat().st_size > MAX_GMAIL_RAW_BYTES:
                      msg = email.message.EmailMessage()
                      msg["Subject"] = base_subject
                      msg["From"] = smtp_user
                      msg["To"] = recipient
                      msg.set_content(
                          f"שלום,\n\n"
                          f"הקובץ הועלה ל-Google Drive באיכות המקורית המלאה (ללא דחיסה וללא פיצול)!\n"
                          f"• שם הקובץ: {clean_stem}{ext_low}\n"
                          f"• איכות / סוג: {quality_report}\n"
                          f"• גודל: {file_mb} MB\n"
                          f"• קישור ישיר לצפייה והורדה ב-Google Drive:\n{drive_web_link}\n"
                      )
                      _side_srts = list(out_dir.glob("*.srt"))
                      if not _side_srts and embedded_srt_saved and embedded_srt_saved.exists():
                          _side_srts = [embedded_srt_saved]
                      for srt_f in _side_srts:
                          if srt_f.stat().st_size <= 2 * 1024 * 1024:
                              msg.add_attachment(srt_f.read_bytes(), maintype="text", subtype="plain", filename=f"{clean_stem}.he.srt")
                      with _open_smtp() as srv:
                          srv.send_message(msg)
                      email_delivered_ok = True
                      email_sent_status = "נשלח מייל אחד עם קישור Google Drive (איכות מלאה)"
                      print(f">>> EMAIL OK: {email_sent_status}", flush=True)

                  # מצב ב': הקובץ קטן מ-17.5MB -> מייל אחד עם הקובץ המקורי באיכות 100%!
                  elif primary_file.exists() and primary_file.stat().st_size <= MAX_GMAIL_RAW_BYTES:
                      msg = email.message.EmailMessage()
                      msg["Subject"] = base_subject
                      msg["From"] = smtp_user
                      msg["To"] = recipient
                      msg.set_content(
                          f"שלום,\n\n"
                          f"הקובץ הורד ונשלח אליך באיכות המקורית המלאה!\n"
                          f"• שם הקובץ: {clean_stem}{ext_low}\n"
                          f"• איכות / סוג: {quality_report}\n"
                          f"• גודל: {file_mb} MB\n"
                          + (f"• קישור Google Drive: {drive_web_link}\n" if drive_web_link else "")
                      )
                      msg.add_attachment(primary_file.read_bytes(), maintype="application", subtype="octet-stream", filename=f"{clean_stem}{ext_low}")
                      for srt_f in out_dir.glob("*.srt"):
                          if srt_f != primary_file and srt_f.stat().st_size <= 2 * 1024 * 1024:
                              msg.add_attachment(srt_f.read_bytes(), maintype="text", subtype="plain", filename=f"{clean_stem}.he.srt")
                      with _open_smtp() as srv:
                          srv.send_message(msg)
                      email_delivered_ok = True
                      email_sent_status = "נשלח למייל באיכות מקורית"
                      print(f">>> EMAIL OK: {email_sent_status}", flush=True)

                  # מצב ג': אין Google Drive והקובץ > 17.5MB -> פיצול Lossless בטוח עד 5 חלקים (בהשהיה של 25 שנ') או מייל אחד מוגן!
                  else:
                      mail_work = Path("/tmp/mail_parts")
                      if mail_work.exists(): shutil.rmtree(mail_work, ignore_errors=True)
                      mail_work.mkdir(parents=True, exist_ok=True)

                      is_vid_file = ext_low in (".mp4", ".mkv", ".webm")
                      is_aud_file = ext_low in (".mp3", ".m4a", ".flac", ".wav", ".opus")
                      tot_bytes = primary_file.stat().st_size
                      est_parts_count = math.ceil(tot_bytes / TARGET_CHUNK_BYTES)

                      # הגנת חסימת Gmail: לעולם לא לשלוח מעל 5 מיילים כבדים!
                      if (is_vid_file or is_aud_file) and est_parts_count <= MAX_SAFE_SMTP_PARTS:
                          srt_cues = []
                          srt_source = None
                          if embedded_srt_saved and embedded_srt_saved.exists() and embedded_srt_saved.stat().st_size > 15:
                              srt_source = embedded_srt_saved
                          elif _probe_has_subs(primary_file):
                              ext_tmp = mail_work / "extracted_internal.srt"
                              if subprocess.run(["/usr/bin/ffmpeg", "-y", "-i", str(primary_file), "-map", "0:s:0", str(ext_tmp)], capture_output=True, check=False).returncode == 0 and ext_tmp.exists():
                                  srt_source = ext_tmp
                          else:
                              side_srts = sorted(out_dir.glob("*.srt"))
                              if side_srts: srt_source = side_srts[0]
                          if srt_source and srt_source.exists():
                              srt_cues = _parse_raw_srt(srt_source.read_text(encoding="utf-8", errors="replace"))

                          tot_dur = _probe_dur_sec(primary_file) or float(locals().get("detected_dur") or 0.0) or 600.0
                          est_seg_sec = max(8, int(tot_dur * (TARGET_CHUNK_BYTES / max(1, tot_bytes))))
                          raw_chunks = _split_lossless_once(primary_file, mail_work / "pass0", "seg", est_seg_sec, is_vid_file)

                          for _round in range(2):
                              next_chunks, changed = [], False
                              for c_i, ch_fp in enumerate(raw_chunks):
                                  ch_sz = ch_fp.stat().st_size
                                  if ch_sz > MAX_GMAIL_RAW_BYTES:
                                      ch_d = _probe_dur_sec(ch_fp)
                                      n_sub = max(2, math.ceil(ch_sz / (13.0 * 1024 * 1024)))
                                      sub_list = _split_lossless_once(ch_fp, mail_work / f"r{_round}_{c_i}", "sub", max(4, int(ch_d / n_sub)), is_vid_file)
                                      if len(sub_list) >= 2:
                                          next_chunks.extend(sub_list); changed = True; continue
                                  next_chunks.append(ch_fp)
                              raw_chunks = next_chunks
                              if not changed: break
                      else:
                          raw_chunks = []

                      if raw_chunks and len(raw_chunks) <= MAX_SAFE_SMTP_PARTS:
                          final_dir = mail_work / "final"
                          final_dir.mkdir(parents=True, exist_ok=True)
                          cursor_ms, parts_to_send, has_internal_subs_preserved, skipped_mail_parts = 0, [], False, 0
                          for idx_p, ch_fp in enumerate(raw_chunks, 1):
                              c_dur_sec = _probe_dur_sec(ch_fp)
                              c_dur_ms = max(1000, int(round(c_dur_sec * 1000)))
                              win_s, win_e = cursor_ms, cursor_ms + c_dur_ms
                              cursor_ms = win_e
                              part_name = f"{clean_stem} - Part {idx_p:02d}{ext_low}"
                              part_dst = final_dir / part_name
                              part_ext_srt = None
                              sliced_srt_txt = _slice_srt_window(srt_cues, win_s, win_e) if srt_cues else ""
                              if sliced_srt_txt and is_vid_file and ext_low in (".mp4", ".mkv"):
                                  part_srt_fp = final_dir / f"{clean_stem} - Part {idx_p:02d}.he.srt"
                                  part_srt_fp.write_text(sliced_srt_txt, encoding="utf-8")
                                  if subtitles == "embed" or _probe_has_subs(primary_file):
                                      sub_codec = "mov_text" if ext_low == ".mp4" else "srt"
                                      mux_cmd = ["/usr/bin/ffmpeg", "-y", "-i", str(ch_fp), "-i", str(part_srt_fp), "-map", "0:v:0", "-map", "0:a:0?", "-map", "1:0", "-dn", "-map_chapters", "-1", "-c", "copy", "-c:s", sub_codec, "-metadata:s:s:0", "language=heb", "-metadata:s:s:0", "title=Hebrew"]
                                      if ext_low == ".mp4": mux_cmd += ["-movflags", "+faststart"]
                                      mux_cmd.append(str(part_dst))
                                      if subprocess.run(mux_cmd, capture_output=True, check=False).returncode == 0 and part_dst.exists() and part_dst.stat().st_size > 0:
                                          has_internal_subs_preserved = True
                                      else:
                                          shutil.copy2(str(ch_fp), str(part_dst)); part_ext_srt = part_srt_fp
                                  else:
                                      shutil.copy2(str(ch_fp), str(part_dst))
                                      if subtitles == "files": part_ext_srt = part_srt_fp
                              else:
                                  shutil.copy2(str(ch_fp), str(part_dst))
                              if part_dst.exists() and part_dst.stat().st_size <= int(18.5 * 1024 * 1024):
                                  parts_to_send.append((part_dst, int(round(c_dur_sec)), part_ext_srt))
                              else:
                                  skipped_mail_parts += 1
                                  print(f"WARNING: Email part #{idx_p} exceeded 18.5MB limit and was skipped.", flush=True)

                          pl_lines = ["#EXTM3U"]
                          for pf, pdur, _ in parts_to_send:
                              pl_lines.append(f"#EXTINF:{max(1, pdur)},{pf.stem}")
                              pl_lines.append(pf.name)
                          playlist_file = final_dir / f"00 - הפעל הכל לפי הסדר - {clean_stem}.m3u8"
                          playlist_file.write_text("\n".join(pl_lines) + "\n", encoding="utf-8")

                          total_parts = len(parts_to_send)
                          thread_id = f"<ytcloud-{req_id}-part1@gmail.com>"
                          sent_ok = 0
                          for p_idx, (part_fp, _, part_srt) in enumerate(parts_to_send, 1):
                              part_mb = round(part_fp.stat().st_size / (1024 * 1024), 1)
                              msg = email.message.EmailMessage()
                              msg["Subject"] = base_subject
                              msg["From"] = smtp_user
                              msg["To"] = recipient
                              msg["Message-ID"] = thread_id if p_idx == 1 else f"<ytcloud-{req_id}-part{p_idx}@gmail.com>"
                              if p_idx > 1:
                                  msg["In-Reply-To"] = thread_id
                                  msg["References"] = thread_id
                              sub_line = "• כתוביות פנימיות בעברית: מוטמעות ומסונכרנות אוטומטית בכל חלק!\n" if has_internal_subs_preserved else ""
                              msg.set_content(
                                  f"שלום,\n\nחלק {p_idx} מתוך {total_parts} — איכות מקורית מלאה (השהיה בטוחה למניעת חסימת Gmail)!\n"
                                  f"• קובץ מצורף: {part_fp.name} ({part_mb} MB)\n"
                                  f"• איכות מקור: {quality_report} (גודל כולל: {file_mb} MB)\n"
                                  f"{sub_line}"
                                  f"• להפעלה אוטומטית ברצף: שמור את כל {total_parts} החלקים + קובץ הפלייליסט (.m3u8 ממייל #1) באותה תיקייה ולחץ דאבל-קליק על \"00 - הפעל הכל לפי הסדר...\".\n"
                              )
                              if p_idx == 1 and playlist_file.exists():
                                  msg.add_attachment(playlist_file.read_bytes(), maintype="application", subtype="vnd.apple.mpegurl", filename=playlist_file.name)
                              msg.add_attachment(part_fp.read_bytes(), maintype="application", subtype="octet-stream", filename=part_fp.name)
                              if part_srt and part_srt.exists() and part_srt.stat().st_size <= 2 * 1024 * 1024:
                                  msg.add_attachment(part_srt.read_bytes(), maintype="text", subtype="plain", filename=part_srt.name)
                              with _open_smtp() as srv:
                                  srv.send_message(msg)
                              sent_ok += 1
                              if p_idx < total_parts:
                                  print(f"Waiting {SMTP_COOLDOWN_SEC}s before next email part to protect Gmail account...", flush=True)
                                  time.sleep(SMTP_COOLDOWN_SEC)

                          email_delivered_ok = (sent_ok > 0)
                          _skip_note = f" (⚠️ {skipped_mail_parts} חלקים חרגו מ-18.5MB ודולגו)" if skipped_mail_parts else ""
                          email_sent_status = f"נשלח למייל באיכות מקורית ({sent_ok}/{total_parts} חלקים מושהים + פלייליסט){_skip_note}"
                          print(f">>> EMAIL OK: {email_sent_status}", flush=True)
                      else:
                          # קובץ גדול מ-~75MB ללא Drive: מגן Gmail — שולח מייל 1 בטוח בלבד כדי לא לנעול את החשבון!
                          mail_preview = mail_work / f"{clean_stem} (Mail Safe).mp4"
                          attach_fp = None
                          if is_vid_file:
                              dur_sec = max(10.0, _probe_dur_sec(primary_file) or float(locals().get("detected_dur") or 600.0))
                              v_kbps = max(95, int((14.5 * 8192) / dur_sec) - 56)
                              t_h = 480 if v_kbps >= 280 else 360
                              subprocess.run([
                                  "/usr/bin/ffmpeg", "-y", "-i", str(primary_file),
                                  "-map", "0:v:0", "-map", "0:a:0?", "-dn", "-map_chapters", "-1",
                                  "-vf", f"scale=trunc(oh*a/2)*2:{t_h}", "-c:v", "libx264", "-preset", "veryfast",
                                  "-b:v", f"{v_kbps}k", "-maxrate", f"{int(v_kbps * 1.15)}k", "-bufsize", f"{v_kbps * 2}k",
                                  "-c:a", "aac", "-b:a", "56k", "-movflags", "+faststart",
                                  "-fs", str(int(16.0 * 1024 * 1024)), str(mail_preview)
                              ], capture_output=True, check=False)
                              if mail_preview.exists() and 0 < mail_preview.stat().st_size <= MAX_GMAIL_RAW_BYTES:
                                  attach_fp = mail_preview

                          msg = email.message.EmailMessage()
                          msg["Subject"] = base_subject
                          msg["From"] = smtp_user
                          msg["To"] = recipient
                          msg.set_content(
                              f"שלום,\n\n"
                              f"🛡️ הגנת חסימת Gmail הופעלה: הקובץ המקורי גדול מאוד ({file_mb} MB — כ-{est_parts_count} חלקים) "
                              f"ושליחה של מעל {MAX_SAFE_SMTP_PARTS} מיילים כבדים גורמת לגוגל לנעול את חשבון ה-Gmail זמנית.\n\n"
                              + (f"• מצב ענן בלבד פעיל — הקובץ המלא לא הורד למחשב (0MB).\n" if cloud_only_flag else f"• הקובץ המלא באיכות המקורית ({quality_report}) נשמר אצלך במחשב!\n")
                              + (f"• למייל זה צורף עותק צפייה מותאם במייל אחד בטוח ({round(attach_fp.stat().st_size / (1024*1024), 1)} MB).\n" if attach_fp else "")
                              + "• טיפ: חבר Google Drive (דרך הגדרת ה-Secrets של Drive במאגר) — ואז כל קובץ גדול יועלה אוטומטית ל-Drive באיכות 100% וישלח אליך במייל אחד קליל עם קישור ישיר!\n"
                          )
                          if attach_fp:
                              msg.add_attachment(attach_fp.read_bytes(), maintype="application", subtype="octet-stream", filename=attach_fp.name)
                          _anti_srts = list(out_dir.glob("*.srt"))
                          if not _anti_srts and embedded_srt_saved and embedded_srt_saved.exists():
                              _anti_srts = [embedded_srt_saved]
                          for srt_f in _anti_srts:
                              if srt_f.stat().st_size <= 2 * 1024 * 1024:
                                  msg.add_attachment(srt_f.read_bytes(), maintype="text", subtype="plain", filename=f"{clean_stem}.he.srt")
                          with _open_smtp() as srv:
                              srv.send_message(msg)
                          email_delivered_ok = True
                          email_sent_status = f"נשלח מייל אחד מוגן (הגנת חסימת Gmail לקובץ {file_mb}MB — חבר Drive לאיכות מלאה)"
                          print(f">>> EMAIL OK (ANTI-LOCKOUT): {email_sent_status}", flush=True)
              except Exception as e:
                  print(f"Email delivery error: {type(e).__name__}: {e}", flush=True)
                  email_sent_status = f"שגיאת מייל ({type(e).__name__})"
              finally:
                  telemetry["email_sec"] = round(time.time() - _t_em, 1)

          _email_ok = bool(email_delivered_ok)
          is_cloud_only_done = bool(cloud_only_flag and (drive_web_link or _email_ok))
          rel_files = [str(z) for z in zip_paths]
          if cloud_only_flag:
              marker_name = "cloud-ok.txt" if is_cloud_only_done else "cloud-failed.txt"
              drv_marker = pkg_dir / marker_name
              marker_msg = (
                  "Cloud-Only delivery (Drive/Email) completed. Zero local PC download.\n"
                  if is_cloud_only_done
                  else f"Cloud-Only delivery failed: drive={drive_status} | email={email_sent_status}\n"
              )
              drv_marker.write_text(marker_msg, encoding="utf-8")
              rel_files = [str(drv_marker)]
              blob_shas = []
          telemetry["total_cloud_sec"] = round(time.time() - t_job_start, 1)
          telemetry["file_mb"] = file_mb
          notes = json.dumps({
              "v": 23.22,
              "size": zip_size,
              "video_title": primary_file.stem,
              "quality_info": f"{quality_report} ({file_mb} MB)",
              "subs_verified": subs_verified_flag,
              "subs_detail": subs_detail_msg,
              "split_join": split_join_meta,
              "email_status": email_sent_status,
              "drive_status": drive_status,
              "drive_url_enc": drive_url_enc,
              "drive_only": is_cloud_only_done,
              "cloud_only": is_cloud_only_done,
              "cloud_temp_path": "Cloud-Only (0MB Local Traffic -> Drive/Email)" if cloud_only_flag else ("/tmp/stage -> /tmp/out -> /tmp/pkg/" + zip_path.name),
              "blobs": blob_shas,
              "telemetry": telemetry
          }, ensure_ascii=False)

          rel_cmd = ["gh", "release", "create", tag] + rel_files + ["--repo", repo, "--title", tag, "--notes", notes]
          rel_proc = subprocess.run(rel_cmd, capture_output=True, text=True, check=False)
          if rel_proc.returncode != 0:
              print("gh release create failed:", rel_proc.stderr, flush=True)
              upload_ok = True
              for z in rel_files:
                  up_proc = subprocess.run(["gh", "release", "upload", tag, str(z), "--repo", repo, "--clobber"], capture_output=True, text=True, check=False)
                  if up_proc.returncode != 0:
                      print("gh release upload failed:", up_proc.stderr, flush=True)
                      upload_ok = False
              if not upload_ok:
                  raise SystemExit("::error::Release creation and upload failed; triggering backup artifact")
          EOF

      - name: Upload Backup Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dl-${{ inputs.request_id }}
          path: /tmp/out/*
          if-no-files-found: ignore
          retention-days: 1
