name: download
run-name: dl-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id: { required: true, type: string }
      url: { required: true, type: string }
      quality: { required: false, default: "best", type: string }
      mode: { required: false, default: "video", type: string }
      urls: { required: false, default: "", type: string }
      clip_start: { required: false, default: "", type: string }
      clip_end: { required: false, default: "", type: string }
      subtitles: { required: false, default: "none", type: string }
      sponsorblock: { required: false, default: "{}", type: string }
      cookies_enc: { required: false, default: "", type: string }

permissions:
  contents: write
  actions: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp + ffmpeg + curl_cffi + atomicparsley
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg zip python3-cryptography python3-pip atomicparsley
          python3 -m pip install --break-system-packages -q -U --pre "yt-dlp[default,curl-cffi]" yt-dlp-ejs bgutil-ytdlp-pot-provider cryptography requests
          if command -v docker >/dev/null 2>&1; then
            docker run -d --rm -p 4416:4416 --name bgutil-pot brainicism/bgutil-ytdlp-pot-provider:latest || true
          fi
          sleep 3
          python3 -m yt_dlp --version

      - name: Execute Smart Engine v5 (Release + Direct API Blob Bridge + Email Delivery)
        env:
          GH_TOKEN: ${{ github.token }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
          COOKIE_KEY_FALLBACK: "ea1641dc747be6a7af79e7152865d3f8d566fd74ec00c02cb13db642d05fddc3"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, sys, re, json, time, base64, shutil, zipfile, subprocess, smtplib, email.message, urllib.parse, requests
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          ev_path = os.environ.get("GITHUB_EVENT_PATH", "")
          ev = json.load(open(ev_path, "r", encoding="utf-8")) if ev_path and os.path.exists(ev_path) else {}
          inp = ev.get("inputs") or {}

          req_id = str(inp.get("request_id", "")).strip()
          target_url = str(inp.get("url", "")).strip()
          quality = str(inp.get("quality", "best")).strip().lower() or "best"
          mode = str(inp.get("mode", "video")).strip().lower() or "video"
          urls_raw = str(inp.get("urls", "")).strip()
          clip_start = str(inp.get("clip_start", "")).strip()
          clip_end = str(inp.get("clip_end", "")).strip()
          subtitles = str(inp.get("subtitles", "none")).strip().lower()
          raw_sb = str(inp.get("sponsorblock", "{}")).strip()
          cookies_enc = str(inp.get("cookies_enc", "")).strip()
          hex_key = (os.environ.get("COOKIE_KEY", "").strip() or os.environ.get("COOKIE_KEY_FALLBACK", "").strip())

          try:
              opts = json.loads(raw_sb) if raw_sb.startswith("{") else {"sb": raw_sb.lower() == "true"}
          except Exception:
              opts = {}

          geo = str(opts.get("geo") or "IL").upper()
          sb = bool(opts.get("sb"))
          chapters = bool(opts.get("chapters"))
          norm_audio = bool(opts.get("norm"))
          speed_val = str(opts.get("speed") or "1").strip()
          email_opt = str(opts.get("email") or "").strip()
          send_email_flag = bool(opts.get("send_email")) or bool(email_opt)

          out_dir = Path("/tmp/out")
          pkg_dir = Path("/tmp/pkg")
          stage_dir = Path("/tmp/stage")
          subs_dir = Path("/tmp/subs")
          out_dir.mkdir(parents=True, exist_ok=True)
          pkg_dir.mkdir(parents=True, exist_ok=True)
          cookie_file = Path("/tmp/cookies.txt")

          has_ck = False
          if cookies_enc and len(hex_key) == 64:
              try:
                  raw = base64.b64decode(cookies_enc)
                  plain = AESGCM(bytes.fromhex(hex_key)).decrypt(raw[:12], raw[12:], None).decode("utf-8", errors="replace")
                  # תיקון שגיאה 3: ניקוי עוגיות מיקום/מטמון מקומי (PREF, VISITOR_INFO1_LIVE, YSC) שגורמות ליוטיוב להפנות את שרת ה-GitHub בארה"ב
                  # לשרת מטמון סגור של ספק אינטרנט בישראל (כמו rr1---sn-uphho-hqae.googlevideo.com)! שומרים רק עוגיות אימות חשבון.
                  cleaned_lines = []
                  for line in plain.splitlines():
                      if line.startswith("#") or not line.strip():
                          cleaned_lines.append(line)
                          continue
                      parts = line.split("\t")
                      if len(parts) >= 7 and parts[5] in ("PREF", "VISITOR_INFO1_LIVE", "VISITOR_PRIVACY_METADATA", "YSC", "__Secure-YEC"):
                          continue
                      cleaned_lines.append(line)
                  cookie_file.write_text("\n".join(cleaned_lines) + "\n", encoding="utf-8")
                  has_ck = True
                  print("Cookies decrypted and geo-cache routing tokens cleaned successfully.", flush=True)
              except Exception as e:
                  print("Cookie decrypt notice:", e, flush=True)

          target_urls = [target_url]
          if mode == "list" and urls_raw:
              try:
                  parsed = json.loads(urls_raw)
                  if isinstance(parsed, list) and parsed:
                      target_urls = [str(u).strip() for u in parsed if str(u).strip().startswith("http")]
              except Exception:
                  pass

          is_audio = quality.startswith("audio")
          height_map = {"2160": 2160, "1440": 1440, "1080": 1080, "720": 720, "480": 480, "360": 360}
          req_h = height_map.get(quality, 1080 if quality == "best" else 2160)
          max_h = 2160 if quality == "best" else req_h

          def get_fmt_args(mode_type: str):
              if quality == "audio":
                  return ["-f", "ba/b", "-x", "--audio-format", "mp3", "--audio-quality", "320K", "--embed-thumbnail", "--embed-metadata"]
              if quality == "audio_m4a":
                  return ["-f", "ba[ext=m4a]/ba/b", "-x", "--audio-format", "m4a", "--audio-quality", "0", "--embed-thumbnail", "--embed-metadata"]
              if quality == "audio_opus":
                  return ["-f", "ba[acodec=opus]/ba/b", "-x", "--audio-format", "opus", "--audio-quality", "0", "--embed-metadata"]
              if quality == "audio_flac":
                  return ["-f", "ba/b", "-x", "--audio-format", "flac", "--audio-quality", "0", "--embed-thumbnail", "--embed-metadata"]
              if quality == "audio_wav":
                  return ["-f", "ba/b", "-x", "--audio-format", "wav", "--audio-quality", "0"]

              # תיקון שגיאה 2: מצב HLS טהור (ללא נפילה ל-137 של mweb שנחסם ב-20MB בקובצי ענק!)
              if mode_type == "pure_hls":
                  fmt = (
                      f"bv*[protocol*=m3u8][height<={max_h}][height>=720]+ba[protocol*=m3u8]/"
                      f"bv*[protocol*=m3u8][height<={max_h}][height>=720]+ba/"
                      f"b[protocol*=m3u8][height<={max_h}][height>=720]/"
                      f"bv*[protocol*=m3u8][height<={max_h}]+ba"
                  )
                  sort_str = f"proto:m3u8_native,res:{max_h},fps,vcodec:h264:vp9,ext:mp4"
                  return ["-f", fmt, "-S", sort_str, "--hls-prefer-native", "--merge-output-format", "mp4", "--remux-video", "mp4", "--embed-metadata"]

              if mode_type == "strict_hd" and max_h >= 720:
                  fmt = (
                      f"bv*[height<={max_h}][height>=720]+ba/"
                      f"bv*[height<={max_h}][height>=480]+ba/"
                      f"b[height<={max_h}][height>=720]"
                  )
                  if quality in ("2160", "1440"):
                      sort_str = f"res:{max_h},fps,vcodec:vp9:av01:h264,acodec:m4a:aac,ext:mp4:m4a"
                  else:
                      sort_str = f"res:{max_h},fps,vcodec:h264:vp9:av01,acodec:m4a:aac,ext:mp4:m4a"
                  return ["-f", fmt, "-S", sort_str, "--merge-output-format", "mp4", "--remux-video", "mp4", "--embed-metadata"]

              fmt = f"bv*[height<={max_h}]+ba/b[height<={max_h}]/bv*+ba/b"
              sort_str = f"res:{max_h},vcodec:h264:vp9,acodec:m4a:aac,ext:mp4:m4a"
              return ["-f", fmt, "-S", sort_str, "--merge-output-format", "mp4", "--remux-video", "mp4", "--embed-metadata"]

          def inspect_media_quality(fpath: Path):
              try:
                  cmd = [
                      "ffprobe", "-v", "error",
                      "-show_entries", "stream=codec_type,codec_name,width,height,bit_rate:format=bit_rate,duration",
                      "-of", "json", str(fpath)
                  ]
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=15)
                  data = json.loads(r.stdout)
                  streams = data.get("streams") or []
                  v_s = next((s for s in streams if s.get("codec_type") == "video" and int(s.get("height") or 0) > 0), None)
                  a_s = next((s for s in streams if s.get("codec_type") == "audio"), None)
                  dur = float((data.get("format") or {}).get("duration") or 0)
                  if v_s:
                      w = int(v_s.get("width") or 0)
                      h = int(v_s.get("height") or 0)
                      vc = (v_s.get("codec_name") or "mp4").upper()
                      if h >= 2160 or w >= 3840: tag = f"4K UHD ({h}p)"
                      elif h >= 1440 or w >= 2560: tag = f"2K QHD ({h}p)"
                      elif h >= 1080 or w >= 1920: tag = f"Full HD ({h}p)"
                      elif h >= 720 or w >= 1280: tag = f"HD ({h}p)"
                      else: tag = f"{h}p"
                      return h, dur, f"{tag} [{w}x{h} • {vc}]"
                  if a_s:
                      ac = (a_s.get("codec_name") or fpath.suffix.lstrip(".")).upper()
                      br = int(a_s.get("bit_rate") or (data.get("format") or {}).get("bit_rate") or 0)
                      kbps = f" {round(br / 1000)}kbps" if br > 0 else ""
                      return 0, dur, f"אודיו ({ac}{kbps})"
              except Exception:
                  pass
              return 0, 0.0, "תקין"

          # תיקון שגיאה 1 + 3:
          # 1. --force-ipv4 מונע כשלי התחברות curl (7) לשרתי googlevideo ב-IPv6.
          # 2. הווידאו יורד ללא דגלי כתוביות בכלל! הכתוביות יורדות בשלב נפרד ומוגן כדי ששגיאת 429 בכתוביות לעולם לא תפיל את הורדת הווידאו!
          base_extra_args = [
              "--force-ipv4",
              "--no-mtime",
              "--no-warnings",
              "--no-check-certificates",
              "--js-runtimes", "deno",
              "--socket-timeout", "20",
              "--extractor-args", "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416",
          ]
          if mode != "collection":
              base_extra_args.append("--no-playlist")
          else:
              base_extra_args += ["--yes-playlist", "--playlist-end", "35"]

          if clip_start or clip_end:
              s = clip_start or "00:00:00"
              e = clip_end or "inf"
              base_extra_args += ["--download-sections", f"*{s}-{e}", "--force-keyframes-at-cuts"]

          if sb:
              base_extra_args += ["--sponsorblock-remove", "sponsor,intro,outro,selfpromo,interaction"]
          if chapters and not is_audio:
              base_extra_args += ["--split-chapters"]

          # בניית סדר שלבים חכם: כשיש עוגיות, מתחילים מיד בשלבים המאומתים ולא מבזבזים זמן על 3 כשלי "Sign in to confirm you're not a bot"!
          attempts = []
          if has_ck:
              attempts.extend([
                  # שלב 1: Web Safari HLS מבודד לחלוטין (ללא mweb!) - מוריד מקטעי HLS מתוך manifest.googlevideo.com שלעולם לא נחסמים ב-20MB (פתרון שגיאה 2) ולא מנותבים ל-sn-uphho-hqae (פתרון שגיאה 3)!
                  ("Authenticated Web Safari Pure HLS (Anti-403 / Large File Safe)", [
                      "--cookies", str(cookie_file),
                      "--concurrent-fragments", "4",
                      "--extractor-args", "youtube:player_client=web_safari;fetch_pot=always"
                  ], "pure_hls"),
                  # שלב 2: TV Simply / TV Client עם עוגיות ו-PO Token
                  ("Authenticated TV Client HD + PO-Token", [
                      "--cookies", str(cookie_file),
                      "--concurrent-fragments", "1",
                      "--http-chunk-size", "10M",
                      "--extractor-args", "youtube:player_client=tv,tv_simply;fetch_pot=always"
                  ], "strict_hd"),
                  # שלב 3: Web + MWeb ללא impersonate (שימוש ב-urllib/IPv4 תקני של המערכת במקום curl_cffi שנכשל ב-curl 7)
                  ("Authenticated Web/MWeb Standard IPv4 + PO-Token", [
                      "--cookies", str(cookie_file),
                      "--concurrent-fragments", "1",
                      "--http-chunk-size", "10M",
                      "--extractor-args", "youtube:player_client=mweb,web;fetch_pot=always"
                  ], "strict_hd"),
                  # שלב 4: גיבוי תאימות מלא
                  ("Authenticated Universal Compatibility", [
                      "--cookies", str(cookie_file),
                      "--concurrent-fragments", "2",
                      "--extractor-args", "youtube:player_client=web_safari,tv,mweb,web;fetch_pot=always"
                  ], "any"),
              ])

          # שלבים ללא עוגיות (עבור סרטונים שאינם דורשים התחברות או כשלא הועברו עוגיות)
          attempts.extend([
              ("TV Embedded + Android VR (No-Cookies HD)", [
                  "--concurrent-fragments", "2",
                  "--http-chunk-size", "10M",
                  "--extractor-args", "youtube:player_client=tv_embedded,android_vr;player_skip=webpage;fetch_pot=always"
              ], "strict_hd"),
              ("iOS + Web Safari HLS (No-Cookies HD)", [
                  "--concurrent-fragments", "4",
                  "--extractor-args", "youtube:player_client=ios,web_safari;fetch_pot=always"
              ], "pure_hls"),
          ])

          def get_stage_files():
              return [p for p in stage_dir.rglob("*") if p.is_file() and not p.name.endswith((".part", ".ytdl", ".temp")) and p.stat().st_size > 0]

          # פונקציה ייעודית ומוגנת להורדת כתוביות בעברית/אנגלית (פתרון מלא לשגיאה 1 - HTTP 429)
          def download_and_attach_subtitles(video_url: str, media_file: Path):
              if subtitles not in ("embed", "files"):
                  return
              print(f"\n--- Fetching Subtitles Safely for {media_file.name} (Mode: {subtitles}) ---", flush=True)
              if subs_dir.exists():
                  shutil.rmtree(subs_dir, ignore_errors=True)
              subs_dir.mkdir(parents=True, exist_ok=True)

              base_sub_cmd = [
                  "python3", "-m", "yt_dlp",
                  "--ignore-config", "--force-ipv4", "--no-warnings", "--no-check-certificates",
                  "--skip-download", "--ignore-errors",
                  "--sleep-subtitles", "5",
                  "--js-runtimes", "deno",
                  "--convert-subs", "srt",
                  "-o", f"/tmp/subs/{media_file.stem}.%(ext)s",
              ]
              if has_ck:
                  base_sub_cmd += ["--cookies", str(cookie_file)]

              # ניסיון א': כתוביות מקוריות בעברית או תרגום אוטומטי לעברית בבקשה בודדת עם השהיה של 5 שניות
              for sub_try in [
                  ["--write-subs", "--sub-langs", "he,iw"],
                  ["--write-auto-subs", "--sub-langs", "iw"],
                  ["--write-auto-subs", "--sub-langs", "he"],
              ]:
                  subprocess.run(base_sub_cmd + sub_try + [video_url], check=False)
                  found_srts = list(subs_dir.glob("*.srt"))
                  if found_srts and found_srts[0].stat().st_size > 20:
                      break

              found_srts = [p for p in subs_dir.glob("*.srt") if p.stat().st_size > 20]

              # ניסיון ב': אם יוטיוב החזיר 429 על התרגום האוטומטי לעברית (iw), מורידים את כתוביות האנגלית המקוריות (שלא נחסמות ב-429!) ומתרגמים לעברית בענן!
              if not found_srts:
                  print("Direct Hebrew subtitles hit 429 or unavailable. Fetching original English captions and translating to Hebrew...", flush=True)
                  subprocess.run(base_sub_cmd + ["--write-subs", "--write-auto-subs", "--sub-langs", "en-orig,en", video_url], check=False)
                  en_srts = [p for p in subs_dir.glob("*.srt") if p.stat().st_size > 20]
                  if en_srts:
                      src_srt = en_srts[0]
                      he_srt = subs_dir / f"{media_file.stem}.he.srt"
                      try:
                          raw_srt = src_srt.read_text(encoding="utf-8", errors="replace")
                          blocks = raw_srt.strip().split("\n\n")
                          # תרגום מהיר בקבוצות דרך Google Translate API
                          texts_to_tr = []
                          block_meta = []
                          for b in blocks:
                              lines = b.splitlines()
                              if len(lines) >= 3 and "-->" in lines[1]:
                                  block_meta.append((lines[0], lines[1]))
                                  texts_to_tr.append(" ".join(lines[2:]))
                              elif len(lines) >= 2 and "-->" in lines[0]:
                                  block_meta.append((str(len(block_meta) + 1), lines[0]))
                                  texts_to_tr.append(" ".join(lines[1:]))

                          translated_texts = []
                          chunk_sz = 35
                          for i in range(0, len(texts_to_tr), chunk_sz):
                              joined = "\n ||| \n".join(texts_to_tr[i:i + chunk_sz])
                              tr_url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=iw&dt=t&q=" + urllib.parse.quote(joined)
                              r = requests.get(tr_url, timeout=15)
                              if r.status_code == 200:
                                  tr_full = "".join(p[0] for p in r.json()[0] if p and p[0])
                                  parts = [x.strip() for x in tr_full.split("|||")]
                                  if len(parts) == len(texts_to_tr[i:i + chunk_sz]):
                                      translated_texts.extend(parts)
                                  else:
                                      translated_texts.extend(texts_to_tr[i:i + chunk_sz])
                              else:
                                  translated_texts.extend(texts_to_tr[i:i + chunk_sz])

                          out_srt_blocks = []
                          for (idx_str, ts_str), txt_str in zip(block_meta, translated_texts):
                              out_srt_blocks.append(f"{idx_str}\n{ts_str}\n{txt_str}")
                          if out_srt_blocks:
                              he_srt.write_text("\n\n".join(out_srt_blocks) + "\n", encoding="utf-8")
                              found_srts = [he_srt]
                              print("Successfully translated English subtitles to Hebrew SRT!", flush=True)
                      except Exception as tr_err:
                          print("Subtitle translation fallback notice:", tr_err, flush=True)
                          found_srts = [src_srt]

              if not found_srts:
                  print("No subtitles found for this video (video file itself is safe).", flush=True)
                  return

              best_srt = found_srts[0]
              if subtitles == "files" or is_audio:
                  dest_srt = out_dir / f"{media_file.stem}.srt"
                  shutil.copy2(str(best_srt), str(dest_srt))
                  print(f"Saved separate subtitle file: {dest_srt.name}", flush=True)
              elif subtitles == "embed" and media_file.suffix.lower() in (".mp4", ".mkv"):
                  embedded_tmp = media_file.with_name("sub_" + media_file.name)
                  sub_codec = "mov_text" if media_file.suffix.lower() == ".mp4" else "srt"
                  ff_sub_cmd = [
                      "/usr/bin/ffmpeg", "-y",
                      "-i", str(media_file),
                      "-i", str(best_srt),
                      "-c", "copy",
                      "-c:s", sub_codec,
                      "-metadata:s:s:0", "language=heb",
                      str(embedded_tmp)
                  ]
                  if subprocess.run(ff_sub_cmd, check=False).returncode == 0 and embedded_tmp.exists():
                      embedded_tmp.replace(media_file)
                      print("Embedded Hebrew subtitles into video container successfully!", flush=True)
                  else:
                      # אם ההטמעה נכשלה, נשמור כקובץ SRT נפרד כדי שלא יאבד
                      shutil.copy2(str(best_srt), str(out_dir / f"{media_file.stem}.srt"))

          for u_idx, cur_url in enumerate(target_urls, 1):
              print(f"\n>>> Processing URL {u_idx}/{len(target_urls)}: {cur_url} (Quality: {quality})", flush=True)
              downloaded_media_for_url = None
              for label, args, f_mode in attempts:
                  if stage_dir.exists():
                      shutil.rmtree(stage_dir, ignore_errors=True)
                  stage_dir.mkdir(parents=True, exist_ok=True)

                  cmd = [
                      "python3", "-m", "yt_dlp",
                      "--ignore-config",
                      "--ffmpeg-location", "/usr/bin/ffmpeg",
                      "--retries", "6",
                      "--fragment-retries", "6",
                      "--file-access-retries", "5",
                      "-o", "/tmp/stage/%(title).150B [%(id)s].%(ext)s",
                  ] + args + get_fmt_args(f_mode) + base_extra_args + [cur_url]

                  print(f"=== Trying: {label} (Mode={f_mode}) ===", flush=True)
                  subprocess.run(cmd, check=False)

                  s_files = get_stage_files()
                  media_files = [p for p in s_files if p.suffix.lower() in (".mp4", ".mkv", ".webm", ".mp3", ".m4a", ".flac", ".wav", ".opus")]
                  if media_files:
                      if not is_audio and f_mode != "any" and req_h >= 720:
                          heights = [inspect_media_quality(m)[0] for m in media_files]
                          max_det_h = max(heights) if heights else 0
                          print(f"Detected video height: {max_det_h}p", flush=True)
                          if 0 < max_det_h <= 360:
                              print("Rejected 360p fallback! Advancing to next HD client...", flush=True)
                              continue
                      for f in s_files:
                          dest_f = out_dir / f.name
                          shutil.move(str(f), str(dest_f))
                          if dest_f.suffix.lower() in (".mp4", ".mkv", ".webm", ".mp3", ".m4a", ".flac", ".wav", ".opus"):
                              downloaded_media_for_url = dest_f
                      print(f"=== Success with: {label} ===", flush=True)
                      break

              if downloaded_media_for_url and subtitles in ("embed", "files"):
                  download_and_attach_subtitles(cur_url, downloaded_media_for_url)

          files = [p for p in out_dir.rglob("*") if p.is_file() and not p.name.endswith((".part", ".ytdl")) and p.stat().st_size > 0]
          if not files:
              raise SystemExit("::error::הורדת המדיה נכשלה בכל הקליינטים")

          if (speed_val not in ("1", "1.0", "")) or norm_audio:
              for fpath in list(files):
                  if fpath.suffix.lower() not in (".mp4", ".mkv", ".mp3", ".m4a", ".flac", ".wav", ".opus"):
                      continue
                  try:
                      spd = float(speed_val) if speed_val else 1.0
                  except Exception:
                      spd = 1.0
                  if spd <= 0 or (abs(spd - 1.0) < 0.01 and not norm_audio):
                      continue
                  tmp_p = fpath.with_name("proc_" + fpath.name)
                  af = []
                  if abs(spd - 1.0) >= 0.01:
                      af.append(f"atempo={spd}")
                  if norm_audio:
                      af.append("loudnorm=I=-16:TP=-1.5:LRA=11")
                  ff_cmd = ["/usr/bin/ffmpeg", "-y", "-i", str(fpath)]
                  if fpath.suffix.lower() in (".mp4", ".mkv", ".webm") and abs(spd - 1.0) >= 0.01:
                      ff_cmd += ["-filter:v", f"setpts=PTS/{spd}"]
                  if af:
                      ff_cmd += ["-filter:a", ",".join(af)]
                  ff_cmd.append(str(tmp_p))
                  if subprocess.run(ff_cmd, check=False).returncode == 0 and tmp_p.exists():
                      tmp_p.replace(fpath)

          media_out = [p for p in files if p.suffix.lower() in (".mp4", ".mkv", ".webm", ".mp3", ".m4a", ".flac", ".wav", ".opus")]
          primary_file = media_out[0] if media_out else files[0]
          detected_h, detected_dur, quality_report = inspect_media_quality(primary_file)
          file_mb = round(primary_file.stat().st_size / (1024 * 1024), 1)
          print(f">>> VERIFIED DOWNLOADED QUALITY: {quality_report} ({file_mb} MB) <<<", flush=True)

          tag = "dl-" + req_id
          zip_path = pkg_dir / (tag + ".zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for f in files:
                  zf.write(f, f.relative_to(out_dir))

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          zip_size = zip_path.stat().st_size
          blob_shas = []

          if zip_size <= 35 * 1024 * 1024:
              raw_bytes = zip_path.read_bytes()
              chunk_size = 12 * 1024 * 1024
              for offset in range(0, len(raw_bytes), chunk_size):
                  chunk = raw_bytes[offset:offset + chunk_size]
                  b64_payload = json.dumps({"content": base64.b64encode(chunk).decode("ascii"), "encoding": "base64"})
                  p = subprocess.run(["gh", "api", f"repos/{repo}/git/blobs", "-q", ".sha", "--input", "-"], input=b64_payload, text=True, capture_output=True, check=False)
                  if p.returncode == 0 and p.stdout.strip():
                      blob_shas.append(p.stdout.strip())
              del raw_bytes

          smtp_user = (
              os.environ.get("SMTP_USER", "").strip()
              or os.environ.get("EMAIL_USER", "").strip()
              or os.environ.get("GMAIL_USER", "").strip()
          )
          smtp_pass = (
              os.environ.get("SMTP_PASS", "").strip()
              or os.environ.get("EMAIL_PASS", "").strip()
              or os.environ.get("GMAIL_APP_PASSWORD", "").strip()
              or os.environ.get("GMAIL_PASS", "").strip()
          )
          secret_to = (
              os.environ.get("EMAIL_TO", "").strip()
              or os.environ.get("SMTP_TO", "").strip()
              or smtp_user
          )
          recipient = email_opt if (email_opt and "@" in email_opt) else secret_to

          email_sent_status = ""
          if send_email_flag:
              if not smtp_user or not smtp_pass:
                  email_sent_status = "שגיאת מייל: חסר SMTP_USER או SMTP_PASS ב-Secrets"
                  print(email_sent_status, flush=True)
              elif not recipient or "@" not in recipient:
                  email_sent_status = "שגיאת מייל: לא נמצאה כתובת יעד"
                  print(email_sent_status, flush=True)
              else:
                  try:
                      attach_target = primary_file if len(files) == 1 else zip_path
                      attach_note = "מצורף הקובץ המקורי."
                      if attach_target.stat().st_size > 24 * 1024 * 1024 and primary_file.suffix.lower() in (".mp4", ".mkv", ".webm"):
                          print(f"File is {file_mb}MB (>24MB Gmail limit). Creating compressed email attachment...", flush=True)
                          mail_mp4 = Path("/tmp/email_copy.mp4")
                          target_total_kbps = max(250, int((21 * 8192) / max(10.0, detected_dur or 300.0)) - 96)
                          ff_mail = [
                              "/usr/bin/ffmpeg", "-y", "-i", str(primary_file),
                              "-vf", "scale='min(854,iw)':-2",
                              "-c:v", "libx264", "-preset", "veryfast", "-b:v", f"{target_total_kbps}k", "-maxrate", f"{target_total_kbps}k", "-bufsize", f"{target_total_kbps*2}k",
                              "-c:a", "aac", "-b:a", "96k",
                              str(mail_mp4)
                          ]
                          subprocess.run(ff_mail, check=False)
                          if mail_mp4.exists() and mail_mp4.stat().st_size <= 24 * 1024 * 1024:
                              attach_target = mail_mp4
                              attach_note = f"הקובץ המקורי ({file_mb}MB) ירד באיכות {quality_report} למחשב. למייל זה צורף עותק מכווץ ({round(mail_mp4.stat().st_size/(1024*1024),1)}MB) המותאם למגבלת 25MB של Gmail."

                      msg = email.message.EmailMessage()
                      msg["Subject"] = f"YouTube Cloud Ultra [{quality_report}] - {primary_file.name}"
                      msg["From"] = smtp_user
                      msg["To"] = recipient
                      msg.set_content(
                          f"שלום,\n\n"
                          f"הקובץ ירד בהצלחה בענן!\n"
                          f"• שם הקובץ: {primary_file.name}\n"
                          f"• איכות שנבדקה בפועל: {quality_report}\n"
                          f"• גודל הקובץ המקורי: {file_mb} MB\n"
                          f"• הערה: {attach_note}\n"
                      )
                      if attach_target.stat().st_size <= 24 * 1024 * 1024:
                          msg.add_attachment(
                              attach_target.read_bytes(),
                              maintype="application",
                              subtype="octet-stream",
                              filename=primary_file.name if attach_target != zip_path else zip_path.name
                          )
                      with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=60) as srv:
                          srv.login(smtp_user, smtp_pass)
                          srv.send_message(msg)
                      email_sent_status = f"נשלח למייל ({recipient})"
                      print(f"Email sent successfully to {recipient}", flush=True)
                  except Exception as e:
                      email_sent_status = f"שגיאה בשליחת מייל: {e}"
                      print("Email error:", e, flush=True)

          notes = json.dumps({
              "v": 7,
              "size": zip_size,
              "quality_info": f"{quality_report} ({file_mb} MB)",
              "email_status": email_sent_status,
              "blobs": blob_shas
          }, ensure_ascii=False)

          rel_proc = subprocess.run(
              ["gh", "release", "create", tag, str(zip_path), "--repo", repo, "--title", tag, "--notes", notes],
              capture_output=True, text=True, check=False
          )
          if rel_proc.returncode != 0:
              subprocess.run(["gh", "release", "upload", tag, str(zip_path), "--repo", repo, "--clobber"], check=False)
          EOF

      - name: Upload Backup Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dl-${{ inputs.request_id }}
          path: /tmp/out/*
          if-no-files-found: ignore
          retention-days: 1
