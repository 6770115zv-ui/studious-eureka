name: Download Media

on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      url:
        required: true
        type: string
      quality:
        required: false
        default: "best"
        type: string
      mode:
        required: false
        default: "video"
        type: string
      urls:
        required: false
        default: ""
        type: string
      clip_start:
        required: false
        default: ""
        type: string
      clip_end:
        required: false
        default: ""
        type: string
      subtitles:
        required: false
        default: "none"
        type: string
      sponsorblock:
        required: false
        default: "{}"
        type: string
      cookies_enc:
        required: false
        default: ""
        type: string

run-name: dl-\${{ inputs.request_id }}

permissions:
  contents: write
  actions: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp + ffmpeg + curl_cffi + atomicparsley
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg atomicparsley zip jq python3-pip
          python3 -m pip install --upgrade --break-system-packages "yt-dlp[default,curl-cffi]" cryptography

      - name: Execute Smart Fallback Engine v4 and Publish
        env:
          REQ_ID: \${{ inputs.request_id }}
          TARGET_URL: \${{ inputs.url }}
          QUALITY: \${{ inputs.quality }}
          MODE: \${{ inputs.mode }}
          URLS_JSON: \${{ inputs.urls }}
          CLIP_START: \${{ inputs.clip_start }}
          CLIP_END: \${{ inputs.clip_end }}
          SUBS: \${{ inputs.subtitles }}
          EXT_OPTS: \${{ inputs.sponsorblock }}
          COOKIES_ENC: \${{ inputs.cookies_enc }}
          COOKIE_KEY: \${{ secrets.COOKIE_KEY }}
          GH_TOKEN: \${{ github.token }}
          GH_REPO: \${{ github.repository }}
        run: |
          mkdir -p out work
          python3 - << 'EOF'
          import base64, json, os, subprocess, sys, glob, zipfile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          cookies_path = None
          enc = os.environ.get("COOKIES_ENC", "").strip()
          key_hex = os.environ.get("COOKIE_KEY", "").strip()
          if enc and len(key_hex) == 64:
              try:
                  raw = base64.b64decode(enc)
                  aes = AESGCM(bytes.fromhex(key_hex))
                  dec = aes.decrypt(raw[:12], raw[12:], None).decode("utf-8", errors="ignore")
                  if "# Netscape" in dec or "youtube.com" in dec:
                      cookies_path = "work/cookies.txt"
                      with open(cookies_path, "w", encoding="utf-8") as f:
                          f.write(dec)
              except Exception as e:
                  print("Cookie decrypt skipped:", e)

          q = os.environ.get("QUALITY", "best").strip()
          mode = os.environ.get("MODE", "video").strip()
          subs = os.environ.get("SUBS", "none").strip()
          c_start = os.environ.get("CLIP_START", "").strip()
          c_end = os.environ.get("CLIP_END", "").strip()

          try:
              opts = json.loads(os.environ.get("EXT_OPTS", "{}") or "{}")
          except Exception:
              opts = {}

          geo = opts.get("geo") or "IL"
          sb = bool(opts.get("sb"))
          chapters = bool(opts.get("chapters"))
          norm = bool(opts.get("norm"))

          fmt_args = []
          if q == "audio":
              fmt_args = ["-f", "bestaudio/best", "-x", "--audio-format", "mp3", "--audio-quality", "0", "--embed-thumbnail", "--add-metadata"]
          elif q == "audio_m4a":
              fmt_args = ["-f", "bestaudio/best", "-x", "--audio-format", "m4a", "--audio-quality", "0", "--embed-thumbnail", "--add-metadata"]
          elif q == "audio_opus":
              fmt_args = ["-f", "bestaudio/best", "-x", "--audio-format", "opus", "--audio-quality", "0", "--add-metadata"]
          elif q == "audio_flac":
              fmt_args = ["-f", "bestaudio/best", "-x", "--audio-format", "flac", "--audio-quality", "0", "--add-metadata"]
          elif q == "audio_wav":
              fmt_args = ["-f", "bestaudio/best", "-x", "--audio-format", "wav", "--audio-quality", "0"]
          elif q in ("2160", "1440", "1080", "720", "480", "360"):
              fmt_args = [
                  "-f", f"bestvideo[height<={q}]+bestaudio/best[height<={q}]/bestvideo+bestaudio/best",
                  "-S", f"res:{q},fps,br",
                  "--merge-output-format", "mp4"
              ]
          else:
              fmt_args = [
                  "-f", "bestvideo+bestaudio/best",
                  "-S", "res,fps,br",
                  "--merge-output-format", "mp4"
              ]

          extra = [
              "--no-mtime",
              "--geo-bypass",
              "--geo-bypass-country", geo,
              "--trim-filenames", "140",
              "-o", "out/%(title)s [%(id)s].%(ext)s"
          ]
          if mode != "collection":
              extra.append("--no-playlist")
          if subs == "embed":
              extra += ["--write-subs", "--write-auto-subs", "--sub-langs", "he,iw,en.*", "--embed-subs"]
          elif subs == "files":
              extra += ["--write-subs", "--write-auto-subs", "--sub-langs", "he,iw,en.*", "--convert-subs", "srt"]
          if sb:
              extra += ["--sponsorblock-remove", "sponsor,intro,outro,selfpromo,interaction"]
          if chapters:
              extra += ["--split-chapters"]
          if c_start or c_end:
              s = c_start or "00:00:00"
              e = c_end or "inf"
              extra += ["--download-sections", f"*{s}-{e}", "--force-keyframes-at-cuts"]
          if norm:
              extra += ["--postprocessor-args", "ffmpeg:-af loudnorm=I=-16:TP=-1.5:LRA=11"]

          urls = []
          if mode == "list":
              try:
                  urls = [u.strip() for u in json.loads(os.environ.get("URLS_JSON", "[]")) if u and u.strip()]
              except Exception:
                  pass
          if not urls:
              u_single = os.environ.get("TARGET_URL", "").strip()
              if u_single:
                  urls = [u_single]

          strategies = [
              [],
              ["--extractor-args", "youtube:player_client=ios,web"],
              ["--extractor-args", "youtube:player_client=tv,web_embedded"],
              ["--extractor-args", "youtube:player_client=android_vr"]
          ]

          def valid_out_files():
              return {
                  f for f in glob.glob("out/*")
                  if os.path.isfile(f) and not f.endswith((".part", ".ytdl", ".temp"))
              }

          for u in urls:
              before = valid_out_files()
              success = False

              # ניסיון עם עוגיות (אם קיימות)
              if cookies_path and os.path.exists(cookies_path):
                  for strat in strategies:
                      cmd = ["yt-dlp", "--ignore-errors", "--retries", "5", "--fragment-retries", "5", "--cookies", cookies_path] + fmt_args + extra + strat + [u]
                      subprocess.run(cmd, check=False)
                      if len(valid_out_files() - before) > 0:
                          success = True
                          break

              # גיבוי ללא עוגיות אם העוגיות פגו או לא הוגדרו
              if not success:
                  for strat in strategies:
                      cmd = ["yt-dlp", "--ignore-errors", "--retries", "5", "--fragment-retries", "5"] + fmt_args + extra + strat + [u]
                      subprocess.run(cmd, check=False)
                      if len(valid_out_files() - before) > 0:
                          success = True
                          break

          final_files = sorted(valid_out_files())
          if not final_files:
              print("No files were downloaded.")
              sys.exit(1)

          req_id = os.environ["REQ_ID"]
          zip_filename = f"dl-{req_id}.zip"
          with zipfile.ZipFile(zip_filename, "w", compression=zipfile.ZIP_STORED) as zf:
              for fpath in final_files:
                  zf.write(fpath, arcname=os.path.basename(fpath))
          print("Created archive:", zip_filename, "with", len(final_files), "files.")
          EOF

          TAG="dl-\${REQ_ID}"
          ZIP_NAME="\${TAG}.zip"
          gh release create "$TAG" "$ZIP_NAME" --repo "$GH_REPO" --title "$TAG" --notes "Automated cloud media delivery"

      - name: Upload Backup Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dl-\${{ inputs.request_id }}
          path: out/*
          retention-days: 1
