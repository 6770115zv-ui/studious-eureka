name: download
run-name: dl-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id: { required: true, type: string }
      url: { required: true, type: string }
      quality: { required: false, default: "best", type: string }
      mode: { required: false, default: "video", type: string }
      urls: { required: false, default: "", type: string }
      clip_start: { required: false, default: "", type: string }
      clip_end: { required: false, default: "", type: string }
      subtitles: { required: false, default: "none", type: string }
      sponsorblock: { required: false, default: "{}", type: string }
      cookies_enc: { required: false, default: "", type: string }

permissions:
  contents: write
  actions: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp + ffmpeg + curl_cffi + atomicparsley
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg zip python3-cryptography python3-pip atomicparsley
          python3 -m pip install --break-system-packages -q -U --pre "yt-dlp[default,curl-cffi]" yt-dlp-ejs bgutil-ytdlp-pot-provider cryptography requests
          if command -v docker >/dev/null 2>&1; then
            docker run -d --rm -p 4416:4416 --name bgutil-pot brainicism/bgutil-ytdlp-pot-provider:latest || true
          fi
          sleep 3
          python3 -m yt_dlp --version

      - name: Execute Smart Engine v5 (Release + Direct API Blob Bridge + Email Delivery)
        env:
          GH_TOKEN: ${{ github.token }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
          COOKIE_KEY_FALLBACK: "ea1641dc747be6a7af79e7152865d3f8d566fd74ec00c02cb13db642d05fddc3"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, sys, re, json, time, math, base64, shutil, zipfile, subprocess, smtplib, email.message, urllib.parse, requests
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          ev_path = os.environ.get("GITHUB_EVENT_PATH", "")
          ev = json.load(open(ev_path, "r", encoding="utf-8")) if ev_path and os.path.exists(ev_path) else {}
          inp = ev.get("inputs") or {}

          req_id = str(inp.get("request_id", "")).strip()
          target_url = str(inp.get("url", "")).strip()
          quality = str(inp.get("quality", "best")).strip().lower() or "best"
          mode = str(inp.get("mode", "video")).strip().lower() or "video"
          urls_raw = str(inp.get("urls", "")).strip()
          clip_start = str(inp.get("clip_start", "")).strip()
          clip_end = str(inp.get("clip_end", "")).strip()
          subtitles = str(inp.get("subtitles", "none")).strip().lower()
          raw_sb = str(inp.get("sponsorblock", "{}")).strip()
          cookies_enc = str(inp.get("cookies_enc", "")).strip()
          hex_key = (os.environ.get("COOKIE_KEY", "").strip() or os.environ.get("COOKIE_KEY_FALLBACK", "").strip())

          if quality == "subs_only" or subtitles == "only":
              quality = "subs_only"
              subtitles = "only"

          try:
              opts = json.loads(raw_sb) if raw_sb.startswith("{") else {"sb": raw_sb.lower() == "true"}
          except Exception:
              opts = {}

          geo = str(opts.get("geo") or "IL").upper()
          sb = bool(opts.get("sb"))
          chapters = bool(opts.get("chapters"))
          norm_audio = bool(opts.get("norm"))
          speed_val = str(opts.get("speed") or "1").strip()
          email_opt = str(opts.get("email") or "").strip()
          send_email_flag = bool(opts.get("send_email")) or bool(email_opt)

          out_dir = Path("/tmp/out")
          pkg_dir = Path("/tmp/pkg")
          stage_dir = Path("/tmp/stage")
          subs_dir = Path("/tmp/subs")
          out_dir.mkdir(parents=True, exist_ok=True)
          pkg_dir.mkdir(parents=True, exist_ok=True)
          cookie_file = Path("/tmp/cookies.txt")

          has_ck = False
          if cookies_enc and len(hex_key) == 64:
              try:
                  raw = base64.b64decode(cookies_enc)
                  plain = AESGCM(bytes.fromhex(hex_key)).decrypt(raw[:12], raw[12:], None).decode("utf-8", errors="replace")
                  cleaned_lines = []
                  for line in plain.splitlines():
                      if line.startswith("#") or not line.strip():
                          cleaned_lines.append(line)
                          continue
                      parts = line.split("\t")
                      if len(parts) >= 7 and parts[5] in ("PREF", "VISITOR_INFO1_LIVE", "VISITOR_PRIVACY_METADATA", "YSC", "__Secure-YEC"):
                          continue
                      cleaned_lines.append(line)
                  cookie_file.write_text("\n".join(cleaned_lines) + "\n", encoding="utf-8")
                  has_ck = True
                  print("Cookies decrypted successfully.", flush=True)
              except Exception as e:
                  print("Cookie decrypt notice:", e, flush=True)

          target_urls = [target_url]
          if mode == "list" and urls_raw:
              try:
                  parsed = json.loads(urls_raw)
                  if isinstance(parsed, list) and parsed:
                      target_urls = [str(u).strip() for u in parsed if str(u).strip().startswith("http")]
              except Exception:
                  pass

          is_subs_only = (quality == "subs_only" or subtitles == "only")
          is_audio = quality.startswith("audio")
          height_map = {"2160": 2160, "1440": 1440, "1080": 1080, "720": 720, "480": 480, "360": 360}
          # במצב best מאפשרים עד 4K (2160p) עם עדיפות ל-1080p ומעלה!
          req_h = height_map.get(quality, 2160)

          def translate_srt_file_to_hebrew(src_srt: Path, dest_he_srt: Path) -> bool:
              try:
                  raw_srt = src_srt.read_text(encoding="utf-8", errors="replace")
                  blocks = re.split(r"\r?\n\r?\n", raw_srt.strip())
                  texts_to_tr = []
                  block_meta = []
                  for b in blocks:
                      lines = [ln.strip() for ln in b.splitlines() if ln.strip()]
                      if len(lines) >= 3 and "-->" in lines[1]:
                          block_meta.append((lines[0], lines[1]))
                          texts_to_tr.append(" ".join(lines[2:]))
                      elif len(lines) >= 2 and "-->" in lines[0]:
                          block_meta.append((str(len(block_meta) + 1), lines[0]))
                          texts_to_tr.append(" ".join(lines[1:]))

                  if not texts_to_tr:
                      return False

                  translated_texts = []
                  chunk_sz = 30
                  for i in range(0, len(texts_to_tr), chunk_sz):
                      batch = texts_to_tr[i:i + chunk_sz]
                      joined = "\n ||| \n".join(batch)
                      tr_url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=iw&dt=t&q=" + urllib.parse.quote(joined)
                      r = requests.get(tr_url, timeout=15)
                      if r.status_code == 200:
                          tr_full = "".join(p[0] for p in r.json()[0] if p and p[0])
                          parts = [x.strip() for x in tr_full.split("|||")]
                          if len(parts) == len(batch):
                              translated_texts.extend(parts)
                          else:
                              translated_texts.extend(batch)
                      else:
                          translated_texts.extend(batch)

                  out_srt_blocks = []
                  for (idx_str, ts_str), txt_str in zip(block_meta, translated_texts):
                      out_srt_blocks.append(f"{idx_str}\n{ts_str}\n{txt_str}")
                  if out_srt_blocks:
                      dest_he_srt.write_text("\n\n".join(out_srt_blocks) + "\n", encoding="utf-8")
                      return dest_he_srt.exists() and dest_he_srt.stat().st_size > 20
              except Exception as e:
                  print("Subtitle translation notice:", e, flush=True)
              return False

          def fetch_subtitles_for_url(video_url: str, base_stem: str = None):
              if subs_dir.exists():
                  shutil.rmtree(subs_dir, ignore_errors=True)
              subs_dir.mkdir(parents=True, exist_ok=True)

              out_tmpl = f"/tmp/subs/{base_stem}.%(ext)s" if base_stem else "/tmp/subs/%(title).120B [%(id)s].%(ext)s"
              base_sub_cmd = [
                  "python3", "-m", "yt_dlp",
                  "--ignore-config", "--force-ipv4", "--no-warnings", "--no-check-certificates",
                  "--skip-download", "--ignore-errors",
                  "--sleep-subtitles", "5",
                  "--js-runtimes", "deno",
                  "--extractor-args", "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416",
                  "--convert-subs", "srt",
                  "-o", out_tmpl,
              ]
              if mode != "collection":
                  base_sub_cmd.append("--no-playlist")
              if has_ck:
                  base_sub_cmd += ["--cookies", str(cookie_file)]

              for sub_try in [
                  ["--write-subs", "--sub-langs", "he,iw"],
                  ["--write-auto-subs", "--sub-langs", "iw,he"],
              ]:
                  subprocess.run(base_sub_cmd + sub_try + [video_url], check=False)
                  he_srts = [p for p in subs_dir.glob("*.srt") if p.stat().st_size > 20]
                  if he_srts:
                      return he_srts, "כתוביות בעברית (SRT)"

              for en_try in [
                  ["--write-subs", "--sub-langs", "en-orig,en,en.*"],
                  ["--write-auto-subs", "--sub-langs", "en-orig,en,en.*"],
                  ["--write-subs", "--write-auto-subs"],
              ]:
                  subprocess.run(base_sub_cmd + en_try + [video_url], check=False)
                  en_srts = [p for p in subs_dir.glob("*.srt") if p.stat().st_size > 20]
                  if en_srts:
                      src_en = en_srts[0]
                      clean_stem = re.sub(r"\.[a-zA-Z0-9_-]+$", "", src_en.stem)
                      he_translated = subs_dir / f"{clean_stem}.he-translated.srt"
                      result_files = [src_en]
                      status_label = "כתוביות באנגלית (SRT)"
                      if translate_srt_file_to_hebrew(src_en, he_translated):
                          result_files.insert(0, he_translated)
                          status_label = "כתוביות מתורגמות לעברית + מקור באנגלית (SRT)"
                      return result_files, status_label

              return [], "לא נמצאו כתוביות זמינות"

          if is_subs_only:
              quality_report = "כתוביות בלבד (SRT)"
              detected_dur = 0.0
              for u_idx, cur_url in enumerate(target_urls, 1):
                  srt_list, q_label = fetch_subtitles_for_url(cur_url)
                  quality_report = q_label
                  for s_file in srt_list:
                      shutil.copy2(str(s_file), str(out_dir / s_file.name))

              files = [p for p in out_dir.rglob("*") if p.is_file() and p.stat().st_size > 0]
              if not files:
                  raise SystemExit("::error::לא נמצאו כתוביות (בעברית או באנגלית) עבור קישור זה")
              primary_file = files[0]
          else:
              # מנוע בחירת הפורמטים המתוקן (v8.4):
              # 1. כאשר מבקשים best/1080/1440/2160, הענפים הראשונים מחייבים height>=1080!
              #    כך שלעולם לא ירד 720p (f136) כאשר קיים 1080p (כמו f137, f248 או f399)!
              # 2. בתוך 1080p ומעלה, נעדיף תחילה זרמים שגודלם עד 1800M (כגון 1080p AV1/VP9 בסרטונים ארוכים או 1080p H264 בסרטונים רגילים),
              #    ואם כולם גדולים מ-1800M, נוריד את ה-1080p המלא ונפצל אותו בבטחה לשני קובצי ZIP תקניים!
              def get_fmt_args(strict_hd: bool, prefer_hls: bool = False):
                  if quality == "audio":
                      return ["-f", "ba/b", "-x", "--audio-format", "mp3", "--audio-quality", "320K", "--embed-thumbnail", "--embed-metadata"]
                  if quality == "audio_m4a":
                      return ["-f", "ba[ext=m4a]/ba/b", "-x", "--audio-format", "m4a", "--audio-quality", "0", "--embed-thumbnail", "--embed-metadata"]
                  if quality == "audio_opus":
                      return ["-f", "ba[acodec=opus]/ba/b", "-x", "--audio-format", "opus", "--audio-quality", "0", "--embed-metadata"]
                  if quality == "audio_flac":
                      return ["-f", "ba/b", "-x", "--audio-format", "flac", "--audio-quality", "0", "--embed-thumbnail", "--embed-metadata"]
                  if quality == "audio_wav":
                      return ["-f", "ba/b", "-x", "--audio-format", "wav", "--audio-quality", "0"]

                  if prefer_hls:
                      min_hls = 1080 if req_h >= 1080 else 720
                      fmt = (
                          f"bv*[protocol*=m3u8][height<={req_h}][height>={min_hls}]+ba/"
                          f"b[protocol*=m3u8][height<={req_h}][height>={min_hls}]/"
                          f"bv*[protocol*=m3u8][height<={req_h}][height>=720]+ba/"
                          f"bv*[height<={req_h}][height>={min_hls}]+ba"
                      )
                      sort_str = f"res:{req_h},fps,vcodec:h264:vp9:av01,ext:mp4"
                  elif strict_hd and req_h >= 1080:
                      # קודם כל מחייבים 1080p ומעלה (ללא שום אפשרות ל-720p בענפים הראשונים!)
                      fmt = (
                          f"bv*[height<={req_h}][height>=1080][filesize<1800M]+ba[ext=m4a]/"
                          f"bv*[height<={req_h}][height>=1080][filesize_approx<1800M]+ba[ext=m4a]/"
                          f"bv*[height<={req_h}][height>=1080]+ba[ext=m4a]/"
                          f"bv*[height<={req_h}][height>=1080]+ba/"
                          f"bv*[height<={req_h}][height>=720]+ba[ext=m4a]/"
                          f"bv*[height<={req_h}][height>=720]+ba/"
                          f"b[height<={req_h}][height>=720]"
                      )
                      if quality in ("2160", "1440"):
                          sort_str = f"res:{req_h},fps,vcodec:vp9:av01:h264,acodec:m4a:aac:opus,ext:mp4:m4a"
                      else:
                          sort_str = f"res:1080,fps,vcodec:h264:vp9:av01,acodec:m4a:aac:opus,ext:mp4:m4a"
                  elif strict_hd and req_h >= 720:
                      fmt = f"bv*[height<=720][height>=720]+ba[ext=m4a]/bv*[height<=720][height>=720]+ba/b[height<=720][height>=720]"
                      sort_str = "res:720,fps,vcodec:h264:vp9:av01,acodec:m4a:aac,ext:mp4:m4a"
                  else:
                      fmt = f"bv*[height<={req_h}]+ba/b[height<={req_h}]/bv*+ba/b"
                      sort_str = f"res:{req_h},fps,vcodec:h264:vp9:av01,acodec:m4a:aac,ext:mp4:m4a"

                  return [
                      "-f", fmt,
                      "-S", sort_str,
                      "--merge-output-format", "mp4",
                      "--postprocessor-args", "Merger+ffmpeg:-movflags +faststart",
                      "--embed-metadata"
                  ]

              def inspect_media_quality(fpath: Path):
                  try:
                      cmd = [
                          "ffprobe", "-v", "error",
                          "-show_entries", "stream=codec_type,codec_name,width,height,bit_rate:format=bit_rate,duration",
                          "-of", "json", str(fpath)
                      ]
                      r = subprocess.run(cmd, capture_output=True, text=True, timeout=15)
                      data = json.loads(r.stdout)
                      streams = data.get("streams") or []
                      v_s = next((s for s in streams if s.get("codec_type") == "video" and int(s.get("height") or 0) > 0), None)
                      a_s = next((s for s in streams if s.get("codec_type") == "audio"), None)
                      dur = float((data.get("format") or {}).get("duration") or 0)
                      if v_s:
                          w = int(v_s.get("width") or 0)
                          h = int(v_s.get("height") or 0)
                          vc = (v_s.get("codec_name") or "mp4").upper()
                          if h >= 2160 or w >= 3840: tag = f"4K UHD ({h}p)"
                          elif h >= 1440 or w >= 2560: tag = f"2K QHD ({h}p)"
                          elif h >= 1080 or w >= 1920: tag = f"Full HD ({h}p)"
                          elif h >= 720 or w >= 1280: tag = f"HD ({h}p)"
                          else: tag = f"{h}p"
                          return h, dur, f"{tag} [{w}x{h} • {vc}]"
                      if a_s:
                          ac = (a_s.get("codec_name") or fpath.suffix.lstrip(".")).upper()
                          br = int(a_s.get("bit_rate") or (data.get("format") or {}).get("bit_rate") or 0)
                          kbps = f" {round(br / 1000)}kbps" if br > 0 else ""
                          return 0, dur, f"אודיו ({ac}{kbps})"
                  except Exception:
                      pass
                  return 0, 0.0, "תקין"

              extra_args = [
                  "--force-ipv4",
                  "--no-mtime",
                  "--no-warnings",
                  "--no-check-certificates",
                  "--js-runtimes", "deno",
                  "--concurrent-fragments", "1",
                  "--http-chunk-size", "10M",
                  "--socket-timeout", "25",
              ]
              if mode != "collection":
                  extra_args.append("--no-playlist")
              else:
                  extra_args += ["--yes-playlist", "--playlist-end", "35"]

              if clip_start or clip_end:
                  s = clip_start or "00:00:00"
                  e = clip_end or "inf"
                  extra_args += ["--download-sections", f"*{s}-{e}", "--force-keyframes-at-cuts"]

              if sb:
                  extra_args += ["--sponsorblock-remove", "sponsor,intro,outro,selfpromo,interaction"]
              if chapters and not is_audio:
                  extra_args += ["--split-chapters"]

              pot_base = "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
              attempts = []
              # כשיש עוגיות, מריצים קודם כל את הקליינטים המאומתים שפותחים 1080p/4K מיד ללא בזבוז זמן!
              if has_ck:
                  attempts.extend([
                      ("Authenticated Web + Chrome + Chunked 10M (1080p/4K)", ["--cookies", str(cookie_file), "--impersonate", "chrome", "--extractor-args", f"youtube:player_client=web,mweb;fetch_pot=always;{pot_base}"], True, False),
                      ("Authenticated TV Embedded / Creator HD", ["--cookies", str(cookie_file), "--extractor-args", f"youtube:player_client=tv_embedded,web_creator,tv;{pot_base}"], True, False),
                      ("Authenticated Web Safari / iOS HLS Stream", ["--cookies", str(cookie_file), "--impersonate", "safari", "--extractor-args", f"youtube:player_client=web_safari;{pot_base}"], True, True),
                  ])
              attempts.extend([
                  ("Android VR + TV Embedded Pure HD (Chunked)", ["--extractor-args", f"youtube:player_client=android_vr,tv_embedded;player_skip=webpage;{pot_base}"], True, False),
                  ("MWeb + Web + Chrome Impersonate + PO-Token", ["--impersonate", "chrome", "--extractor-args", f"youtube:player_client=mweb,web;fetch_pot=always;{pot_base}"], True, False),
                  ("iOS + Web Safari HLS Segmented HD", ["--impersonate", "safari", "--extractor-args", f"youtube:player_client=ios,web_safari;{pot_base}"], True, True),
                  ("Universal Compatibility Fallback", (["--cookies", str(cookie_file)] if has_ck else []) + ["--extractor-args", f"youtube:player_client=android_vr,ios,mweb,web;{pot_base}"], False, False),
              ])

              def get_stage_files():
                  return [p for p in stage_dir.rglob("*") if p.is_file() and not p.name.endswith((".part", ".ytdl", ".temp")) and p.stat().st_size > 0]

              for u_idx, cur_url in enumerate(target_urls, 1):
                  print(f"\n>>> Processing URL {u_idx}/{len(target_urls)}: {cur_url} (Quality: {quality})", flush=True)
                  downloaded_media_for_url = None
                  for label, args, strict_hd, prefer_hls in attempts:
                      if stage_dir.exists():
                          shutil.rmtree(stage_dir, ignore_errors=True)
                      stage_dir.mkdir(parents=True, exist_ok=True)

                      cmd = [
                          "python3", "-m", "yt_dlp",
                          "--ignore-config",
                          "--ffmpeg-location", "/usr/bin/ffmpeg",
                          "--retries", "10",
                          "--fragment-retries", "10",
                          "--file-access-retries", "5",
                          "-o", "/tmp/stage/%(title).150B [%(id)s].%(ext)s",
                      ] + args + get_fmt_args(strict_hd, prefer_hls) + extra_args + [cur_url]

                      print(f"=== Trying: {label} (StrictHD={strict_hd}, HLS={prefer_hls}) ===", flush=True)
                      subprocess.run(cmd, check=False)

                      s_files = get_stage_files()
                      media_files = [p for p in s_files if p.suffix.lower() in (".mp4", ".mkv", ".webm", ".mp3", ".m4a", ".flac", ".wav", ".opus")]
                      if media_files:
                          if not is_audio and strict_hd and req_h >= 720:
                              heights = [inspect_media_quality(m)[0] for m in media_files]
                              max_det_h = max(heights) if heights else 0
                              print(f"Detected video height: {max_det_h}p", flush=True)
                              if 0 < max_det_h <= 360:
                                  print("Rejected 360p fallback! Advancing to next HD client...", flush=True)
                                  continue
                          for f in s_files:
                              dest_f = out_dir / f.name
                              shutil.move(str(f), str(dest_f))
                              if dest_f.suffix.lower() in (".mp4", ".mkv", ".webm", ".mp3", ".m4a", ".flac", ".wav", ".opus"):
                                  downloaded_media_for_url = dest_f
                          print(f"=== Success with: {label} ===", flush=True)
                          break

                  if downloaded_media_for_url and subtitles in ("embed", "files"):
                      srt_list, _ = fetch_subtitles_for_url(cur_url, downloaded_media_for_url.stem)
                      if srt_list:
                          best_srt = srt_list[0]
                          if subtitles == "embed" and downloaded_media_for_url.suffix.lower() in (".mp4", ".mkv") and downloaded_media_for_url.stat().st_size < 400 * 1024 * 1024:
                              emb_tmp = downloaded_media_for_url.with_name("sub_" + downloaded_media_for_url.name)
                              sub_c = "mov_text" if downloaded_media_for_url.suffix.lower() == ".mp4" else "srt"
                              ff_sub = ["/usr/bin/ffmpeg", "-y", "-i", str(downloaded_media_for_url), "-i", str(best_srt), "-c", "copy", "-c:s", sub_c, "-movflags", "+faststart", str(emb_tmp)]
                              if subprocess.run(ff_sub, check=False).returncode == 0 and emb_tmp.exists():
                                  emb_tmp.replace(downloaded_media_for_url)
                              else:
                                  shutil.copy2(str(best_srt), str(out_dir / f"{downloaded_media_for_url.stem}.srt"))
                          else:
                              for s_f in srt_list:
                                  shutil.copy2(str(s_f), str(out_dir / s_f.name))

              files = [p for p in out_dir.rglob("*") if p.is_file() and not p.name.endswith((".part", ".ytdl")) and p.stat().st_size > 0]
              if not files:
                  raise SystemExit("::error::הורדת המדיה נכשלה בכל הקליינטים")

              if (speed_val not in ("1", "1.0", "")) or norm_audio:
                  for fpath in list(files):
                      if fpath.suffix.lower() not in (".mp4", ".mkv", ".mp3", ".m4a", ".flac", ".wav", ".opus"):
                          continue
                      try:
                          spd = float(speed_val) if speed_val else 1.0
                      except Exception:
                          spd = 1.0
                      if spd <= 0 or (abs(spd - 1.0) < 0.01 and not norm_audio):
                          continue
                      tmp_p = fpath.with_name("proc_" + fpath.name)
                      af = []
                      if abs(spd - 1.0) >= 0.01:
                          af.append(f"atempo={spd}")
                      if norm_audio:
                          af.append("loudnorm=I=-16:TP=-1.5:LRA=11")
                      ff_cmd = ["/usr/bin/ffmpeg", "-y", "-i", str(fpath)]
                      if fpath.suffix.lower() in (".mp4", ".mkv", ".webm") and abs(spd - 1.0) >= 0.01:
                          ff_cmd += ["-filter:v", f"setpts=PTS/{spd}"]
                      if af:
                          ff_cmd += ["-filter:a", ",".join(af)]
                      ff_cmd += ["-movflags", "+faststart", str(tmp_p)]
                      if subprocess.run(ff_cmd, check=False).returncode == 0 and tmp_p.exists():
                          tmp_p.replace(fpath)

              media_out = [p for p in files if p.suffix.lower() in (".mp4", ".mkv", ".webm", ".mp3", ".m4a", ".flac", ".wav", ".opus")]
              # תיקון הבאג: primary_file נשאר תמיד קובץ הווידאו/אודיו ולא נדרס ע"י קובץ ה-SRT!
              primary_file = media_out[0] if media_out else files[0]
              detected_h, detected_dur, quality_report = inspect_media_quality(primary_file)

          file_mb = round(primary_file.stat().st_size / (1024 * 1024), 2)
          print(f">>> VERIFIED OUTPUT: {quality_report} ({file_mb} MB) <<<", flush=True)

          # בניית ארכיוני ZIP_STORED תקניים ב-100% (ללא חציית מגבלת 1.85GB לארכיון בודד):
          # אם סרטון 1080p/4K ארוך במיוחד שוקל מעל 1.85GB, מפצלים אותו ללא קידוד מחדש (-c copy) למספר חלקים תקניים
          # ואורזים כל חלק ב-ZIP_STORED נפרד, כך שכולם יורדים במלואם באיכות 1080p ללא שום פגימת ZIP וללא עצירה ב-99%!
          MAX_SINGLE_ZIP_BYTES = 1850 * 1024 * 1024
          if primary_file.stat().st_size > MAX_SINGLE_ZIP_BYTES and primary_file.suffix.lower() in (".mp4", ".mkv", ".webm"):
              num_parts = math.ceil(primary_file.stat().st_size / (1400 * 1024 * 1024))
              part_dur = max(60, int(math.ceil((detected_dur or 7200.0) / num_parts)))
              print(f"Large 1080p/4K file ({file_mb}MB > 1850MB). Splitting losslessly into {num_parts} parts ({part_dur}s each)...", flush=True)
              seg_pattern = str(out_dir / f"{primary_file.stem} - Part%02d{primary_file.suffix}")
              seg_cmd = [
                  "/usr/bin/ffmpeg", "-y", "-i", str(primary_file),
                  "-c", "copy", "-map", "0",
                  "-f", "segment", "-segment_time", str(part_dur),
                  "-reset_timestamps", "1",
                  "-movflags", "+faststart",
                  seg_pattern
              ]
              if subprocess.run(seg_cmd, check=False).returncode == 0:
                  primary_file.unlink(missing_ok=True)
                  files = sorted([p for p in out_dir.rglob("*") if p.is_file() and p.stat().st_size > 0])
                  media_out = [p for p in files if p.suffix.lower() in (".mp4", ".mkv", ".webm")]
                  if media_out:
                      primary_file = media_out[0]

          tag = "dl-" + req_id
          zip_paths = []
          cur_batch = []
          cur_batch_bytes = 0
          for f in files:
              f_sz = f.stat().st_size
              if cur_batch and (cur_batch_bytes + f_sz > MAX_SINGLE_ZIP_BYTES):
                  z_idx = len(zip_paths) + 1
                  zp = pkg_dir / f"{tag}-part{z_idx}.zip"
                  with zipfile.ZipFile(zp, "w", compression=zipfile.ZIP_STORED, allowZip64=False) as zf:
                      for bf in cur_batch:
                          zf.write(bf, bf.relative_to(out_dir))
                  zip_paths.append(zp)
                  cur_batch = [f]
                  cur_batch_bytes = f_sz
              else:
                  cur_batch.append(f)
                  cur_batch_bytes += f_sz

          if cur_batch:
              zp = pkg_dir / (f"{tag}.zip" if not zip_paths else f"{tag}-part{len(zip_paths)+1}.zip")
              with zipfile.ZipFile(zp, "w", compression=zipfile.ZIP_STORED, allowZip64=False) as zf:
                  for bf in cur_batch:
                      zf.write(bf, bf.relative_to(out_dir))
              zip_paths.append(zp)

          zip_path = zip_paths[0]
          zip_size = sum(z.stat().st_size for z in zip_paths)
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          blob_shas = []

          if len(zip_paths) == 1 and zip_size <= 35 * 1024 * 1024:
              raw_bytes = zip_path.read_bytes()
              chunk_size = 12 * 1024 * 1024
              for offset in range(0, len(raw_bytes), chunk_size):
                  chunk = raw_bytes[offset:offset + chunk_size]
                  b64_payload = json.dumps({"content": base64.b64encode(chunk).decode("ascii"), "encoding": "base64"})
                  p = subprocess.run(["gh", "api", f"repos/{repo}/git/blobs", "-q", ".sha", "--input", "-"], input=b64_payload, text=True, capture_output=True, check=False)
                  if p.returncode == 0 and p.stdout.strip():
                      blob_shas.append(p.stdout.strip())
              del raw_bytes

          MAX_GMAIL_RAW_BYTES = int(18.0 * 1024 * 1024)
          smtp_user = (
              os.environ.get("SMTP_USER", "").strip()
              or os.environ.get("EMAIL_USER", "").strip()
              or os.environ.get("GMAIL_USER", "").strip()
          )
          smtp_pass = (
              os.environ.get("SMTP_PASS", "").strip()
              or os.environ.get("EMAIL_PASS", "").strip()
              or os.environ.get("GMAIL_APP_PASSWORD", "").strip()
              or os.environ.get("GMAIL_PASS", "").strip()
          )
          secret_to = (
              os.environ.get("EMAIL_TO", "").strip()
              or os.environ.get("SMTP_TO", "").strip()
              or smtp_user
          )
          recipient = email_opt if (email_opt and "@" in email_opt) else secret_to

          email_sent_status = ""
          if send_email_flag and smtp_user and smtp_pass and recipient and "@" in recipient:
              try:
                  attach_target = primary_file if len(files) == 1 else zip_path
                  attach_note = f"מצורף הקובץ המקורי ({file_mb} MB)."
                  if attach_target.stat().st_size > MAX_GMAIL_RAW_BYTES and primary_file.suffix.lower() in (".mp4", ".mkv", ".webm"):
                      mail_mp4 = Path("/tmp/email_copy.mp4")
                      dur_sec = float(locals().get("detected_dur") or 600.0)
                      if dur_sec <= 1.0:
                          dur_sec = 600.0
                      target_v_kbps = max(95, int((15.5 * 8192) / max(10.0, dur_sec)) - 56)
                      target_h = 480 if target_v_kbps >= 280 else 360
                      ff_mail = [
                          "/usr/bin/ffmpeg", "-y", "-i", str(primary_file),
                          "-vf", f"scale=trunc(oh*a/2)*2:{target_h}",
                          "-c:v", "libx264", "-preset", "veryfast",
                          "-b:v", f"{target_v_kbps}k", "-maxrate", f"{int(target_v_kbps * 1.15)}k", "-bufsize", f"{target_v_kbps * 2}k",
                          "-c:a", "aac", "-b:a", "56k",
                          "-movflags", "+faststart",
                          "-fs", str(MAX_GMAIL_RAW_BYTES - 300000),
                          str(mail_mp4)
                      ]
                      subprocess.run(ff_mail, capture_output=True, text=True, check=False)
                      if mail_mp4.exists() and 0 < mail_mp4.stat().st_size <= MAX_GMAIL_RAW_BYTES:
                          attach_target = mail_mp4
                          comp_mb = round(mail_mp4.stat().st_size / (1024 * 1024), 1)
                          attach_note = f"הקובץ המלא ({file_mb}MB) ירד באיכות {quality_report} למחשב. למייל זה צורף עותק וידאו מותאם ({comp_mb}MB) עבור מגבלת Gmail."

                  msg = email.message.EmailMessage()
                  msg["Subject"] = f"YouTube Cloud Ultra [{quality_report}] - {primary_file.name}"
                  msg["From"] = smtp_user
                  msg["To"] = recipient
                  msg.set_content(
                      f"שלום,\n\n"
                      f"המשימה הושלמה בהצלחה בענן!\n"
                      f"• שם הקובץ: {primary_file.name}\n"
                      f"• איכות / סוג: {quality_report}\n"
                      f"• גודל הקובץ: {file_mb} MB\n"
                      f"• פירוט צרופה: {attach_note}\n"
                  )
                  if attach_target.exists() and attach_target.stat().st_size <= MAX_GMAIL_RAW_BYTES:
                      msg.add_attachment(
                          attach_target.read_bytes(),
                          maintype="application",
                          subtype="octet-stream",
                          filename=primary_file.name if attach_target != zip_path else zip_path.name
                      )
                  for srt_f in out_dir.glob("*.srt"):
                      if srt_f != attach_target and srt_f.stat().st_size <= 2 * 1024 * 1024:
                          msg.add_attachment(srt_f.read_bytes(), maintype="text", subtype="plain", filename=srt_f.name)

                  with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=90) as srv:
                      srv.login(smtp_user, smtp_pass)
                      srv.send_message(msg)
                  email_sent_status = f"נשלח למייל ({recipient})"
              except Exception as e:
                  email_sent_status = f"שגיאת מייל: {e}"

          notes = json.dumps({
              "v": 8.4,
              "size": zip_size,
              "quality_info": f"{quality_report} ({file_mb} MB)",
              "email_status": email_sent_status,
              "cloud_temp_path": "/tmp/stage -> /tmp/out -> /tmp/pkg/" + zip_path.name,
              "blobs": blob_shas
          }, ensure_ascii=False)

          rel_cmd = ["gh", "release", "create", tag] + [str(z) for z in zip_paths] + ["--repo", repo, "--title", tag, "--notes", notes]
          rel_proc = subprocess.run(rel_cmd, capture_output=True, text=True, check=False)
          if rel_proc.returncode != 0:
              for z in zip_paths:
                  subprocess.run(["gh", "release", "upload", tag, str(z), "--repo", repo, "--clobber"], check=False)
          EOF

      - name: Upload Backup Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dl-${{ inputs.request_id }}
          path: /tmp/out/*
          if-no-files-found: ignore
          retention-days: 1
