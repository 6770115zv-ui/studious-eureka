name: Cleanup Cloud Releases and Runs
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete All Releases, Tags and Workflow Runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CUR_RUN_ID: ${{ github.run_id }}
        run: |
          for page in 1 2 3 4 5; do
            RELEASES=$(gh api "repos/${GH_REPO}/releases?per_page=100" --jq '.[].tag_name' || true)
            [ -z "$RELEASES" ] && break
            for tag in $RELEASES; do
              gh release delete "$tag" --repo "$GH_REPO" --cleanup-tag --yes || true
            done
          done
          for page in 1 2 3 4 5 6 7 8; do
            RUNS=$(gh api "repos/${GH_REPO}/actions/runs?per_page=100" --jq '.workflow_runs[].id' || true)
            [ -z "$RUNS" ] && break
            DELETED=0
            for rid in $RUNS; do
              if [[ "$rid" != "$CUR_RUN_ID" ]]; then
                gh api -X DELETE "repos/${GH_REPO}/actions/runs/${rid}" || true
                DELETED=$((DELETED+1))
              fi
            done
            [ "$DELETED" -eq 0 ] && break
          done
