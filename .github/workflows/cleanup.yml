name: Cleanup Cloud Releases and Runs

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete All Temporary Releases and Tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASES=$(gh api "repos/${GH_REPO}/releases?per_page=100" --jq '.[].tag_name' || true)
          for tag in $RELEASES; do
            if [[ "$tag" == dl-* || "$tag" == rec-* ]]; then
              gh release delete "$tag" --repo "$GH_REPO" --cleanup-tag --yes || true
            fi
          done